    function getDefaultCoverSvg(langId) {
      return DEFAULT_COVERS[langId] || null;
    }

    function ensureBuiltins(s) {
      s.users = s.users || {};
      // Defensive: at least one user must exist (migrations create
      // luka + sofia but a hand-edited backup might lack them).
      if (Object.keys(s.users).length === 0) {
        s.users.luka = makeDefaultUser('luka', 'Luka', 'admin', '1234');
      }
      if (!s.activeUserId || !s.users[s.activeUserId]) {
        s.activeUserId = 'luka' in s.users ? 'luka' : Object.keys(s.users)[0];
      }

      // Per-user: register every BUILTIN_LANGUAGES entry, seed each
      // language's built-in story, set the default theme on first
      // registration. Languages already present are preserved.
      for (const uid in s.users) {
        const user = s.users[uid];
        user.languages = user.languages || {};

        for (const langId in BUILTIN_LANGUAGES) {
          const builtin = BUILTIN_LANGUAGES[langId];
          const existing = user.languages[langId];

          if (!existing) {
            user.languages[langId] = {
              ...builtin,
              theme: { ...builtin.theme },
              stories: [],
              lastTab: 'library',
              lastStoryId: null,
              readMode: 'full',
              themeVersion: 1   // mark as already-themed; preset picker can change later
            };
          } else {
            // Backfill missing fields on previously-stored language records.
            existing.theme   = existing.theme   || { ...builtin.theme };
            existing.ttsLang = existing.ttsLang || builtin.ttsLang;
            existing.flag    = existing.flag    || builtin.flag;
            existing.name    = existing.name    || builtin.name;
            if (!Array.isArray(existing.stories)) existing.stories = [];
            if (!existing.lastTab) existing.lastTab = 'library';
            if (existing.lastStoryId === undefined) existing.lastStoryId = null;
            if (!existing.readMode) existing.readMode = 'full';
            // One-time theme refresh for users from before the flag-theme
            // patch (German) or before Italian was a built-in.
            if (existing.themeVersion === undefined) {
              const preset = BUILTIN_STORIES[langId] && BUILTIN_STORIES[langId].defaultThemePreset;
              if (preset && THEME_PRESETS[preset]) {
                existing.theme = { ...THEME_PRESETS[preset].theme };
              }
              existing.themeVersion = 1;
            }
            // German default switched from `flag_de` → `flag_at`. Users
            // who are still on the previous default get bumped to the
            // new one; users who picked another preset (Cosmic, Ocean,
            // …) keep their choice. themeVersion=2 marks the swap done.
            if (langId === 'de' && existing.themeVersion < 2) {
              const currentPreset = matchPresetId(existing.theme);
              if (currentPreset === 'flag_de') {
                existing.theme = { ...THEME_PRESETS.flag_at.theme };
              }
              existing.themeVersion = 2;
            }
          }

          // Make sure each language's built-in story is registered.
          const builtinEntry = BUILTIN_STORIES[langId];
          if (builtinEntry && builtinEntry.story) {
            const storyId = builtinEntry.story.id;
            if (!user.languages[langId].stories.includes(storyId)) {
              user.languages[langId].stories.push(storyId);
            }
          }
        }
      }

      // Global story content: refresh each built-in story when its
      // _storyVersion has advanced. Sentences don't change, so existing
      // card indices stay valid (cards are append-only by index).
      for (const langId in BUILTIN_STORIES) {
        const builtinEntry = BUILTIN_STORIES[langId];
        const story = builtinEntry.story;
        if (!story) continue;
        const key = `${langId}::${story.id}`;
        const stored = s.storiesData[key];
        const storedVer  = (stored && stored._storyVersion) || 1;
        const builtinVer = story._storyVersion || 1;
        if (!stored || storedVer < builtinVer) {
          s.storiesData[key] = story;
        }
      }
    }

    /* ------------------------------------------------------------
       ensureCards — append-only seeding across every user. Each user
       gets their own card record per (langId, storyId, sentenceIdx);
       existing cards are never modified.
       ------------------------------------------------------------ */
    function ensureCards(s) {
      const newCard = () => ({
        ef: 2.5, interval: 0, reps: 0, nextReview: null,
        totalReviews: 0, correctReviews: 0, lastReviewed: null
      });
      for (const uid in s.users) {
        const user = s.users[uid];
        user.cards = user.cards || {};
        const langs = user.languages || {};
        for (const langId in langs) {
          const lang = langs[langId];
          if (!Array.isArray(lang.stories)) continue;

          for (const storyId of lang.stories) {
            const storyKey = `${langId}::${storyId}`;
            const story = s.storiesData[storyKey];
            if (!story) continue;

            // Sentence cards: id = `${langId}::${storyId}::${idx}`
            if (Array.isArray(story.sentences)) {
              story.sentences.forEach((_, idx) => {
                const cardId = `${langId}::${storyId}::${idx}`;
                if (!user.cards[cardId]) user.cards[cardId] = newCard();
              });
            }
            // Vocabulary cards (chunk-3a-patch): separate namespace so
            // they're tracked independently from sentence cards.
            // id = `${langId}::${storyId}::vocab::${idx}`
            if (Array.isArray(story.vocabulary)) {
              story.vocabulary.forEach((_, idx) => {
                const cardId = `${langId}::${storyId}::vocab::${idx}`;
                if (!user.cards[cardId]) user.cards[cardId] = newCard();
              });
            }
          }
        }
      }
    }

    /* ============================================================
       STATS HELPERS
       ============================================================ */
    function todayKey() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${dd}`;
    }

    function getStreak(s) {
      if (!Array.isArray(s.sessions) || s.sessions.length === 0) return 0;
      const dates = new Set(s.sessions.map(x => x.date));
      let streak = 0;
      const cur = new Date();
      // Walk back day-by-day until we hit a missing day.
      while (true) {
        const y = cur.getFullYear();
        const m = String(cur.getMonth() + 1).padStart(2, '0');
        const dd = String(cur.getDate()).padStart(2, '0');
        const key = `${y}-${m}-${dd}`;
        if (dates.has(key)) {
          streak++;
          cur.setDate(cur.getDate() - 1);
        } else {
          break;
        }
      }
      return streak;
    }

    /**
     * Walks all cards belonging to a (langId, optional storyId) prefix.
     * Returns counts: { new, due, mastered, total }.
     */
    function getStats(s, langId, storyId) {
      const now = Date.now();
      const prefix = storyId ? `${langId}::${storyId}::` : `${langId}::`;
      let n = 0, due = 0, mastered = 0, total = 0;
      for (const cardId in s.cards) {
        if (!cardId.startsWith(prefix)) continue;
        const c = s.cards[cardId];
        total++;
        if (c.reps === 0 && c.nextReview === null) {
          n++;
        } else if (c.nextReview !== null && c.nextReview <= now) {
          due++;
        }
        if (c.interval >= MASTERED_INTERVAL_DAYS) mastered++;
      }
      return { new: n, due, mastered, total };
    }

    /* ============================================================
       CHUNK 2 HELPERS — Levenshtein, normalize, SM-2, queue build,
       tier unlock, session activity logging.
       ============================================================ */
    function levenshtein(a, b) {
      const m = a.length, n = b.length;
      if (!m) return n; if (!n) return m;
      const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
      for (let i = 0; i <= m; i++) dp[i][0] = i;
      for (let j = 0; j <= n; j++) dp[0][j] = j;
      for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
        dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
      return dp[m][n];
    }

    function normalize(s) {
      return s.trim().toLowerCase().replace(/[.,!?;:'"]/g, '').replace(/\s+/g, ' ');
    }

    // SM-2: mutates `card` in place. quality is the user-facing 1..4.
    function sm2(card, quality) {
      const q = [0, 2, 3, 4, 5][quality];
      card.totalReviews++;
      card.lastReviewed = Date.now();
      if (q >= 3) {
        card.correctReviews++;
        if (card.reps === 0) card.interval = 1;
        else if (card.reps === 1) card.interval = 6;
        else card.interval = Math.round(card.interval * card.ef);
        card.reps++;
      } else {
        card.reps = 0;
        card.interval = 1;
      }
      card.ef = Math.max(1.3, card.ef + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02)));
      card.nextReview = Date.now() + card.interval * 86400000;
    }

    // Build a study queue: due cards + new cards (capped), then shuffled.
    // Build the SRS queue for a story. `source` selects which card
    // namespace to study: 'sentences' (sentence cards, the default
    // since chunk 1) or 'vocabulary' (word cards, chunk-3a-patch).
    // The two namespaces are independent — separate due/new pools.
    function buildCardQueue(languageId, storyId, source) {
      source = source || 'sentences';
      const storyPrefix = `${languageId}::${storyId}::`;
      const vocabMarker = '::vocab::';
      const allCards = Object.entries(state.cards)
        .filter(([k]) => {
          if (!k.startsWith(storyPrefix)) return false;
          const isVocab = k.includes(vocabMarker);
          return source === 'vocabulary' ? isVocab : !isVocab;
        })
        .map(([id, card]) => ({ id, ...card }));
      const now = Date.now();
      const due = allCards.filter(c => c.reps > 0 && c.nextReview !== null && c.nextReview <= now);
      const newC = allCards.filter(c => c.reps === 0 && c.nextReview === null)
        .slice(0, state.settings.newPerDay);
      let queue = [...due, ...newC].slice(0, state.settings.dailyCap);
      for (let i = queue.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [queue[i], queue[j]] = [queue[j], queue[i]];
      }
      return queue;
    }

    // Resolve a card's underlying content (sentence or vocab item)
    // from its id. Returns { type: 'sentence' | 'vocab', item, idx }.
    function getCardContent(cardId, story) {
      const parts = cardId.split('::');
      if (parts[2] === 'vocab') {
        const idx = parseInt(parts[3], 10);
        return { type: 'vocab', item: (story.vocabulary || [])[idx], idx };
      }
      const idx = parseInt(parts[2], 10);
      return { type: 'sentence', item: (story.sentences || [])[idx], idx };
    }

    // Tier 1 always unlocked. Tier N (N>1) unlocks when prev tier has
    // ≥20 FIRST-ATTEMPT answers at ≥80% first-attempt accuracy. Retry
    // attempts inflate lifetime stats (shown in the UI) but are excluded
    // here to prevent grinding the same wrong test until memorized.
    function tierUnlocked(tier, languageId, storyId) {
      if (tier === 1) return true;
      const prevTier = tier - 1;
      const prefix = `${languageId}::${storyId}::tier${prevTier}::`;
      const records = Object.entries(state.testAttempts)
        .filter(([k]) => k.startsWith(prefix))
        .map(([, v]) => v);
      const totalFirst   = records.reduce((a, x) => a + (x.firstAttempts        || 0), 0);
      const correctFirst = records.reduce((a, x) => a + (x.firstAttemptsCorrect || 0), 0);
      if (totalFirst < 20) return false;
      return (correctFirst / totalFirst) >= 0.8;
    }

    // Append (or update) today's session record so the streak counter
    // ticks and session-correctness stats accumulate.
    function logActivity(langId, storyId, correct) {
      const today = todayKey();
      let s = state.sessions.find(x =>
        x.date === today && x.languageId === langId && x.storyId === storyId);
      if (!s) {
        s = { date: today, count: 0, correct: 0, languageId: langId, storyId: storyId };
        state.sessions.push(s);
      }
      s.count++;
      if (correct) s.correct++;
    }

    // Settings live per-user in v3. Backfill defaults for every user.
    function ensureSettings(s) {
      for (const uid in (s.users || {})) {
        const user = s.users[uid];
        user.settings = user.settings || {};
        if (user.settings.newPerDay === undefined) user.settings.newPerDay = 10;
        if (user.settings.dailyCap  === undefined) user.settings.dailyCap  = 30;
        if (!user.settings.cardMode) user.settings.cardMode = 'type';
        if (!user.settings.cardSource) user.settings.cardSource = 'sentences';
        if (user.settings.ttsRate   === undefined) user.settings.ttsRate   = 0.9;
        if (user.settings.theme     === undefined) user.settings.theme     = 'dark';
      }
    }

    // Chunk 3a runtime defaults — global fields. Idempotent.
    function ensureChunk3a(s) {
      if (!s.testPacks) s.testPacks = {};
      if (s.lastBackup === undefined) s.lastBackup = null;
    }

    // testAttempts is per-user in v3. Walk every user and rewrite any
    // remaining 4-part keys to 5-part `lang::story::tierN::builtin::idx`.
    function migrateTestAttempts(s) {
      for (const uid in (s.users || {})) {
        const user = s.users[uid];
        if (!user.testAttempts) { user.testAttempts = {}; continue; }
        let migrated = 0;
        const updated = {};
        for (const [key, val] of Object.entries(user.testAttempts)) {
          const parts = key.split('::');
          if (parts.length === 4) {
            const [lang, story, tier, idx] = parts;
            updated[`${lang}::${story}::${tier}::builtin::${idx}`] = val;
            migrated++;
          } else {
            updated[key] = val;
          }
        }
        if (migrated > 0) user.testAttempts = updated;
      }
    }

    /* ============================================================
       CHUNK 3A — Toasts, file I/O, validators, backup, modals.
       ============================================================ */

    // Toast stack — auto-dismiss after 3s, slide-down exit animation.
    function showToast(message, variant = 'info') {
      const stack = document.getElementById('toast-stack');
      if (!stack) return;
      const t = document.createElement('div');
      t.className = `toast ${variant}`;
      t.textContent = message;
      stack.appendChild(t);
      setTimeout(() => {
        t.classList.add('exiting');
        setTimeout(() => t.remove(), 250);
      }, 3000);
    }

    // Open a native file picker, parse JSON, hand off to callback.
    function importJSONFile(callback) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json,application/json';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const data = JSON.parse(reader.result);
            callback(data);
          } catch {
            showToast('Invalid JSON file', 'error');
          }
        };
        reader.onerror = () => showToast('Could not read file', 'error');
        reader.readAsText(file);
      };
      input.click();
    }

    /* Multi-file picker — accepts a JSON file and (optionally) an image.
       The user can select both at once (Cmd/Shift-click in a file picker)
       to attach a cover image when adding a language or story. Callback
       gets (json, imageDataUrl). Either argument may be null. */
    function importJSONWithImage(callback) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json,application/json,image/*';
      input.multiple = true;
      input.onchange = (e) => {
        const files = Array.from(e.target.files || []);
        if (files.length === 0) return;
        let json = null;
        let imageRaw = null;
        let pending = files.length;
        const finish = async () => {
          if (--pending > 0) return;
          let imageOut = null;
          if (imageRaw) {
            try { imageOut = await downsizeImage(imageRaw, 1280, 720, 0.75); }
            catch { imageOut = imageRaw; }
          }
          callback(json, imageOut);
        };
        files.forEach(file => {
          const isJson = file.type === 'application/json' || /\.json$/i.test(file.name);
          const isImage = file.type.startsWith('image/');
          if (!isJson && !isImage) { finish(); return; }
          const reader = new FileReader();
          reader.onload = () => {
            if (isJson) {
              try { json = JSON.parse(reader.result); }
              catch { showToast('Invalid JSON file', 'error'); }
            } else if (isImage) {
              imageRaw = reader.result;
            }
            finish();
          };
          reader.onerror = () => finish();
          if (isJson) reader.readAsText(file);
          else reader.readAsDataURL(file);
        });
      };
      input.click();
    }

    /* Single image picker — used when adding/changing a cover after
       the language/story is already imported. Callback gets a downsized
       JPEG data URL. */
    function importImageFile(callback) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async () => {
          try {
            const small = await downsizeImage(reader.result, 1280, 720, 0.75);
            callback(small);
          } catch {
            callback(reader.result);
          }
        };
        reader.onerror = () => showToast('Could not read image', 'error');
        reader.readAsDataURL(file);
      };
      input.click();
    }

    /* Downsize an image to fit within (maxW × maxH) and re-encode as
       JPEG at the given quality. Keeps localStorage usage manageable —
       a typical phone photo (~3 MB) shrinks to ~80 KB. */
    function downsizeImage(dataUrl, maxW, maxH, quality) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          const ratio = Math.min(maxW / width, maxH / height, 1);
          width = Math.round(width * ratio);
          height = Math.round(height * ratio);
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          try {
            resolve(canvas.toDataURL('image/jpeg', quality));
          } catch (err) {
            reject(err);
          }
        };
        img.onerror = reject;
        img.src = dataUrl;
      });
    }

    // Trigger a browser download of a string blob.
    function downloadBlob(filename, text, mime = 'application/json') {
      const blob = new Blob([text], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    /* ---------- Validators — return { valid, errors[] } ---------- */
    const HEX6 = /^#[0-9a-fA-F]{6}$/;
    const LANG_ID_RE = /^[a-z]{2,5}$/;
    const STORY_ID_RE = /^story-[a-z0-9-]+$/;
    const PACK_ID_RE = /^[a-z0-9-]+$/;
    const THEME_FIELDS = ['gradient1', 'gradient2', 'gradient3', 'bgFrom', 'bgVia', 'bgTo', 'accent'];

    function validateLanguage(json) {
      const errors = [];
      if (!json || typeof json !== 'object') errors.push('Not a JSON object');
      else {
        if (json.schemaVersion !== 1) errors.push('schemaVersion must be 1');
        if (!LANG_ID_RE.test(json.id || '')) errors.push('id must match /^[a-z]{2,5}$/');
        if (state.languages[json.id]) errors.push(`Language "${json.id}" already exists`);
        if (!json.name || typeof json.name !== 'string') errors.push('name required');
        if (!json.flag || typeof json.flag !== 'string') errors.push('flag required');
        if (!json.ttsLang || typeof json.ttsLang !== 'string') errors.push('ttsLang required');
        if (!json.theme || typeof json.theme !== 'object') errors.push('theme object required');
        else {
          for (const f of THEME_FIELDS) {
            if (!HEX6.test(json.theme[f] || '')) errors.push(`theme.${f} must be a 6-digit hex color`);
          }
        }
      }
      return { valid: errors.length === 0, errors };
    }

    function validateStory(json) {
      const errors = [];
      if (!json || typeof json !== 'object') errors.push('Not a JSON object');
      else {
        if (json.schemaVersion !== 1) errors.push('schemaVersion must be 1');
        if (!json.languageId || !state.languages[json.languageId])
          errors.push(`languageId "${json.languageId}" not installed`);
        if (!STORY_ID_RE.test(json.id || '')) errors.push('id must match /^story-[a-z0-9-]+$/');
        if (!json.title || typeof json.title !== 'string') errors.push('title required');
        if (!json.level || typeof json.level !== 'string') errors.push('level required');
        if (!Array.isArray(json.sentences) || json.sentences.length === 0)
          errors.push('sentences[] non-empty required');
        else json.sentences.forEach((s, i) => {
          if (!s || typeof s.de !== 'string' || typeof s.en !== 'string')
            errors.push(`sentences[${i}] needs de + en strings`);
        });
        if (!Array.isArray(json.grammarRules)) errors.push('grammarRules[] required');
        else json.grammarRules.forEach((r, i) => {
          if (!r.name) errors.push(`grammarRules[${i}].name required`);
          if (![1, 2, 3].includes(r.tier)) errors.push(`grammarRules[${i}].tier must be 1, 2, or 3`);
          if (!r.desc) errors.push(`grammarRules[${i}].desc required`);
          // Optional Rules-tab fields (chunk-3a-patch). Validate shape if
          // present; missing is fine — old story JSONs stay valid.
          if (r.longExplanation !== undefined && typeof r.longExplanation !== 'string')
            errors.push(`grammarRules[${i}].longExplanation must be a string`);
          if (r.examples !== undefined) {
            if (!Array.isArray(r.examples)) errors.push(`grammarRules[${i}].examples must be an array`);
            else r.examples.forEach((ex, j) => {
              if (!ex || typeof ex.de !== 'string' || typeof ex.en !== 'string')
                errors.push(`grammarRules[${i}].examples[${j}] needs de + en strings`);
            });
          }
          if (r.tips !== undefined && !Array.isArray(r.tips))
            errors.push(`grammarRules[${i}].tips must be an array of strings`);
          // Optional `table` for paradigm-friendly rules. Shape:
          // { title?: str, headers: [str], rows: [[str]], note?: str }.
          if (r.table !== undefined) {
            const t = r.table;
            if (!t || typeof t !== 'object') errors.push(`grammarRules[${i}].table must be an object`);
            else {
              if (!Array.isArray(t.headers)) errors.push(`grammarRules[${i}].table.headers must be an array`);
              if (!Array.isArray(t.rows)) errors.push(`grammarRules[${i}].table.rows must be a 2D array`);
              else t.rows.forEach((row, k) => {
                if (!Array.isArray(row)) errors.push(`grammarRules[${i}].table.rows[${k}] must be an array`);
              });
            }
          }
        });
        // Optional vocabulary[] — author-curated word list. Each item
        // needs `de` + `en`; everything else is optional metadata.
        if (json.vocabulary !== undefined) {
          if (!Array.isArray(json.vocabulary)) errors.push('vocabulary must be an array');
          else json.vocabulary.forEach((v, i) => {
            if (!v || typeof v.de !== 'string' || typeof v.en !== 'string')
              errors.push(`vocabulary[${i}] needs de + en strings`);
          });
        }
        if (!Array.isArray(json.grammarTests)) errors.push('grammarTests[] required');
        else json.grammarTests.forEach((t, i) => {
          if (![1, 2, 3].includes(t.tier)) errors.push(`grammarTests[${i}].tier must be 1, 2, or 3`);
          if (!t.rule) errors.push(`grammarTests[${i}].rule required`);
          if (!t.en || !t.de) errors.push(`grammarTests[${i}] needs en + de`);
        });
      }
      return { valid: errors.length === 0, errors };
    }

    function validateTestPack(json) {
      const errors = [];
      const warnings = [];
      if (!json || typeof json !== 'object') errors.push('Not a JSON object');
      else {
        if (json.schemaVersion !== 1) errors.push('schemaVersion must be 1');
        if (json.type !== 'test-pack') errors.push('type must be "test-pack"');
        if (!json.languageId || !state.languages[json.languageId])
          errors.push(`languageId "${json.languageId}" not installed`);
        const story = json.languageId && json.storyId
          ? state.storiesData[`${json.languageId}::${json.storyId}`] : null;
        if (!story) errors.push(`storyId "${json.storyId}" not found under that language`);
        if (!PACK_ID_RE.test(json.id || '')) errors.push('id must match /^[a-z0-9-]+$/');
        if (json.languageId && state.testPacks[`${json.languageId}::${json.id}`])
          errors.push(`Test pack "${json.id}" already exists for this language`);
        if (!Array.isArray(json.tests) || json.tests.length === 0)
          errors.push('tests[] non-empty required');
        else json.tests.forEach((t, i) => {
          if (![1, 2, 3].includes(t.tier)) errors.push(`tests[${i}].tier must be 1, 2, or 3`);
          if (!t.rule) errors.push(`tests[${i}].rule required`);
          if (!t.en || !t.de) errors.push(`tests[${i}] needs en + de`);
        });
        // Soft-warn when rule names don't match the story's grammarRules.
        if (story && Array.isArray(json.tests)) {
          const known = new Set(story.grammarRules.map(r => r.name));
          for (const t of json.tests) {
            if (t.rule && !known.has(t.rule)) {
              warnings.push(`Rule "${t.rule}" is not in this story's grammarRules`);
              break;
            }
          }
        }
      }
      return { valid: errors.length === 0, errors, warnings };
    }

    /* ---------- Generic modal helpers ---------- */
    function closeModal() {
      document.getElementById('modal-root').innerHTML = '';
    }

    // Yes/no confirmation modal — resolves true on confirm, false on cancel.
    function confirmModal({ title, body, confirmLabel = 'Confirm', danger = false }) {
      return new Promise((resolve) => {
        const root = document.getElementById('modal-root');
        const btnClass = danger ? 'danger-btn' : 'gradient-btn';
        root.innerHTML = `
          <div class="modal-overlay" id="modal-overlay">
            <div class="glass modal">
              <div class="modal-title">${escapeHtml(title)}</div>
              <div class="modal-body"><p>${body}</p></div>
              <div class="btn-row">
                <button class="ghost-btn" id="m-cancel" style="flex:1">Cancel</button>
                <button class="${btnClass}" id="m-confirm" style="flex:1">${escapeHtml(confirmLabel)}</button>
              </div>
            </div>
          </div>`;
        const finish = (val) => { closeModal(); resolve(val); };
        document.getElementById('modal-overlay').addEventListener('click', (e) => {
          if (e.target.id === 'modal-overlay') finish(false);
        });
        document.getElementById('m-cancel').addEventListener('click', () => finish(false));
        document.getElementById('m-confirm').addEventListener('click', () => finish(true));
      });
    }

    // Text-confirmation modal — user must type `expected` to confirm.
    function textConfirmModal({ title, body, expected, confirmLabel = 'Confirm' }) {
      return new Promise((resolve) => {
        const root = document.getElementById('modal-root');
        root.innerHTML = `
          <div class="modal-overlay" id="modal-overlay">
            <div class="glass modal">
              <div class="modal-title">${escapeHtml(title)}</div>
              <div class="modal-body">
                <p>${body}</p>
                <input type="text" id="m-input" autocapitalize="characters" autocorrect="off" autocomplete="off" spellcheck="false" placeholder="${escapeHtml(expected)}">
              </div>
              <div class="btn-row">
                <button class="ghost-btn" id="m-cancel" style="flex:1">Cancel</button>
                <button class="danger-btn" id="m-confirm" style="flex:1" disabled>${escapeHtml(confirmLabel)}</button>
              </div>
            </div>
          </div>`;
        const inp = document.getElementById('m-input');
        const cBtn = document.getElementById('m-confirm');
        const finish = (val) => { closeModal(); resolve(val); };
        inp.addEventListener('input', () => {
          cBtn.disabled = inp.value.trim() !== expected;
          cBtn.style.opacity = cBtn.disabled ? '0.5' : '1';
        });
        document.getElementById('modal-overlay').addEventListener('click', (e) => {
          if (e.target.id === 'modal-overlay') finish(false);
        });
        document.getElementById('m-cancel').addEventListener('click', () => finish(false));
        cBtn.addEventListener('click', () => {
          if (!cBtn.disabled) finish(true);
        });
        try { inp.focus(); } catch {}
      });
    }

    /* ---------- Backup export / import ---------- */
    function exportBackup() {
      state.lastBackup = Date.now();
      saveState();
      const date = new Date().toISOString().slice(0, 10);
      downloadBlob(`storyglot-backup-${date}.json`, JSON.stringify(state, null, 2));
      showToast('Backup exported', 'success');
      render();
    }

    async function importBackup(data) {
      if (!data || typeof data !== 'object') {
        showToast('Backup file is not valid JSON', 'error');
        return;
      }
      const ver = typeof data.schemaVersion === 'number' ? data.schemaVersion : 0;
      if (ver > CURRENT_SCHEMA) {
        showToast('Backup is from a newer version. Please update the app.', 'error');
        return;
      }
      const ok = await confirmModal({
        title: 'Replace all data?',
        body: 'This will overwrite ALL current progress, languages, and stories with the imported backup. This cannot be undone.',
        confirmLabel: 'Replace',
        danger: true
      });
      if (!ok) return;
      try {
        let migrated = data;
        if (ver < CURRENT_SCHEMA) migrated = migrate(migrated);
        ensureBuiltins(migrated);
        ensureSettings(migrated);
        ensureChunk3a(migrated);
        migrateTestAttempts(migrated);
        ensureCards(migrated);
        replaceRawState(migrated);     // mutate in place — proxy keeps working
        cardSession = null;
        testSession = null;
        loggedIn = false;              // imported backup may have a different user; force login
        saveState();
        render();                      // shows login picker
        showToast('Backup imported', 'success');
      } catch (err) {
        console.error(err);
        showToast('Failed to import backup', 'error');
      }
    }

    function resetAllData() {
      localStorage.removeItem(STORAGE_KEY);
      const fresh = defaultState();
      ensureBuiltins(fresh);
      ensureSettings(fresh);
      ensureChunk3a(fresh);
      ensureCards(fresh);
      replaceRawState(fresh);
      cardSession = null;
      testSession = null;
      loggedIn = false;                // back to picker after reset
      saveState();
      render();
      showToast('All data reset', 'info');
    }

    /* ============================================================
       THEME — write CSS variables on :root.
       ============================================================ */
    function applyTheme(theme) {
      const r = document.documentElement.style;
      r.setProperty('--bg-from', theme.bgFrom);
      r.setProperty('--bg-via', theme.bgVia);
      r.setProperty('--bg-to', theme.bgTo);
      r.setProperty('--grad-1', theme.gradient1);
      r.setProperty('--grad-2', theme.gradient2);
      r.setProperty('--grad-3', theme.gradient3);
      r.setProperty('--accent', theme.accent);
    }

    /* ============================================================
       TTS — Web Speech API. iOS Safari requires speak() to be
       triggered from a user gesture; we only call it from button
       and row click handlers, never on load.
       ============================================================ */
    let voices = [];
    function loadVoices() {
      try { voices = window.speechSynthesis.getVoices() || []; } catch { voices = []; }
    }
    if (typeof window !== 'undefined' && window.speechSynthesis) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function pickVoice(langCode) {
      if (!voices.length) loadVoices();
      // Prefer the user-selected voice for the active language if it
      // matches the langCode prefix (e.g., set in Settings → Voice).
      try {
        const lang = state && state.languages
          ? state.languages[state.activeLanguageId] : null;
        if (lang && lang.ttsVoice) {
          const chosen = voices.find(v => v.name === lang.ttsVoice);
          if (chosen && chosen.lang && chosen.lang.toLowerCase()
              .startsWith(langCode.split('-')[0].toLowerCase())) {
            return chosen;
          }
        }
      } catch {}
      const exact = voices.find(v => v.lang === langCode);
      if (exact) return exact;
      const prefix = langCode.split('-')[0];
      return voices.find(v => v.lang && v.lang.toLowerCase().startsWith(prefix.toLowerCase())) || null;
    }

    function speak(text, langCode, opts = {}) {
      return new Promise((resolve) => {
        if (!('speechSynthesis' in window)) return resolve();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = langCode;
        // Default rate comes from global settings; explicit opts.rate wins.
        const fallbackRate = (state && state.settings && state.settings.ttsRate) || 0.9;
        u.rate = opts.rate ?? fallbackRate;
        const v = pickVoice(langCode);
        if (v) u.voice = v;
        // iOS sometimes never fires onend — resolve on error too.
        u.onend = () => resolve();
        u.onerror = () => resolve();
        window.speechSynthesis.speak(u);
      });
    }

    function stopSpeak() {
      try { window.speechSynthesis.cancel(); } catch {}
    }

    /* ============================================================
       STATE — multi-user. `rawState` is the literal localStorage
       object; `state` is a Proxy that auto-routes per-user fields
       (cards, settings, languages, ...) to the active user.
       ============================================================ */
    let rawState = loadState();
    ensureBuiltins(rawState);
    ensureSettings(rawState);
    ensureChunk3a(rawState);
    migrateTestAttempts(rawState);
    ensureCards(rawState);
    let state = makeStateProxy(rawState);
    saveState();

    // In-memory ephemeral session state.
    let cardSession = null;
    let testSession = null;
    let swipeState  = { active: false, startX: 0, dx: 0, target: null, committed: false };

    // Login gate: every fresh page load shows the user picker (Netflix-style).
    // Once a profile is selected (and its password verified), `loggedIn`
    // flips true for the rest of the session. Switching user resets it.
    let loggedIn = false;

    // Active story tracker.
    function getActiveLang() {
      const lang = state.languages && state.languages[state.activeLanguageId];
      return lang || null;
    }
    function getActiveStoryId() { const l = getActiveLang(); return l && l.lastStoryId; }
    function getStory(langId, storyId) { return state.storiesData[`${langId}::${storyId}`]; }

    // Initial theme — read from active user's active language.
    if (getActiveLang() && getActiveLang().theme) applyTheme(getActiveLang().theme);

    // Replace state in place (preserves the proxy reference so all
    // closures keep working). Used by reset / import-backup.
    function replaceRawState(newRaw) {
      Object.keys(rawState).forEach(k => delete rawState[k]);
      Object.assign(rawState, newRaw);
    }

    /* ============================================================
       PLAYBACK STATE — for the Read tab "Listen to whole story"
       ============================================================ */
    let playback = { active: false, idx: -1, version: 0 };

    function startPlayAll(sentences, langCode) {
      stopPlayAll();
      playback.active = true;
      playback.version++;
      const myVersion = playback.version;

      (async () => {
        for (let i = 0; i < sentences.length; i++) {
          if (!playback.active || playback.version !== myVersion) break;
          playback.idx = i;
          updatePlayHighlight();
          updatePlayButton();
          await speak(sentences[i].de, langCode);
          // Brief pause between sentences (skipped if cancelled).
          if (!playback.active || playback.version !== myVersion) break;
          await new Promise(r => setTimeout(r, 280));
        }
        if (playback.version === myVersion) {
          playback.active = false;
          playback.idx = -1;
          updatePlayHighlight();
          updatePlayButton();
        }
      })();
    }

    function stopPlayAll() {
      playback.active = false;
      playback.idx = -1;
      stopSpeak();
      updatePlayHighlight();
      updatePlayButton();
    }

    function updatePlayHighlight() {
      // Refresh the .active class on sentence spans/rows without
      // re-rendering the whole tab (avoids audio glitches).
      document.querySelectorAll('[data-sent-idx]').forEach(el => {
        const idx = Number(el.getAttribute('data-sent-idx'));
        el.classList.toggle('active', idx === playback.idx);
      });
    }

    function updatePlayButton() {
      const btn = document.getElementById('btn-play-all');
      if (!btn) return;
      btn.textContent = playback.active ? '⏹  Stop' : '🔊  Listen to whole story';
    }

    /* ============================================================
       RENDERERS — each returns an HTML string. The top-level
       render() composes them into #app. After insertion we wire
       up event handlers for that pass.
       ============================================================ */
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function renderHeader() {
      const lang = getActiveLang();
      return `
        <div class="app-header">
          <div class="app-logo">
            <span class="gradient-text">STORYGLOT</span>
            <span style="color: var(--accent); margin-left: 4px;">✦</span>
          </div>
          <button class="lang-pill" id="btn-lang">
            <span class="flag">${lang.flag}</span>
            <span>${escapeHtml(lang.name).toUpperCase()}</span>
          </button>
        </div>
      `;
    }

    function renderStats() {
      const langId = state.activeLanguageId;
      const s = getStats(state, langId);
      const streak = getStreak(state);
      const pill = (label, val) => `
        <div class="stat-pill">
          <div class="label">${label}</div>
          <div class="value gradient-text">${val}</div>
        </div>`;
      return `
        <div class="stats">
          ${pill('Streak 🔥', streak)}
          ${pill('New', s.new)}
          ${pill('Due', s.due)}
          ${pill('Mastered', s.mastered)}
        </div>
      `;
    }

    function renderTabBar() {
      const lang = getActiveLang();
      const tabs = [
        { id: 'library',  label: 'Library',  icon: '📚' },
        { id: 'read',     label: 'Read',     icon: '📖' },
        { id: 'rules',    label: 'Rules',    icon: '📋' },
        { id: 'cards',    label: 'Cards',    icon: '🎴' },
        { id: 'test',     label: 'Test',     icon: '🎯' },
        { id: 'settings', label: 'Settings', icon: '⚙️' }
      ];
      return `
        <div class="tab-cards">
          ${tabs.map(t => `
            <button class="tab-card ${lang.lastTab === t.id ? 'active' : ''}" data-tab="${t.id}">
              <span class="tab-icon">${t.icon}</span>
              <span class="tab-label">${t.label}</span>
            </button>
          `).join('')}
        </div>
      `;
    }

    function renderLibrary() {
      const lang = getActiveLang();
      const hero = renderHeroCover(lang);

      if (!lang.stories.length) {
        return hero + `<div class="glass empty-state">
          <div class="em-icon">📚</div>
          No stories yet for this language.
        </div>` + renderProgressSection();
      }

      const cards = lang.stories.map(storyId => {
        const story = getStory(lang.id, storyId);
        if (!story) return '';
        const stats = getStats(state, lang.id, storyId);
        const total = stats.total;
        const masteredPct = total ? Math.round((stats.mastered / total) * 100) : 0;
        const grammarCount = (story.grammarRules || []).length;

        // Cover: uploaded image OR per-language SVG default fallback.
        const coverHtml = renderStoryCover(lang.id, story);
        const cardClass = coverHtml ? 'glass story-card with-cover' : 'glass story-card';

        return `
          <div class="${cardClass}">
            ${coverHtml}
            <div class="tags">
              <span class="tag-pill">${escapeHtml(story.level)}</span>
              <span class="tag-pill">Story #${story.order || 1}</span>
            </div>
            <div class="story-title gradient-text">${escapeHtml(story.title)}</div>
            <div class="story-meta">${story.sentences.length} sentences · ${grammarCount} grammar rules</div>
            <div class="progress"><div class="progress-fill" style="width: ${masteredPct}%"></div></div>
            <div class="story-foot">${stats.mastered} / ${total} mastered · ${stats.due} due today</div>
            <button class="gradient-btn" data-open-story="${escapeHtml(storyId)}">
              Continue Learning →
            </button>
          </div>
        `;
      }).join('');
      return hero + cards + renderProgressSection();
    }

    /* Hero cover at top of Library: uploaded image overrides default
       per-language SVG art. Keeps the layout if neither is present
       (renders a gradient fallback). */
    function renderHeroCover(lang) {
      if (!lang) return '';
      const uploaded = lang.coverImage || null;
      const svgArt = !uploaded ? getDefaultCoverSvg(lang.id) : null;

      const bgStyle = uploaded
        ? `background-image: url('${escapeHtml(uploaded)}');`
        : '';
      const artHtml = !uploaded && svgArt
        ? `<div class="cover-art">${svgArt}</div>`
        : !uploaded
          ? `<div class="cover-art" style="background: linear-gradient(135deg, var(--grad-1), var(--grad-2) 55%, var(--grad-3));"></div>`
          : '';

      const totalStories = (lang.stories || []).length;
      const sub = `${totalStories} ${totalStories === 1 ? 'story' : 'stories'}`;

      return `
        <div class="hero-cover" style="${bgStyle}">
          ${artHtml}
          <div class="hero-overlay"></div>
          <div class="hero-title">
            <div>
              <div class="hero-name">${escapeHtml(lang.name).toUpperCase()}</div>
              <div class="hero-sub">${sub}</div>
            </div>
            <div class="hero-flag">${lang.flag || ''}</div>
          </div>
        </div>
      `;
    }

    /* Per-story cover panel, shown on the right side of the story tile.
       Falls back to the language's default SVG art when no upload. */
    function renderStoryCover(langId, story) {
      const uploaded = story && story.coverImage;
      if (uploaded) {
        return `<div class="story-cover" style="background-image: url('${escapeHtml(uploaded)}');"></div>`;
      }
      const svgArt = getDefaultCoverSvg(langId);
      if (svgArt) {
        return `<div class="story-cover svg-cover">${svgArt}</div>`;
      }
      return '';
    }

    /* ---------- Library: collapsible Progress section ---------- */
    function getActivityByDay(days = 30) {
      // Last `days` days inclusive of today, oldest → newest. Each entry
      // sums session.count for the active language across all stories.
      const langId = state.activeLanguageId;
      const sessions = state.sessions || [];
      const byDate = new Map();
      for (const s of sessions) {
        if (s.languageId && s.languageId !== langId) continue;
        byDate.set(s.date, (byDate.get(s.date) || 0) + (s.count || 0));
      }
      const out = [];
      const cur = new Date();
      cur.setHours(0, 0, 0, 0);
      cur.setDate(cur.getDate() - (days - 1));
      for (let i = 0; i < days; i++) {
        const y = cur.getFullYear();
        const m = String(cur.getMonth() + 1).padStart(2, '0');
        const dd = String(cur.getDate()).padStart(2, '0');
        const key = `${y}-${m}-${dd}`;
        out.push({ date: key, count: byDate.get(key) || 0 });
        cur.setDate(cur.getDate() + 1);
      }
      return out;
    }

    // Distinct lowercase German tokens across all mastered cards
    // (interval >= 21) for the active language.
    function getMasteredVocabCount() {
      const langId = state.activeLanguageId;
      const lang = state.languages[langId];
      const tokens = new Set();
      const wordRe = /[a-zA-ZÀ-ſß]+/g;
      for (const cardId in state.cards) {
        if (!cardId.startsWith(`${langId}::`)) continue;
        const card = state.cards[cardId];
        if (card.interval < MASTERED_INTERVAL_DAYS) continue;
        const [, storyId, idxStr] = cardId.split('::');
        const story = state.storiesData[`${langId}::${storyId}`];
        if (!story) continue;
        const sentence = story.sentences[parseInt(idxStr, 10)];
        if (!sentence || !sentence.de) continue;
        const ms = sentence.de.match(wordRe);
        if (ms) for (const w of ms) tokens.add(w.toLowerCase());
      }
      return tokens.size;
    }

    // Smooth bezier path through the daily counts. Y is inverted because
    // SVG (0,0) is top-left.
    function buildSparklinePath(values, w, h) {
      if (values.length === 0) return '';
      const max = Math.max(1, ...values);
      const stepX = w / Math.max(1, values.length - 1);
      const pad = 4;
      const usableH = h - pad * 2;
      const points = values.map((v, i) => [
        i * stepX,
        pad + (1 - v / max) * usableH
      ]);
      let d = `M ${points[0][0].toFixed(1)} ${points[0][1].toFixed(1)}`;
      for (let i = 1; i < points.length; i++) {
        const [x0, y0] = points[i - 1];
        const [x1, y1] = points[i];
        const cx = (x0 + x1) / 2;
        d += ` C ${cx.toFixed(1)} ${y0.toFixed(1)}, ${cx.toFixed(1)} ${y1.toFixed(1)}, ${x1.toFixed(1)} ${y1.toFixed(1)}`;
      }
      return d;
    }

    function renderProgressSection() {
      const open = !!state.settings.progressOpen;
      const streak = getStreak(state);
      const activity = getActivityByDay(30);
      const totalCards = activity.reduce((a, x) => a + x.count, 0);
      const vocab = getMasteredVocabCount();

      // Sparkline SVG.
      const w = 720, h = 80;
      const counts = activity.map(a => a.count);
      const path = buildSparklinePath(counts, w, h);
      const svg = `
        <svg class="sparkline" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
          <defs>
            <linearGradient id="sparkGrad" x1="0" x2="1" y1="0" y2="0">
              <stop offset="0%" stop-color="var(--grad-1)"/>
              <stop offset="60%" stop-color="var(--grad-2)"/>
              <stop offset="100%" stop-color="var(--grad-3)"/>
            </linearGradient>
            <filter id="sparkGlow" x="-10%" y="-10%" width="120%" height="120%">
              <feGaussianBlur stdDeviation="2" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <path d="${path}" fill="none" stroke="url(#sparkGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#sparkGlow)"/>
        </svg>
      `;

      // Per-story accuracy rows.
      const lang = getActiveLang();
      const storyRows = lang.stories.map(storyId => {
        const story = getStory(lang.id, storyId);
        if (!story) return '';
        const prefix = `${lang.id}::${storyId}::`;
        let attempts = 0, correct = 0;
        for (const k in state.testAttempts) {
          if (!k.startsWith(prefix)) continue;
          attempts += state.testAttempts[k].attempts;
          correct  += state.testAttempts[k].correct;
        }
        const acc = attempts > 0 ? Math.round(correct / attempts * 100) : 0;
        return `
          <div class="item-row">
            <div class="grow">
              <div class="title">${escapeHtml(story.title)}</div>
              <div class="meta">${attempts} test attempts · ${acc}% accuracy</div>
            </div>
          </div>
        `;
      }).join('');

      const body = open ? `
        <div class="progress-body">
          <div class="streak-display">
            <div class="num gradient-text">🔥 ${streak}</div>
            <div class="lbl">Day streak</div>
          </div>
          <div class="sparkline-wrap">${svg}</div>
          <div class="vocab-line">
            <span class="num">${vocab}</span> distinct German words mastered ·
            <span class="num">${totalCards}</span> cards in last 30 days
          </div>
          <div class="row-list">${storyRows || '<div style="font-size:12px;color:var(--text-soft);text-align:center">No stories yet.</div>'}</div>
        </div>
      ` : '';

      return `
        <div class="glass progress-section">
          <button id="progress-toggle" class="progress-toggle ${open ? 'open' : ''}">
            <span>📈 Progress</span>
            <span class="arrow">›</span>
          </button>
          ${body}
        </div>
      `;
    }

    function renderRead() {
      const lang = getActiveLang();
      const storyId = lang.lastStoryId;
      if (!storyId) {
        return `<div class="glass empty-state">
          <div class="em-icon">📖</div>
          Pick a story from Library to start reading.
        </div>`;
      }
      const story = getStory(lang.id, storyId);
      if (!story) return `<div class="glass empty-state">Story not found.</div>`;

      const mode = lang.readMode || 'full';

      const toggle = `
        <div class="read-toggle">
          <button class="${mode === 'full' ? 'active' : ''}" data-read-mode="full">Full Text</button>
          <button class="${mode === 'sentence' ? 'active' : ''}" data-read-mode="sentence">Sentence by Sentence</button>
        </div>
      `;

      if (mode === 'full') {
        const proseHtml = story.sentences.map((s, i) =>
          `<span class="sent" data-sent-idx="${i}">${escapeHtml(s.de)}</span>`
        ).join(' ');
        const englishHtml = story.sentences.map(s => escapeHtml(s.en)).join(' ');
        return `
          ${toggle}
          <div class="play-bar">
            <button class="gradient-btn" id="btn-play-all">${playback.active ? '⏹  Stop' : '🔊  Listen to whole story'}</button>
          </div>
          <div class="glass story-prose">${proseHtml}</div>
          <button class="ghost-btn english-toggle" id="btn-toggle-english" data-shown="0">Show English ↓</button>
          <div class="glass english-block" id="english-block" style="display: none;">${englishHtml}</div>
        `;
      }

      // Sentence-by-sentence mode
      const rows = story.sentences.map((s, i) => `
        <div class="glass sentence-row" data-sent-idx="${i}" data-speak="${escapeHtml(s.de)}">
          <div class="de">${escapeHtml(s.de)}</div>
          <div class="en">${escapeHtml(s.en)}</div>
          ${s.note ? `<div class="note">${escapeHtml(s.note)}</div>` : ''}
        </div>
      `).join('');
      return `
        ${toggle}
        <div class="play-bar">
          <button class="gradient-btn" id="btn-play-all">${playback.active ? '⏹  Stop' : '🔊  Listen to whole story'}</button>
        </div>
        ${rows}
      `;
    }

    function renderPlaceholder(name) {
      return `
        <div class="glass placeholder">
          <div class="ph-title gradient-text">${name}</div>
          <div class="ph-sub">Coming in next update.</div>
        </div>
      `;
    }

    /* ============================================================
       CARDS TAB — Type + Speak interaction modes × Sentences/Vocabulary
       sources. Each (story, source) combo gets its own SRS pool;
       switching mode keeps the current queue, switching source rebuilds.
       ============================================================ */
    function buildCardSession(langId, storyId, mode, source) {
      const queue = buildCardQueue(langId, storyId, source);
      return {
        langId, storyId, mode, source,
        queue,
        idx: 0,
        wrongPile: [],
        revealed: false,
        flipped: false,
        lastInput: '',
        correctOnFirst: 0,
        originalQueueLen: queue.length
      };
    }

    function ensureCardSession(langId, storyId, mode, source) {
      // Different story or source → fresh queue. Mode change alone
      // just resets the visible surface so the queue continues.
      if (!cardSession ||
          cardSession.langId !== langId ||
          cardSession.storyId !== storyId ||
          cardSession.source !== source) {
        cardSession = buildCardSession(langId, storyId, mode, source);
      } else if (cardSession.mode !== mode) {
        cardSession.mode = mode;
        cardSession.revealed = false;
        cardSession.flipped = false;
        cardSession.lastInput = '';
      }
      return cardSession;
    }

    function renderCards() {
      const lang = getActiveLang();
      const storyId = lang.lastStoryId;

      if (!storyId) {
        return `<div class="glass empty-state">
          <div class="em-icon">🎴</div>
          Pick a story from Library to start studying.
        </div>`;
      }

      const story = getStory(lang.id, storyId);
      if (!story) return `<div class="glass empty-state">Story not found.</div>`;

      const mode = state.settings.cardMode || 'type';
      const source = state.settings.cardSource || 'sentences';
      const hasVocab = Array.isArray(story.vocabulary) && story.vocabulary.length > 0;

      // Source toggle: only render Vocabulary option if story actually has one.
      const sourceToggle = `
        <div class="read-toggle">
          <button class="${source === 'sentences'  ? 'active' : ''}" data-card-source="sentences">📖  Sentences</button>
          <button class="${source === 'vocabulary' ? 'active' : ''} ${hasVocab ? '' : 'tab-disabled'}" data-card-source="vocabulary" ${hasVocab ? '' : 'disabled'}>🔤  Vocabulary</button>
        </div>
      `;
      const modeToggle = `
        <div class="read-toggle three">
          <button class="${mode === 'type'   ? 'active' : ''}" data-card-mode="type">⌨️  Type</button>
          <button class="${mode === 'speak'  ? 'active' : ''}" data-card-mode="speak">🗣️  Speak</button>
          <button class="${mode === 'browse' ? 'active' : ''}" data-card-mode="browse">📋  Browse</button>
        </div>
      `;
      const toggles = sourceToggle + modeToggle;

      // Story has no vocab but vocab source is selected — fall back gracefully.
      const effectiveSource = (source === 'vocabulary' && !hasVocab) ? 'sentences' : source;

      // Browse mode bypasses the SRS session entirely — just renders
      // every item as a tile grid. No queue, no grading.
      if (mode === 'browse') {
        return `${toggles}${renderCardsBrowse(story, effectiveSource, lang)}`;
      }

      const session = ensureCardSession(lang.id, storyId, mode, effectiveSource);

      if (session.queue.length === 0 && session.wrongPile.length === 0) {
        const label = effectiveSource === 'vocabulary' ? 'words' : 'cards';
        return `${toggles}
          <div class="glass session-end">
            <div class="se-title gradient-text">🎉 Nothing more due!</div>
            <div class="se-sub">All ${label} for this story are scheduled for the future.</div>
            <button class="gradient-btn" data-go-tab="library">Back to Library</button>
          </div>`;
      }

      if (session.idx >= session.queue.length) {
        if (session.wrongPile.length > 0) {
          session.queue = session.queue.concat(session.wrongPile);
          session.wrongPile = [];
        } else {
          const next = buildCardQueue(lang.id, storyId, effectiveSource);
          const continueBtn = next.length > 0
            ? `<button class="gradient-btn" data-cards-next="1">Continue with next batch</button>`
            : `<div style="margin-bottom:8px;">🎉 Nothing more due!</div>
               <button class="gradient-btn" data-go-tab="library">Back to Library</button>`;
          return `${toggles}
            <div class="glass session-end">
              <div class="se-title gradient-text">✅ Session complete</div>
              <div class="se-sub">${session.correctOnFirst} / ${session.originalQueueLen} correct on first attempt</div>
              ${continueBtn}
            </div>`;
        }
      }

      const card = session.queue[session.idx];
      const content = getCardContent(card.id, story);
      if (!content.item) {
        // Defensive: card refers to an item index that's been removed.
        // Drop it from queue and re-render.
        session.queue.splice(session.idx, 1);
        return renderCards();
      }

      const cardWord = effectiveSource === 'vocabulary' ? 'Word' : 'Card';
      const retryNote = (mode === 'speak' && session.wrongPile.length > 0)
        ? ` <span style="color: var(--text-soft);">(${session.wrongPile.length} to retry)</span>`
        : '';
      const counter = `<div class="card-counter">${cardWord} ${session.idx + 1} of ${session.queue.length}${retryNote}</div>`;

      const body = mode === 'type'
        ? renderCardsType(session, card, content)
        : renderCardsSpeak(session, card, content);

      return `${toggles}${counter}${body}`;
    }

    /* `content` is { type: 'sentence' | 'vocab', item, idx } from
       getCardContent(). For vocab the German text is the bare word;
       audio playback prefixes the gender so 'Kaffee' speaks as 'der
       Kaffee'. */
    function vocabSpeakText(item) {
      if (item.gender) return `${item.gender} ${item.de}`;
      return item.de;
    }
    function renderVocabPosTag(item) {
      if (!item.pos) return '';
      const label = item.pos === 'noun' && item.gender
        ? `${item.pos} · ${item.gender}`
        : item.pos;
      return `<div style="text-align:center; margin-bottom: 8px;"><span class="rule-tag">${escapeHtml(label)}</span></div>`;
    }
    function renderVocabAnswer(item) {
      // The big German display: gender prefix in dimmer color, then word.
      const gender = item.gender ? `<span style="color: var(--text-dim);">${escapeHtml(item.gender)}</span> ` : '';
      const plural = item.plural ? `<div style="font-size: 13px; color: var(--text-soft); text-align:center; margin-top: -8px; margin-bottom: 14px;">plural: ${escapeHtml(item.plural)}</div>` : '';
      return `
        <div class="big-sentence gradient-text">${gender}${escapeHtml(item.de)}</div>
        ${plural}
      `;
    }

    function renderCardsType(session, card, content) {
      const item = content.item;
      const promptEn = item.en;
      const answerDe = item.de;
      const speakText = content.type === 'vocab' ? vocabSpeakText(item) : answerDe;
      const posTag = content.type === 'vocab' ? renderVocabPosTag(item) : '';

      if (!session.revealed) {
        const placeholder = content.type === 'vocab'
          ? 'Type the German word...'
          : 'Type your German translation...';
        return `
          <div class="glass card-pane">
            ${posTag}
            <div class="big-sentence gradient-text">${escapeHtml(promptEn)}</div>
            <textarea class="type-area" id="type-input"
              placeholder="${placeholder}"
              autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false">${escapeHtml(session.lastInput || '')}</textarea>
            <button class="gradient-btn full-btn" id="btn-show-answer">Show Answer</button>
          </div>
        `;
      }

      const dist = levenshtein(normalize(session.lastInput || ''), normalize(answerDe));
      let banner;
      if (dist === 0)       banner = `<div class="feedback ok">✅ Exact match</div>`;
      else if (dist <= 2)   banner = `<div class="feedback almost">🟡 Almost — small typo</div>`;
      else                  banner = `<div class="feedback bad">❌ Compare carefully</div>`;

      const answerBlock = content.type === 'vocab'
        ? renderVocabAnswer(item)
        : `<div class="big-sentence gradient-text">${escapeHtml(answerDe)}</div>`;

      return `
        <div class="glass card-pane">
          ${banner}
          ${answerBlock}
          <div class="audio-row">
            <button class="audio-btn" data-action="speak-de" data-text="${escapeHtml(speakText)}">🔊 DE</button>
          </div>
          ${posTag}
          ${item.note ? `<div class="note-callout">${escapeHtml(item.note)}</div>` : ''}
          <div class="grade-row">
            <button class="grade-btn again" data-grade="1"><span class="lbl">Again</span><span class="sub">restart</span></button>
            <button class="grade-btn hard"  data-grade="2"><span class="lbl">Hard</span><span class="sub">soon</span></button>
            <button class="grade-btn good"  data-grade="3"><span class="lbl">Good</span><span class="sub">on track</span></button>
            <button class="grade-btn easy"  data-grade="4"><span class="lbl">Easy</span><span class="sub">later</span></button>
          </div>
        </div>
      `;
    }

    function renderCardsSpeak(session, card, content) {
      const item = content.item;
      const speakText = content.type === 'vocab' ? vocabSpeakText(item) : item.de;
      const posTag = content.type === 'vocab' ? renderVocabPosTag(item) : '';

      if (!session.flipped) {
        const hint = content.type === 'vocab'
          ? 'Say the German word aloud, then tap to flip'
          : 'Say it aloud in German, then tap to flip';
        return `
          <div class="glass card-pane flip-card" id="flip-card">
            ${posTag}
            <div class="big-sentence gradient-text">${escapeHtml(item.en)}</div>
            <button class="audio-btn" data-action="speak-en" data-text="${escapeHtml(item.en)}">🔊 EN</button>
            <div class="hint">${hint}</div>
          </div>
        `;
      }

      const answerBlock = content.type === 'vocab'
        ? renderVocabAnswer(item)
        : `<div class="big-sentence gradient-text">${escapeHtml(item.de)}</div>`;

      return `
        <div class="glass card-pane flip-card" id="flip-card">
          ${answerBlock}
          <div class="audio-row">
            <button class="audio-btn" data-action="speak-de" data-text="${escapeHtml(speakText)}">🔊 DE</button>
          </div>
          <div style="font-size: 14px; color: var(--text-dim); text-align: center; margin-top: 4px;">
            ${escapeHtml(item.en)}
          </div>
          <div class="audio-row">
            <button class="audio-btn" data-action="speak-en" data-text="${escapeHtml(item.en)}">🔊 EN</button>
          </div>
          ${posTag}
          ${item.note ? `<div class="note-callout">${escapeHtml(item.note)}</div>` : ''}
          <div class="hint">Were you right?</div>
        </div>
        <div class="wr-row">
          <button class="wr-btn wrong" data-speak-grade="wrong">← Wrong</button>
          <button class="wr-btn right" data-speak-grade="right">Right →</button>
        </div>
      `;
    }

    /* ============================================================
       Browse mode — non-SRS reference view. Renders every sentence or
       vocab item as a tile. Audio works; no grading, no progress.
       ============================================================ */
    function renderCardsBrowse(story, source, lang) {
      const items = source === 'vocabulary'
        ? (Array.isArray(story.vocabulary) ? story.vocabulary : [])
        : (Array.isArray(story.sentences)  ? story.sentences  : []);

      if (items.length === 0) {
        return `<div class="glass empty-state">
          <div class="em-icon">📋</div>
          Nothing to browse — story has no ${source === 'vocabulary' ? 'vocabulary' : 'sentences'} defined.
        </div>`;
      }

      const summary = `<div class="browse-summary">${items.length} ${source === 'vocabulary' ? 'words' : 'sentences'}</div>`;

      const tiles = items.map((item, i) => {
        if (source === 'vocabulary') {
          const speakText = vocabSpeakText(item);
          const genderHtml = item.gender ? `<span class="gen">${escapeHtml(item.gender)}</span>` : '';
          const posBits = [];
          if (item.pos) posBits.push(item.pos);
          const meta = posBits.length ? `<span class="bt-pos">${escapeHtml(posBits.join(' · '))}</span>` : '';
          const plural = item.plural ? `<span class="bt-plural">pl. ${escapeHtml(item.plural)}</span>` : '';
          return `
            <div class="glass browse-tile tile-vocab">
              <div class="bt-de">${genderHtml}${escapeHtml(item.de)}</div>
              <div class="bt-en">${escapeHtml(item.en || '')}</div>
              <div class="bt-meta">${meta}${plural}</div>
              <button class="audio-btn" data-action="speak-de" data-text="${escapeHtml(speakText)}">🔊 DE</button>
            </div>
          `;
        }
        // sentence tile
        return `
          <div class="glass browse-tile tile-sentence">
            <div class="bt-idx">#${i + 1}</div>
            <div class="bt-de">${escapeHtml(item.de)}</div>
            <div class="bt-en">${escapeHtml(item.en)}</div>
            <button class="audio-btn" data-action="speak-de" data-text="${escapeHtml(item.de)}">🔊 DE</button>
          </div>
        `;
      }).join('');

      return `${summary}<div class="browse-grid">${tiles}</div>`;
    }

    /* ============================================================
       TEST TAB — tier selection + session loop.
       ============================================================ */
    // Test queue merges the story's built-in `grammarTests` with every
    // uploaded test pack registered for that language+story. Each test
    // carries `_packId` (null for built-in) and its `originalIdx` within
    // its source array — together they form the testAttempts key.
    function buildTestQueue(languageId, storyId, tier) {
      const story = state.storiesData[`${languageId}::${storyId}`];
      if (!story) return [];
      const items = [];
      story.grammarTests.forEach((t, originalIdx) => {
        if (t.tier === tier) items.push({ ...t, originalIdx, _packId: null, firstAttempt: true });
      });
      for (const k in state.testPacks) {
        const pack = state.testPacks[k];
        if (pack.languageId !== languageId || pack.storyId !== storyId) continue;
        pack.tests.forEach((t, originalIdx) => {
          if (t.tier === tier) items.push({ ...t, originalIdx, _packId: pack.id, firstAttempt: true });
        });
      }
      for (let i = items.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [items[i], items[j]] = [items[j], items[i]];
      }
      return items;
    }

    // Total count of tier-N tests (built-in + every installed pack).
    function countTestsForTier(languageId, storyId, tier) {
      const story = state.storiesData[`${languageId}::${storyId}`];
      if (!story) return 0;
      let n = story.grammarTests.filter(t => t.tier === tier).length;
      for (const k in state.testPacks) {
        const pack = state.testPacks[k];
        if (pack.languageId !== languageId || pack.storyId !== storyId) continue;
        n += pack.tests.filter(t => t.tier === tier).length;
      }
      return n;
    }

    function startTestSession(tier) {
      const lang = getActiveLang();
      const story = getStory(lang.id, lang.lastStoryId);
      if (!story) return;
      const queue = buildTestQueue(lang.id, story.id, tier);
      const nextTier = tier + 1;
      testSession = {
        langId: lang.id, storyId: story.id, tier,
        queue, idx: 0, wrongPile: [],
        revealed: false, lastInput: '',
        correctOnFirst: 0, totalThisSession: queue.length,
        prevNextTierUnlocked: nextTier <= 3 ? tierUnlocked(nextTier, lang.id, story.id) : true
      };
      render();
    }

    function renderTest() {
      const lang = getActiveLang();
      const storyId = lang.lastStoryId;

      if (!storyId) {
        return `<div class="glass empty-state">
          <div class="em-icon">🎯</div>
          Pick a story from Library to start grammar tests.
        </div>`;
      }
      const story = getStory(lang.id, storyId);
      if (!story) return `<div class="glass empty-state">Story not found.</div>`;

      // No active session → show tier selection.
      if (!testSession || testSession.langId !== lang.id || testSession.storyId !== storyId) {
        return renderTierSelection(story, lang);
      }
      return renderTestSession(story, lang);
    }

    function renderTierSelection(story, lang) {
      const tiers = [1, 2, 3];
      return tiers.map(tier => {
        const ruleNames = story.grammarRules.filter(r => r.tier === tier).map(r => r.name);
        const totalTests = countTestsForTier(lang.id, story.id, tier);
        const prefix    = `${lang.id}::${story.id}::tier${tier}::`;
        let totalAttempts = 0, totalCorrect = 0;
        for (const k in state.testAttempts) {
          if (k.startsWith(prefix)) {
            totalAttempts += state.testAttempts[k].attempts;
            totalCorrect  += state.testAttempts[k].correct;
          }
        }
        const acc = totalAttempts > 0 ? Math.round(totalCorrect / totalAttempts * 100) : 0;
        const unlocked = tierUnlocked(tier, lang.id, story.id);

        if (unlocked) {
          return `
            <div class="glass tier-card">
              <div class="tc-title gradient-text">Tier ${tier}</div>
              <div class="tc-rules">${ruleNames.map(escapeHtml).join(' · ')}</div>
              <div class="tc-stats">${totalTests} tests in pool · ${totalAttempts} attempts · ${acc}% lifetime accuracy</div>
              <button class="gradient-btn full-btn" data-start-tier="${tier}">Start Tier ${tier}</button>
            </div>
          `;
        }
        return `
          <div class="glass tier-card locked">
            <div class="tc-title"><span class="lock">🔒</span>Tier ${tier}</div>
            <div class="tc-rules">80% accuracy on 20+ Tier ${tier - 1} first attempts to unlock</div>
            <div class="tc-stats">${totalTests} tests in pool · ${totalAttempts} attempts · ${acc}% lifetime accuracy</div>
          </div>
        `;
      }).join('');
    }

    function renderTestSession(story, lang) {
      const ts = testSession;

      // Wrong-pile rejoin / session end.
      if (ts.idx >= ts.queue.length) {
        if (ts.wrongPile.length > 0) {
          ts.queue = ts.queue.concat(ts.wrongPile);
          ts.wrongPile = [];
        } else {
          const acc = ts.totalThisSession > 0
            ? Math.round(ts.correctOnFirst / ts.totalThisSession * 100)
            : 0;
          const nextTier = ts.tier + 1;
          let celebrateHtml = '';
          if (nextTier <= 3 &&
              !ts.prevNextTierUnlocked &&
              tierUnlocked(nextTier, lang.id, story.id)) {
            celebrateHtml = `<div class="celebrate">🎉 Tier ${nextTier} unlocked!</div>`;
          }
          return `
            <div class="glass session-end">
              <div class="se-title gradient-text">Tier ${ts.tier} complete</div>
              <div class="se-sub">${ts.correctOnFirst} / ${ts.totalThisSession} on first attempt (${acc}%)</div>
              ${celebrateHtml}
              <button class="gradient-btn" data-test-back="1">Back to Tier Selection</button>
            </div>
          `;
        }
      }

      const t = ts.queue[ts.idx];

      if (!ts.revealed) {
        return `
          <div class="glass card-pane">
            <div style="text-align: center; margin-bottom: 12px;">
              <span class="rule-tag">${escapeHtml(t.rule)}</span>
            </div>
            <div class="big-sentence gradient-text">${escapeHtml(t.en)}</div>
            <textarea class="type-area" id="test-input"
              placeholder="Type your German translation..."
              autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false">${escapeHtml(ts.lastInput || '')}</textarea>
            <button class="gradient-btn full-btn" id="btn-test-check">Check</button>
          </div>
        `;
      }

      const dist = levenshtein(normalize(ts.lastInput || ''), normalize(t.de));
      const ok = dist <= 2;
      const banner = ok
        ? `<div class="feedback ok">✅ Correct</div>`
        : `<div class="feedback bad">❌ Not quite</div>`;
      return `
        <div class="glass card-pane">
          ${banner}
          <div style="text-align: center; margin-bottom: 12px;">
            <span class="rule-tag">${escapeHtml(t.rule)}</span>
          </div>
          <div class="big-sentence gradient-text">${escapeHtml(t.de)}</div>
          <div class="audio-row">
            <button class="audio-btn" data-action="speak-de" data-text="${escapeHtml(t.de)}">🔊 DE</button>
          </div>
          ${t.trap ? `<div class="trap-callout">⚠️ ${escapeHtml(t.trap)}</div>` : ''}
          <button class="gradient-btn full-btn" id="btn-test-next" style="margin-top: 14px;">Next</button>
        </div>
      `;
    }
