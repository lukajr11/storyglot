      const vocab = Array.isArray(story.vocabulary) ? story.vocabulary : [];
      let mastered = 0;
      for (let i = 0; i < vocab.length; i++) {
        const cardId = `${langId}::${storyId}::vocab::${i}`;
        const c = state.cards[cardId];
        if (c && c.reps >= DRILL1_MIN_REPS && (c.interval || 0) >= DRILL1_MIN_INTERVAL_DAYS) mastered++;
      }
      return `${mastered} / ${vocab.length} words mastered`;
    }

    /* ============================================================
       DRILL 2 — Vocab production. EN → IT typed answer for every new
       vocab word. Each word must be answered correctly twice in a row.
       Wrong answers reset the streak and re-queue the word.
       ============================================================ */
    function renderDrill2(lang, story, progress) {
      const vocab = getNewVocab(story);
      if (!vocab.length) {
        // Nothing to drill — auto-pass.
        progress.drillsDone[2] = true;
        progress.currentDrill = 3;
        saveState();
        return renderDrillCompleteCard(2, 'No new vocab to drill — moving on.');
      }
      const d2 = progress.drill2;
      if (!d2.queue || !d2.queue.length) {
        // Initialize queue: shuffled vocab indices.
        d2.queue = shuffleArray(vocab.map((_, i) => i));
        d2.streak = {};
        d2.idx = 0;
        d2.lastInput = '';
        d2.revealed = false;
        saveState();
      }
      const widx = d2.queue[d2.idx];
      const v = vocab[widx];
      if (!v) return `<div class="glass empty-state">Vocab missing.</div>`;

      const remaining = d2.queue.length;
      const total = vocab.length;
      const completed = total - countRemainingDrill2(d2, vocab);
      const progressLine = `${completed} / ${total} words mastered (need ${DRILL2_REQUIRED_STREAK} in a row each)`;

      if (!d2.revealed) {
        return `
          <div class="drill-progress-line">${progressLine}</div>
          <div class="glass card-pane">
            <div class="big-sentence gradient-text">${escapeHtml(v.en)}</div>
            <textarea class="type-area" id="d2-input"
              placeholder="Type the ${escapeHtml(targetLangNameLower())} word..."
              autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false">${escapeHtml(d2.lastInput || '')}</textarea>
            <button class="gradient-btn full-btn" id="btn-d2-check">Check</button>
          </div>
        `;
      }

      // Reveal pane.
      const expected = v.de || '';
      const submitted = d2.lastInput || '';
      const exact = submitted.trim() === expected.trim();
      const loose = drillAnswerMatches(submitted, expected);
      const banner = exact
        ? `<div class="feedback ok">✅ Exact match</div>`
        : loose
          ? `<div class="feedback almost">🟡 Correct! Spelled <strong>${escapeHtml(expected)}</strong>, mind the accents.</div>`
          : `<div class="feedback bad">❌ Not quite</div>`;
      const speakText = vocabSpeakText(v);
      return `
        <div class="drill-progress-line">${progressLine}</div>
        <div class="glass card-pane">
          ${banner}
          <div class="big-sentence gradient-text">${escapeHtml(expected)}</div>
          <div class="audio-row">
            <button class="audio-btn" data-fr-speak="${escapeHtml(speakText)}">🔊 ${speakLabelForActive()}</button>
          </div>
          ${v.note ? `<div class="note-callout">${escapeHtml(v.note)}</div>` : ''}
          <button class="gradient-btn full-btn" id="btn-d2-next">Next →</button>
        </div>
      `;
    }
    function countRemainingDrill2(d2, vocab) {
      let pending = 0;
      for (let i = 0; i < vocab.length; i++) {
        if ((d2.streak[i] || 0) < DRILL2_REQUIRED_STREAK) pending++;
      }
      return pending;
    }

    function shuffleArray(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    /* ============================================================
       DRILL 3 — Sentence assembly. Scrambled tiles per sentence with
       2 distractor tiles drawn from the story's vocab. Pass requires
       correct first attempt; failed sentences re-queue.
       ============================================================ */
    function renderDrill3(lang, story, progress) {
      const sentences = Array.isArray(story.sentences) ? story.sentences : [];
      if (!sentences.length) {
        progress.drillsDone[3] = true;
        progress.currentDrill = 4;
        saveState();
        return renderDrillCompleteCard(3, 'No sentences to assemble.');
      }
      const d3 = progress.drill3;
      if (!d3.queue || !d3.queue.length) {
        d3.queue = shuffleArray(sentences.map((_, i) => i));
        d3.retried = {};
        d3.idx = 0;
        d3.tiles = null;
        saveState();
      }
      const sidx = d3.queue[d3.idx];
      const s = sentences[sidx];
      if (!s) return `<div class="glass empty-state">Sentence missing.</div>`;

      const target = substituteProtagonist(String(s.de || ''));
      // Build tiles once per sentence and stash on the in-progress state.
      if (!d3.tiles || d3.tiles.sidx !== sidx) {
        const words = target.split(/\s+/).filter(Boolean);
        const distractors = pickDistractors(story, words, 2);
        const all = shuffleArray(words.concat(distractors));
        d3.tiles = {
          sidx,
          target,
          targetWords: words,
          tiles: all,                // displayed
          assembled: [],             // user picks (indices into tiles)
          available: all.map((_, i) => i),
          checked: false,
          correct: false
        };
      }
      const t = d3.tiles;

      const remainingCount = d3.queue.length - d3.idx;
      const totalCount = sentences.length;
      const progressLine = `Sentence ${d3.idx + 1} / ${d3.queue.length} this round · ${totalCount} total`;

      const assembledHtml = t.assembled.length
        ? t.assembled.map((tileIdx, i) =>
            `<button class="word-tile assembled" data-d3-unpick="${i}">${escapeHtml(t.tiles[tileIdx])}</button>`
          ).join('')
        : `<span class="word-tile-placeholder">tap tiles to build the sentence</span>`;

      const availableHtml = t.available.map(tileIdx =>
        `<button class="word-tile" data-d3-pick="${tileIdx}">${escapeHtml(t.tiles[tileIdx])}</button>`
      ).join('');

      const banner = t.checked
        ? (t.correct
            ? `<div class="feedback ok">✅ Perfect</div>`
            : `<div class="feedback bad">❌ Not quite — the right answer was:<br><strong>${escapeHtml(target)}</strong></div>`)
        : '';

      const englishHint = `<div class="d3-hint">${escapeHtml(s.en || '')}</div>`;

      const ctrlHtml = t.checked
        ? `<button class="gradient-btn full-btn" id="btn-d3-next">Next →</button>`
        : `
          <div class="btn-row">
            <button class="ghost-btn" id="btn-d3-clear">Clear</button>
            <button class="gradient-btn" id="btn-d3-check" ${t.assembled.length ? '' : 'disabled'} style="flex:2">Check</button>
          </div>
        `;

      return `
        <div class="drill-progress-line">${progressLine}</div>
        <div class="glass d3-pane">
          ${englishHint}
          <div class="d3-assembled">${assembledHtml}</div>
          ${banner}
          ${!t.checked ? `<div class="d3-tiles">${availableHtml}</div>` : ''}
          ${ctrlHtml}
        </div>
      `;
    }

    function pickDistractors(story, sentenceWords, n) {
      const have = new Set(sentenceWords.map(w => w.toLowerCase()));
      const pool = [];
      const vocab = Array.isArray(story.vocabulary) ? story.vocabulary : [];
      vocab.forEach(v => {
        const w = String(v.de || '').trim();
        if (w && !have.has(w.toLowerCase())) pool.push(w);
      });
      // Also pull individual words from other sentences as backup pool.
      (story.sentences || []).forEach(s => {
        substituteProtagonist(String(s.de || '')).split(/\s+/).forEach(w => {
          const clean = w.replace(/[.,!?;:"()«»]/g, '');
          if (clean && !have.has(clean.toLowerCase())) pool.push(clean);
        });
      });
      const unique = Array.from(new Set(pool));
      return shuffleArray(unique).slice(0, n);
    }

    /* ============================================================
       DRILL 4 — Dictation. TTS plays a sentence; learner types it.
       Replay is free. Same normalization as drill 2.
       ============================================================ */
    function renderDrill4(lang, story, progress) {
      const sentences = Array.isArray(story.sentences) ? story.sentences : [];
      if (!sentences.length) {
        progress.drillsDone[4] = true;
        progress.currentDrill = 5;
        saveState();
        return renderDrillCompleteCard(4, 'No sentences to transcribe.');
      }
      const d4 = progress.drill4;
      if (!d4.queue || !d4.queue.length) {
        d4.queue = shuffleArray(sentences.map((_, i) => i));
        d4.doneSet = {};
        d4.idx = 0;
        d4.lastInput = '';
        d4.revealed = false;
        saveState();
      }
      const sidx = d4.queue[d4.idx];
      const s = sentences[sidx];
      if (!s) return `<div class="glass empty-state">Sentence missing.</div>`;
      const expected = substituteProtagonist(String(s.de || ''));

      const total = sentences.length;
      const completed = Object.keys(d4.doneSet).length;
      const progressLine = `${completed} / ${total} dictated`;

      if (!d4.revealed) {
        return `
          <div class="drill-progress-line">${progressLine}</div>
          <div class="glass card-pane d4-pane">
            <div class="d4-instructions">Listen and type what you hear.</div>
            <div class="audio-row">
              <button class="audio-btn big" data-fr-speak="${escapeHtml(expected)}">🔊 Play</button>
            </div>
            <textarea class="type-area" id="d4-input"
              placeholder="Type the ${escapeHtml(targetLangNameLower())} sentence..."
              autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false">${escapeHtml(d4.lastInput || '')}</textarea>
            <button class="gradient-btn full-btn" id="btn-d4-check">Check</button>
          </div>
        `;
      }

      const submitted = d4.lastInput || '';
      const exact = submitted.trim() === expected.trim();
      const loose = drillAnswerMatches(submitted, expected);
      const banner = exact
        ? `<div class="feedback ok">✅ Exact match</div>`
        : loose
          ? `<div class="feedback almost">🟡 Correct! Spelling: <strong>${escapeHtml(expected)}</strong></div>`
          : `<div class="feedback bad">❌ Compare carefully</div>`;
      return `
        <div class="drill-progress-line">${progressLine}</div>
        <div class="glass card-pane d4-pane">
          ${banner}
          <div class="big-sentence gradient-text">${escapeHtml(expected)}</div>
          <div class="audio-row">
            <button class="audio-btn" data-fr-speak="${escapeHtml(expected)}">🔊 Replay</button>
          </div>
          <button class="gradient-btn full-btn" id="btn-d4-next">Next →</button>
        </div>
      `;
    }

    /* ============================================================
       DRILL 5 — Rule spotting. Spec calls for tapping rule-relevant
       tokens inside story sentences, which needs sentence-rule
       tagging the current schema doesn't carry. v1 fallback: walk the
       learner through each new rule (name + explanation + examples
       when present) and require a "Got it" tap to advance. Once we
       have rule-tagged sentences in story JSON we'll upgrade this
       drill to true token-tap spotting.
       ============================================================ */
    function renderDrill5(lang, story, progress) {
      const rules = getNewGrammar(story);
      if (!rules.length) {
        progress.drillsDone[5] = true;
        progress.currentDrill = 6;
        saveState();
        return renderDrillCompleteCard(5, 'No new rules to review.');
      }
      const d5 = progress.drill5;
      if (!d5.queue || !d5.queue.length) {
        d5.queue = rules.map((_, i) => i);  // preserve story order
        d5.results = {};
        d5.idx = 0;
        d5.picked = null;
        saveState();
      }
      const ridx = d5.queue[d5.idx];
      const rule = rules[ridx];
      if (!rule) return `<div class="glass empty-state">Rule missing.</div>`;

      const total = rules.length;
      const confirmed = Object.values(d5.results).filter(v => v === true).length;

      return `
        <div class="drill-progress-line">${confirmed} / ${total} rules reviewed</div>
        ${renderRuleCard(rule, rule.tier || 1)}
        <button class="gradient-btn full-btn" id="btn-d5-next" style="margin-top: 12px;">Got it →</button>
      `;
    }

    /* ============================================================
       DRILL 6 — Transfer test. Tier-1 only. Mastery threshold:
       ≥80% over max(15, 7 × rules_introduced) first-attempts (§7.2).
       Reuses the existing test session machinery, filtered to tier 1.
       ============================================================ */
    function renderDrill6(lang, story, progress) {
      const tier1Tests = (story.grammarTests || []).filter(t => t.tier === 1);
      if (!tier1Tests.length) {
        // No tier-1 tests defined — auto-pass.
        progress.drillsDone[6] = true;
        progress.unlocked = true;
        saveState();
        promoteStoryToFreePractice(lang.id, story.id);
        return renderDrillCompleteCard(6, 'No tier-1 tests defined — story marked complete.');
      }
      const rulesIntroduced = (story.grammarRules || []).filter(r => r.tier === 1).length;
      const required = Math.max(15, 7 * Math.max(1, rulesIntroduced));
      const stats = getDrill6Stats(lang.id, story.id, tier1Tests);
      const accuracy = stats.firstAttempts > 0 ? Math.round((stats.correctOnFirst / stats.firstAttempts) * 100) : 0;
      const thresholdMet = stats.firstAttempts >= required && accuracy >= 80;

      if (thresholdMet) {
        progress.drillsDone[6] = true;
        progress.unlocked = true;
        saveState();
        promoteStoryToFreePractice(lang.id, story.id);
        return renderDrill6Celebration(lang, story);
      }

      // Build / reuse a test session. The existing testSession machinery
      // records first-attempts in state.testAttempts via the same path
      // as the regular Test tab; we just keep the user on tier 1.
      const needNew = !testSession ||
        testSession.langId !== lang.id ||
        testSession.storyId !== story.id ||
        testSession.tier !== 1;
      if (needNew) {
        const queue = buildTestQueue(lang.id, story.id, 1);
        testSession = {
          langId: lang.id, storyId: story.id, tier: 1,
          queue, idx: 0, wrongPile: [],
          revealed: false, lastInput: '',
          correctOnFirst: 0, totalThisSession: queue.length,
          prevNextTierUnlocked: tierUnlocked(2, lang.id, story.id)
        };
      }

      const progressLine = `${stats.firstAttempts} / ${required} first-attempts · ${accuracy}% accuracy (need ≥80%)`;

      if (!testSession || !testSession.queue || !testSession.queue.length) {
        return `
          <div class="drill-progress-line">${progressLine}</div>
          <div class="glass drill-empty">
            <div class="drill-empty-icon">🎯</div>
            <div class="drill-empty-title">No tier-1 prompts queued.</div>
            <div class="drill-empty-msg">Try again later — every test has been seen recently.</div>
            <button class="ghost-btn full-btn" data-fr-exit="1">Save &amp; exit</button>
          </div>
        `;
      }

      // Reuse the existing in-tab test renderer; it already handles
      // type+choose-article modes and grading.
      return `
        <div class="drill-progress-line">${progressLine}</div>
        ${renderTestSession(story, lang)}
      `;
    }

    function getDrill6Stats(langId, storyId, tier1Tests) {
      // testAttempts records carry: firstAttempts (count) +
      // firstAttemptsCorrect (count of correct first answers).
      let firstAttempts = 0;
      let correctOnFirst = 0;
      tier1Tests.forEach((t, idx) => {
        const key = `${langId}::${storyId}::tier1::builtin::${idx}`;
        const a = state.testAttempts[key];
        if (!a) return;
        firstAttempts += a.firstAttempts || 0;
        correctOnFirst += a.firstAttemptsCorrect || 0;
      });
      return { firstAttempts, correctOnFirst };
    }

    function renderDrill6Celebration(lang, story) {
      const nextStoryId = findNextStoryId(lang, story.id);
      const ctaLabel = nextStoryId ? 'Open the next story' : 'Back to library';
      return `
        <div class="glass fr-celebrate">
          <div class="fr-celebrate-icon">🎉</div>
          <div class="fr-celebrate-title gradient-text">Story complete</div>
          <div class="fr-celebrate-msg">
            ${nextStoryId
              ? 'You hit the tier-1 mastery threshold. The next chapter just unlocked.'
              : 'You hit the tier-1 mastery threshold. Free practice for this story is now open in the library.'}
          </div>
          <button class="gradient-btn full-btn" data-d6-next="${escapeHtml(nextStoryId || '')}">${ctaLabel}</button>
        </div>
      `;
    }

    function findNextStoryId(lang, storyId) {
      const list = lang.stories || [];
      const idx = list.indexOf(storyId);
      if (idx < 0 || idx >= list.length - 1) return null;
      return list[idx + 1];
    }

    function promoteStoryToFreePractice(langId, storyId) {
      // Phase transition + clear ephemeral session so other tabs render
      // a clean slate against the post-drill state.
      const lang = state.languages[langId];
      if (lang && lang.storyProgress && lang.storyProgress[storyId]) {
        lang.storyProgress[storyId].phase = 'free-practice';
      }
      cardSession = null;
      testSession = null;
      saveState();
    }

    /* ----- Generic "drill complete" pane (shown briefly between drills) ----- */
    function renderDrillCompleteCard(n, msg) {
      const next = n + 1;
      const isLast = n >= 6;
      return `
        <div class="glass drill-complete">
          <div class="drill-complete-icon">✓</div>
          <div class="drill-complete-title gradient-text">Drill ${n} done</div>
          <div class="drill-complete-msg">${escapeHtml(msg)}</div>
          ${isLast
            ? `<button class="gradient-btn full-btn" data-fr-exit="1">Back to library</button>`
            : `<button class="gradient-btn full-btn" data-d-advance="${next}">Start drill ${next} →</button>`}
        </div>
      `;
    }

    /* ============================================================
       FREE PRACTICE — Stage E. Story has finished its drill flow and
       enters open-ended mode. The hub is a tile grid; tiles either
       deep-link to existing tabs (Cards / Rules / Test) or render
       in-place (Listen / Sentence assembly / Dictation).
       ============================================================ */
    function renderFreePractice(lang, story, progress) {
      const mode = progress.fpMode || 'hub';
      switch (mode) {
        case 'listen':    return renderFPListen(lang, story, progress);
        case 'assembly':  return renderFPAssembly(lang, story, progress);
        case 'dictation': return renderFPDictation(lang, story, progress);
        default:          return renderFPHub(lang, story, progress);
      }
    }

    function renderFPHub(lang, story, progress) {
      const stats = getStats(state, lang.id, story.id);
      const vocabCount = (story.vocabulary || []).length;
      const sentCount = (story.sentences || []).length;
      const ruleCount = (story.grammarRules || []).length;
      // Tier accuracy across all attempts.
      const acc = (tier) => {
        const prefix = `${lang.id}::${story.id}::tier${tier}::`;
        let attempts = 0, correct = 0;
        for (const k in state.testAttempts) {
          if (!k.startsWith(prefix)) continue;
          attempts += state.testAttempts[k].attempts || 0;
          correct  += state.testAttempts[k].correct  || 0;
        }
        return { attempts, accuracy: attempts ? Math.round(correct / attempts * 100) : 0 };
      };
      const tiers = [acc(1), acc(2), acc(3)];

      const tile = (key, icon, title, sub) => `
        <div class="glass fp-tile" data-fp-tile="${key}">
          <div class="fp-tile-icon">${icon}</div>
          <div class="fp-tile-title">${escapeHtml(title)}</div>
          <div class="fp-tile-sub">${escapeHtml(sub)}</div>
        </div>
      `;

      return `
        <div class="fr-top-row">
          <div class="fr-step-pill">Free practice</div>
          <button class="ghost-btn fr-exit-btn" data-fp-back-to-library="1">← Library</button>
        </div>
        <div class="glass fp-header">
          <div class="fp-title gradient-text">${escapeHtml(story.title)}</div>
          <div class="fp-sub">Pick anything — drill order is over. Cross-story Review on the library home.</div>
        </div>
        <div class="fp-grid">
          ${tile('listen',     '🎧', 'Listen',           `${sentCount} sentences · subtitle toggle`)}
          ${tile('sentences',  '📝', 'Sentence cards',   'Type or speak · SRS')}
          ${tile('vocab',      '🔤', 'Vocab cards',      `${vocabCount} words · SRS`)}
          ${tile('assembly',   '🧩', 'Sentence assembly', 'Repeatable, free order')}
          ${tile('dictation',  '✍️', 'Dictation',        'Listen and type')}
          ${tile('rules',      '📚', 'Grammar rules',    `${ruleCount} ${ruleCount === 1 ? 'rule' : 'rules'} with examples`)}
          ${tile('tests',      '🎯', 'Transfer test',    `T1 ${tiers[0].accuracy}% · T2 ${tiers[1].accuracy}% · T3 ${tiers[2].accuracy}%`)}
        </div>
      `;
    }

    /* ----- Listen mode: cover + sentences + audio + EN toggle ----- */
    function renderFPListen(lang, story, progress) {
      const showEng = !!progress.fpListenEng;
      const subModes = ['off', 'it', 'both'];
      const cur = progress.fpSubMode || 'it';
      const next = subModes[(subModes.indexOf(cur) + 1) % subModes.length];
      const subLabel =
        cur === 'off'  ? 'Subtitles: off' :
        cur === 'it'   ? 'Subtitles: IT'  : 'Subtitles: IT + EN';

      const coverHtml = renderStoryCover(lang.id, story) ||
        `<div class="story-cover" style="background: linear-gradient(135deg, var(--grad-1), var(--grad-3));"></div>`;

      const rows = (cur === 'off')
        ? ''
        : story.sentences.map((s, i) => `
            <div class="fr-narr-row" data-sent-idx="${i}">
              <div class="de">${escapeHtml(s.de)}</div>
              ${cur === 'both' ? `<div class="en">${escapeHtml(s.en)}</div>` : ''}
            </div>
          `).join('');

      return `
        <div class="fr-top-row">
          <div class="fr-step-pill">Listen</div>
          <button class="ghost-btn fr-exit-btn" data-fp-back-to-hub="1">← Free practice</button>
        </div>
        <div class="fr-cover-wrap fr-cover-thin">${coverHtml}</div>
        <div class="play-bar">
          <button class="gradient-btn" id="btn-play-all">${playback.active ? '⏹  Stop' : '🔊  Play full story'}</button>
          <button class="ghost-btn fr-eng-toggle" data-fp-cycle-sub="${next}">${escapeHtml(subLabel)}</button>
        </div>
        ${rows ? `<div class="glass fr-narration-list">${rows}</div>` : '<div class="glass empty-state">Subtitles off — close your eyes and listen.</div>'}
      `;
    }

    /* ----- Assembly + Dictation reuse drill renderers in repeatable mode.
       Each entry resets the queue so the user can replay from scratch.
       Completion does NOT mutate drillsDone (this is just practice). ----- */
    function renderFPAssembly(lang, story, progress) {
      // Use a parallel ephemeral state object keyed off progress.fpAssembly.
      progress.fpAssembly = progress.fpAssembly || { idx: 0, queue: null, retried: {} };
      // If queue exhausted on previous render, rebuild fresh.
      if (!progress.fpAssembly.queue || !progress.fpAssembly.queue.length) {
        const sentences = story.sentences || [];
        progress.fpAssembly.queue = shuffleArray(sentences.map((_, i) => i));
        progress.fpAssembly.tiles = null;
        progress.fpAssembly.retried = {};
        progress.fpAssembly.idx = 0;
      }
      // Render via the shared drill 3 body but with a Free Practice top bar.
      // Swap progress.drill3 pointer to fpAssembly so existing handlers work.
      const stash = progress.drill3;
      progress.drill3 = progress.fpAssembly;
      const body = renderDrill3InnerHTML(lang, story, progress);
      progress.drill3 = stash;
      return `
        <div class="fr-top-row">
          <div class="fr-step-pill">Sentence assembly</div>
          <button class="ghost-btn fr-exit-btn" data-fp-back-to-hub="1">← Free practice</button>
        </div>
        ${body}
      `;
    }
    function renderFPDictation(lang, story, progress) {
      progress.fpDictation = progress.fpDictation || { idx: 0, queue: null, doneSet: {} };
      if (!progress.fpDictation.queue || !progress.fpDictation.queue.length) {
        const sentences = story.sentences || [];
        progress.fpDictation.queue = shuffleArray(sentences.map((_, i) => i));
        progress.fpDictation.doneSet = {};
        progress.fpDictation.idx = 0;
        progress.fpDictation.lastInput = '';
        progress.fpDictation.revealed = false;
      }
      const stash = progress.drill4;
      progress.drill4 = progress.fpDictation;
      const body = renderDrill4InnerHTML(lang, story, progress);
      progress.drill4 = stash;
      return `
        <div class="fr-top-row">
          <div class="fr-step-pill">Dictation</div>
          <button class="ghost-btn fr-exit-btn" data-fp-back-to-hub="1">← Free practice</button>
        </div>
        ${body}
      `;
    }

    // Strip drill-3's outer top bar so it can render inside the FP shell.
    function renderDrill3InnerHTML(lang, story, progress) {
      // renderDrill3 only emits a progress-line + body, no top bar. So we
      // can call it directly. Same for renderDrill4.
      return renderDrill3(lang, story, progress);
    }
    function renderDrill4InnerHTML(lang, story, progress) {
      return renderDrill4(lang, story, progress);
    }

    function renderPlaceholder(name) {
      return `
        <div class="glass placeholder">
          <div class="ph-title gradient-text">${name}</div>
          <div class="ph-sub">Coming in next update.</div>
        </div>
      `;
    }

    /* ============================================================
       CARDS TAB — Type + Speak interaction modes × Sentences/Vocabulary
       sources. Each (story, source) combo gets its own SRS pool;
       switching mode keeps the current queue, switching source rebuilds.
       ============================================================ */
    function buildCardSession(langId, storyId, mode, source) {
      const queue = buildCardQueue(langId, storyId, source);
      return {
        langId, storyId, mode, source,
        queue,
        idx: 0,
        wrongPile: [],
        revealed: false,
        flipped: false,
        lastInput: '',
        correctOnFirst: 0,
        originalQueueLen: queue.length
      };
    }

    function ensureCardSession(langId, storyId, mode, source) {
      // Different story or source → fresh queue. Mode change alone
      // just resets the visible surface so the queue continues.
      if (!cardSession ||
          cardSession.langId !== langId ||
          cardSession.storyId !== storyId ||
          cardSession.source !== source) {
        cardSession = buildCardSession(langId, storyId, mode, source);
      } else if (cardSession.mode !== mode) {
        cardSession.mode = mode;
        cardSession.revealed = false;
        cardSession.flipped = false;
        cardSession.lastInput = '';
      }
      return cardSession;
    }

    function renderCards() {
      const lang = getActiveLang();
      const storyId = lang.lastStoryId;

      if (!storyId) {
        return `<div class="glass empty-state">
          <div class="em-icon">🎴</div>
          Pick a story from Library to start studying.
        </div>`;
      }

      const story = getStory(lang.id, storyId);
      if (!story) return `<div class="glass empty-state">Story not found.</div>`;

      const mode = state.settings.cardMode || 'type';
      const source = state.settings.cardSource || 'sentences';
      const hasVocab = Array.isArray(story.vocabulary) && story.vocabulary.length > 0;

      // Source toggle: only render Vocabulary option if story actually has one.
      const sourceToggle = `
        <div class="read-toggle">
          <button class="${source === 'sentences'  ? 'active' : ''}" data-card-source="sentences">📖  Sentences</button>
          <button class="${source === 'vocabulary' ? 'active' : ''} ${hasVocab ? '' : 'tab-disabled'}" data-card-source="vocabulary" ${hasVocab ? '' : 'disabled'}>🔤  Vocabulary</button>
        </div>
      `;
      const modeToggle = `
        <div class="read-toggle three">
          <button class="${mode === 'type'   ? 'active' : ''}" data-card-mode="type">⌨️  Type</button>
          <button class="${mode === 'speak'  ? 'active' : ''}" data-card-mode="speak">🗣️  Speak</button>
          <button class="${mode === 'browse' ? 'active' : ''}" data-card-mode="browse">📋  Browse</button>
        </div>
      `;
      const toggles = sourceToggle + modeToggle;

      // Story has no vocab but vocab source is selected — fall back gracefully.
      const effectiveSource = (source === 'vocabulary' && !hasVocab) ? 'sentences' : source;

      // Browse mode bypasses the SRS session entirely — just renders
      // every item as a tile grid. No queue, no grading.
      if (mode === 'browse') {
        return `${toggles}${renderCardsBrowse(story, effectiveSource, lang)}`;
      }

      const session = ensureCardSession(lang.id, storyId, mode, effectiveSource);

      if (session.queue.length === 0 && session.wrongPile.length === 0) {
        const label = effectiveSource === 'vocabulary' ? 'words' : 'cards';
        return `${toggles}
          <div class="glass session-end">
            <div class="se-title gradient-text">🎉 Nothing more due!</div>
            <div class="se-sub">All ${label} for this story are scheduled for the future.</div>
            <button class="gradient-btn" data-go-tab="library">Back to Library</button>
          </div>`;
      }

      if (session.idx >= session.queue.length) {
        if (session.wrongPile.length > 0) {
          session.queue = session.queue.concat(session.wrongPile);
          session.wrongPile = [];
        } else {
          const next = buildCardQueue(lang.id, storyId, effectiveSource);
          const continueBtn = next.length > 0
            ? `<button class="gradient-btn" data-cards-next="1">Continue with next batch</button>`
            : `<div style="margin-bottom:8px;">🎉 Nothing more due!</div>
               <button class="gradient-btn" data-go-tab="library">Back to Library</button>`;
          return `${toggles}
            <div class="glass session-end">
              <div class="se-title gradient-text">✅ Session complete</div>
              <div class="se-sub">${session.correctOnFirst} / ${session.originalQueueLen} correct on first attempt</div>
              ${continueBtn}
            </div>`;
        }
      }

      const card = session.queue[session.idx];
      const content = getCardContent(card.id, story);
      if (!content.item) {
        // Defensive: card refers to an item index that's been removed.
        // Drop it from queue and re-render.
        session.queue.splice(session.idx, 1);
        return renderCards();
      }

      const cardWord = effectiveSource === 'vocabulary' ? 'Word' : 'Card';
      const retryNote = (mode === 'speak' && session.wrongPile.length > 0)
        ? ` <span style="color: var(--text-soft);">(${session.wrongPile.length} to retry)</span>`
        : '';
      const counter = `<div class="card-counter">${cardWord} ${session.idx + 1} of ${session.queue.length}${retryNote}</div>`;

      const body = mode === 'type'
        ? renderCardsType(session, card, content)
        : renderCardsSpeak(session, card, content);

      return `${toggles}${counter}${body}`;
    }

    /* `content` is { type: 'sentence' | 'vocab', item, idx } from
       getCardContent(). For vocab the target text is the bare word;
       audio playback prefixes a real article so the noun reads naturally.
       German vocabulary stores the article itself (der/die/das) — passed
       through as-is. Italian stores m/f markers — those are letters TTS
       would pronounce ("eme lago"), so we derive the right article and
       splice it in. */
    function vocabSpeakText(item) {
      const word = String(item.de || '').trim();
      if (!item.gender) return word;
      const g = String(item.gender).trim();

      // Multi-char gender = the article itself (German style). Use as-is.
      if (g.length > 1) return `${g} ${word}`;

      // Single-letter gender (m/f) — Italian convention. Build the article.
      const lang = getActiveLang();
      if (lang && lang.id === 'it') {
        const lower = word.toLowerCase();
        const startsWithVowel = /^[aeiouàèéìòù]/.test(lower);
        const startsWithSpecialMasc = /^(s[bcdfghjklmnpqrstvwxz]|z|ps|gn|x|y)/.test(lower);
        if (g === 'm') {
          if (startsWithVowel) return `l'${word}`;
          if (startsWithSpecialMasc) return `lo ${word}`;
          return `il ${word}`;
        }
        if (g === 'f') {
          if (startsWithVowel) return `l'${word}`;
          return `la ${word}`;
        }
      }
      // Unknown short gender for unknown lang — speak the bare word
      // rather than the letter ("eme") which sounds wrong.
      return word;
    }
    function renderVocabPosTag(item) {
      if (!item.pos) return '';
      const label = item.pos === 'noun' && item.gender
        ? `${item.pos} · ${item.gender}`
        : item.pos;
      return `<div style="text-align:center; margin-bottom: 8px;"><span class="rule-tag">${escapeHtml(label)}</span></div>`;
    }
    function renderVocabAnswer(item) {
      // The big German display: gender prefix in dimmer color, then word.
      const gender = item.gender ? `<span style="color: var(--text-dim);">${escapeHtml(item.gender)}</span> ` : '';
      const plural = item.plural ? `<div style="font-size: 13px; color: var(--text-soft); text-align:center; margin-top: -8px; margin-bottom: 14px;">plural: ${escapeHtml(item.plural)}</div>` : '';
      return `
        <div class="big-sentence gradient-text">${gender}${escapeHtml(item.de)}</div>
        ${plural}
      `;
    }

    function renderCardsType(session, card, content) {
      const item = content.item;
      const promptEn = item.en;
      const answerDe = item.de;
      const speakText = content.type === 'vocab' ? vocabSpeakText(item) : answerDe;
      const posTag = content.type === 'vocab' ? renderVocabPosTag(item) : '';

      if (!session.revealed) {
        const targetName = targetLangNameLower();
        const placeholder = content.type === 'vocab'
          ? `Type the ${targetName} word...`
          : `Type your ${targetName} translation...`;
        return `
          <div class="glass card-pane">
            ${posTag}
            <div class="big-sentence gradient-text">${escapeHtml(promptEn)}</div>
            <textarea class="type-area" id="type-input"
              placeholder="${placeholder}"
              autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false">${escapeHtml(session.lastInput || '')}</textarea>
            <button class="gradient-btn full-btn" id="btn-show-answer">Show Answer</button>
          </div>
        `;
      }

      const dist = levenshtein(normalize(session.lastInput || ''), normalize(answerDe));
      let banner;
      if (dist === 0)       banner = `<div class="feedback ok">✅ Exact match</div>`;
      else if (dist <= 2)   banner = `<div class="feedback almost">🟡 Almost — small typo</div>`;
      else                  banner = `<div class="feedback bad">❌ Compare carefully</div>`;

      const answerBlock = content.type === 'vocab'
        ? renderVocabAnswer(item)
        : `<div class="big-sentence gradient-text">${escapeHtml(answerDe)}</div>`;

      return `
        <div class="glass card-pane">
          ${banner}
          ${answerBlock}
          <div class="audio-row">
            <button class="audio-btn" data-action="speak-de" data-text="${escapeHtml(speakText)}">🔊 ${speakLabelForActive()}</button>
          </div>
          ${posTag}
          ${item.note ? `<div class="note-callout">${escapeHtml(item.note)}</div>` : ''}
          <div class="grade-row">
            <button class="grade-btn again" data-grade="1"><span class="lbl">Again</span><span class="sub">restart</span></button>
            <button class="grade-btn hard"  data-grade="2"><span class="lbl">Hard</span><span class="sub">soon</span></button>
            <button class="grade-btn good"  data-grade="3"><span class="lbl">Good</span><span class="sub">on track</span></button>
            <button class="grade-btn easy"  data-grade="4"><span class="lbl">Easy</span><span class="sub">later</span></button>
          </div>
        </div>
      `;
    }

    function renderCardsSpeak(session, card, content) {
      const item = content.item;
      const speakText = content.type === 'vocab' ? vocabSpeakText(item) : item.de;
      const posTag = content.type === 'vocab' ? renderVocabPosTag(item) : '';

      if (!session.flipped) {
        const targetName = targetLangNameLower();
        const hint = content.type === 'vocab'
          ? `Say the ${targetName} word aloud, then tap to flip`
          : `Say it aloud in ${targetName}, then tap to flip`;
        return `
          <div class="glass card-pane flip-card" id="flip-card">
            ${posTag}
            <div class="big-sentence gradient-text">${escapeHtml(item.en)}</div>
            <button class="audio-btn" data-action="speak-en" data-text="${escapeHtml(item.en)}">🔊 EN</button>
            <div class="hint">${hint}</div>
          </div>
        `;
      }

      const answerBlock = content.type === 'vocab'
        ? renderVocabAnswer(item)
        : `<div class="big-sentence gradient-text">${escapeHtml(item.de)}</div>`;

      return `
        <div class="glass card-pane flip-card" id="flip-card">
          ${answerBlock}
          <div class="audio-row">
            <button class="audio-btn" data-action="speak-de" data-text="${escapeHtml(speakText)}">🔊 ${speakLabelForActive()}</button>
          </div>
          <div style="font-size: 14px; color: var(--text-dim); text-align: center; margin-top: 4px;">
            ${escapeHtml(item.en)}
          </div>
          <div class="audio-row">
            <button class="audio-btn" data-action="speak-en" data-text="${escapeHtml(item.en)}">🔊 EN</button>
          </div>
          ${posTag}
          ${item.note ? `<div class="note-callout">${escapeHtml(item.note)}</div>` : ''}
          <div class="hint">Were you right?</div>
        </div>
        <div class="wr-row">
          <button class="wr-btn wrong" data-speak-grade="wrong">← Wrong</button>
          <button class="wr-btn right" data-speak-grade="right">Right →</button>
        </div>
      `;
    }

    /* ============================================================
       Browse mode — non-SRS reference view. Renders every sentence or
       vocab item as a tile. Audio works; no grading, no progress.
       ============================================================ */
    function renderCardsBrowse(story, source, lang) {
      const items = source === 'vocabulary'
        ? (Array.isArray(story.vocabulary) ? story.vocabulary : [])
        : (Array.isArray(story.sentences)  ? story.sentences  : []);

      if (items.length === 0) {
        return `<div class="glass empty-state">
          <div class="em-icon">📋</div>
          Nothing to browse — story has no ${source === 'vocabulary' ? 'vocabulary' : 'sentences'} defined.
        </div>`;
      }

      const summary = `<div class="browse-summary">${items.length} ${source === 'vocabulary' ? 'words' : 'sentences'}</div>`;

      const tiles = items.map((item, i) => {
        if (source === 'vocabulary') {
          const speakText = vocabSpeakText(item);
          const genderHtml = item.gender ? `<span class="gen">${escapeHtml(item.gender)}</span>` : '';
          const posBits = [];
          if (item.pos) posBits.push(item.pos);
          const meta = posBits.length ? `<span class="bt-pos">${escapeHtml(posBits.join(' · '))}</span>` : '';
          const plural = item.plural ? `<span class="bt-plural">pl. ${escapeHtml(item.plural)}</span>` : '';
          return `
            <div class="glass browse-tile tile-vocab">
              <div class="bt-de">${genderHtml}${escapeHtml(item.de)}</div>
              <div class="bt-en">${escapeHtml(item.en || '')}</div>
              <div class="bt-meta">${meta}${plural}</div>
              <button class="audio-btn" data-action="speak-de" data-text="${escapeHtml(speakText)}">🔊 ${speakLabelForActive()}</button>
            </div>
          `;
        }
        // sentence tile
        return `
          <div class="glass browse-tile tile-sentence">
            <div class="bt-idx">#${i + 1}</div>
            <div class="bt-de">${escapeHtml(item.de)}</div>
            <div class="bt-en">${escapeHtml(item.en)}</div>

      return `${summary}<div class="browse-grid">${tiles}</div>`;

    /* ============================================================
       TEST TAB — tier selection + session loop.
       ============================================================ */
    // Test queue merges the story's built-in `grammarTests` with every
    // uploaded test pack registered for that language+story. Each test
    // carries `_packId` (null for built-in) and its `originalIdx` within
    // its source array — together they form the testAttempts key.
    function buildTestQueue(languageId, storyId, tier) {
      const story = state.storiesData[`${languageId}::${storyId}`];
      if (!story) return [];
      const items = [];
      story.grammarTests.forEach((t, originalIdx) => {
        if (t.tier === tier) items.push({ ...t, originalIdx, _packId: null, firstAttempt: true });
      });
      for (const k in state.testPacks) {
        const pack = state.testPacks[k];
        if (pack.languageId !== languageId || pack.storyId !== storyId) continue;
        pack.tests.forEach((t, originalIdx) => {
          if (t.tier === tier) items.push({ ...t, originalIdx, _packId: pack.id, firstAttempt: true });
        });
      }
      for (let i = items.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [items[i], items[j]] = [items[j], items[i]];
      }
      return items;
    }

    // Total count of tier-N tests (built-in + every installed pack).
    function countTestsForTier(languageId, storyId, tier) {
      const story = state.storiesData[`${languageId}::${storyId}`];
      if (!story) return 0;
      let n = story.grammarTests.filter(t => t.tier === tier).length;
      for (const k in state.testPacks) {
        const pack = state.testPacks[k];
        if (pack.languageId !== languageId || pack.storyId !== storyId) continue;
        n += pack.tests.filter(t => t.tier === tier).length;
      }
      return n;
    }

    function startTestSession(tier) {
      const lang = getActiveLang();
      const story = getStory(lang.id, lang.lastStoryId);
      if (!story) return;
      const queue = buildTestQueue(lang.id, story.id, tier);
      const nextTier = tier + 1;
      testSession = {
        langId: lang.id, storyId: story.id, tier,
        queue, idx: 0, wrongPile: [],
        revealed: false, lastInput: '',
        correctOnFirst: 0, totalThisSession: queue.length,
        prevNextTierUnlocked: nextTier <= 3 ? tierUnlocked(nextTier, lang.id, story.id) : true
      };
      render();
    }

    function renderTest() {
      const lang = getActiveLang();
      const storyId = lang.lastStoryId;

      if (!storyId) {
        return `<div class="glass empty-state">
          <div class="em-icon">🎯</div>
          Pick a story from Library to start grammar tests.
        </div>`;
      }
      const story = getStory(lang.id, storyId);
      if (!story) return `<div class="glass empty-state">Story not found.</div>`;

      // No active session → show tier selection.
      if (!testSession || testSession.langId !== lang.id || testSession.storyId !== storyId) {
        return renderTierSelection(story, lang);
      }
      return renderTestSession(story, lang);
    }

    function renderTierSelection(story, lang) {
      const tiers = [1, 2, 3];
      return tiers.map(tier => {
        const ruleNames = story.grammarRules.filter(r => r.tier === tier).map(r => r.name);
        const totalTests = countTestsForTier(lang.id, story.id, tier);
        const prefix    = `${lang.id}::${story.id}::tier${tier}::`;
        let totalAttempts = 0, totalCorrect = 0;
        for (const k in state.testAttempts) {
          if (k.startsWith(prefix)) {
            totalAttempts += state.testAttempts[k].attempts;
            totalCorrect  += state.testAttempts[k].correct;
          }
        }
        const acc = totalAttempts > 0 ? Math.round(totalCorrect / totalAttempts * 100) : 0;
        const unlocked = tierUnlocked(tier, lang.id, story.id);

        if (unlocked) {
          return `
            <div class="glass tier-card">
              <div class="tc-title gradient-text">Tier ${tier}</div>
              <div class="tc-rules">${ruleNames.map(escapeHtml).join(' · ')}</div>
              <div class="tc-stats">${totalTests} tests in pool · ${totalAttempts} attempts · ${acc}% lifetime accuracy</div>
              <button class="gradient-btn full-btn" data-start-tier="${tier}">Start Tier ${tier}</button>
            </div>
          `;
        }
        return `
          <div class="glass tier-card locked">
            <div class="tc-title"><span class="lock">🔒</span>Tier ${tier}</div>
            <div class="tc-rules">80% accuracy on 20+ Tier ${tier - 1} first attempts to unlock</div>
            <div class="tc-stats">${totalTests} tests in pool · ${totalAttempts} attempts · ${acc}% lifetime accuracy</div>
          </div>
        `;
      }).join('');
    }

    function renderTestSession(story, lang) {
      const ts = testSession;

      // Wrong-pile rejoin / session end.
      if (ts.idx >= ts.queue.length) {
        if (ts.wrongPile.length > 0) {
          ts.queue = ts.queue.concat(ts.wrongPile);
          ts.wrongPile = [];
        } else {
          const acc = ts.totalThisSession > 0
            ? Math.round(ts.correctOnFirst / ts.totalThisSession * 100)
            : 0;
          const nextTier = ts.tier + 1;
          let celebrateHtml = '';
          if (nextTier <= 3 &&
              !ts.prevNextTierUnlocked &&
              tierUnlocked(nextTier, lang.id, story.id)) {
            celebrateHtml = `<div class="celebrate">🎉 Tier ${nextTier} unlocked!</div>`;
          }
          return `
            <div class="glass session-end">
              <div class="se-title gradient-text">Tier ${ts.tier} complete</div>
              <div class="se-sub">${ts.correctOnFirst} / ${ts.totalThisSession} on first attempt (${acc}%)</div>
              ${celebrateHtml}
              <button class="gradient-btn" data-test-back="1">Back to Tier Selection</button>
            </div>
          `;
        }
      }

      const t = ts.queue[ts.idx];
      const isMultiple = t._type === 'choose-article' && Array.isArray(t._options);
      const targetLangLabel = (lang.name || 'target').toLowerCase();

      if (!ts.revealed) {
        if (isMultiple) {
          // Multiple-choice: render options as buttons; clicking submits.
          const optsHtml = t._options.map((opt, i) =>
            `<button class="ghost-btn full-btn" style="margin: 4px 0;" data-test-option="${escapeHtml(opt)}">${escapeHtml(opt)}</button>`
          ).join('');
          return `
            <div class="glass card-pane">
              <div style="text-align: center; margin-bottom: 12px;">
                <span class="rule-tag">${escapeHtml(t.rule)}</span>
              </div>
              <div class="big-sentence gradient-text">${escapeHtml(t.en)}</div>
              <div style="margin-top: 8px;">${optsHtml}</div>
            </div>
          `;
        }
        return `
          <div class="glass card-pane">
            <div style="text-align: center; margin-bottom: 12px;">
              <span class="rule-tag">${escapeHtml(t.rule)}</span>
            </div>
            <div class="big-sentence gradient-text">${escapeHtml(t.en)}</div>
            <textarea class="type-area" id="test-input"
              placeholder="Type your ${escapeHtml(targetLangLabel)} translation..."
              autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false">${escapeHtml(ts.lastInput || '')}</textarea>
            <button class="gradient-btn full-btn" id="btn-test-check">Check</button>
          </div>
        `;
      }

      // Reveal pane — same for free-text and multiple-choice. The grader
      // (gradeTestAnswer) already used the right comparison for both.
      const dist = levenshtein(normalize(ts.lastInput || ''), normalize(t.de));
      const ok = isMultiple
        ? (ts.lastInput || '').trim() === t.de.trim()
        : dist <= 2;
      const banner = ok
        ? `<div class="feedback ok">✅ Correct</div>`
        : `<div class="feedback bad">❌ Not quite</div>`;
      return `
        <div class="glass card-pane">
          ${banner}
          <div style="text-align: center; margin-bottom: 12px;">
            <span class="rule-tag">${escapeHtml(t.rule)}</span>
          </div>
          <div class="big-sentence gradient-text">${escapeHtml(t.de)}</div>
          <div class="audio-row">
            <button class="audio-btn" data-action="speak-de" data-text="${escapeHtml(t.de)}">🔊 ${speakLabelForActive()}</button>
          </div>
          ${t.trap ? `<div class="trap-callout">⚠️ ${escapeHtml(t.trap)}</div>` : ''}
          <button class="gradient-btn full-btn" id="btn-test-next" style="margin-top: 14px;">Next</button>
        </div>
      `;
    }

       SETTINGS TAB — Study prefs, Languages, Stories, Backup, Reset.

      const me = getActiveUser(rawState);
      const isAdmin = me && me.role === 'admin';

        renderSettingsLanguages(),

        isAdmin ? renderSettingsStories() : '',

        isAdmin ? renderSettingsReset() : ''

      return sections.join('');
