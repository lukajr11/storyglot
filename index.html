  <title>Storyglot ✦</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       THEME — CSS variables, swapped at runtime per active language.
       applyTheme() in JS rewrites these on :root.
       ============================================================ */
    :root {
      --bg-from: #0a0118;
      --bg-via: #150030;
      --bg-to: #001428;
      --grad-1: #a855f7;
      --grad-2: #ec4899;
      --grad-3: #06b6d4;
      --accent: #a855f7;

      --text: #f5f5fa;
      --text-dim: rgba(245, 245, 250, 0.62);
      --text-soft: rgba(245, 245, 250, 0.38);

      --glass-bg: rgba(255, 255, 255, 0.04);
      --glass-bg-strong: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.08);

      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }

    /* ============================================================
       RESET + BASE
       ============================================================ */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    *:focus { outline: none; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      overscroll-behavior-y: none;
    }

    body {
      background:
        radial-gradient(ellipse at top left, var(--bg-via), transparent 55%),
        radial-gradient(ellipse at bottom right, var(--bg-to), transparent 55%),
        var(--bg-from);
      background-attachment: fixed;
    }

    /* Soft cosmic glow blobs that follow the active gradient. */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle at 18% 12%, color-mix(in srgb, var(--grad-1) 22%, transparent), transparent 55%),
        radial-gradient(circle at 82% 88%, color-mix(in srgb, var(--grad-3) 18%, transparent), transparent 55%);
    }

    button { font-family: inherit; cursor: pointer; }

    /* ============================================================
       LAYOUT
       ============================================================ */
    #app {
      position: relative;
      z-index: 1;
      max-width: 760px;
      margin: 0 auto;
      padding: 22px 16px 96px;
    }

    .row { display: flex; gap: 10px; }
    .row-tight { display: flex; gap: 6px; }
    .stack { display: flex; flex-direction: column; gap: 12px; }

    /* ============================================================
       GLASS / GRADIENT PRIMITIVES
       ============================================================ */
    .glass {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      border-radius: var(--radius-lg);
    }

    .gradient-text {
      background: linear-gradient(135deg, var(--grad-1), var(--grad-2) 55%, var(--grad-3));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }

    .gradient-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 18px;
      border: none;
      border-radius: var(--radius-md);
      /* 2-stop gradient uses end colors (grad-1, grad-3) so white text
         stays readable across all themes — including ones where grad-2
         is pure white (Austrian / Italian flag). */
      background: linear-gradient(135deg, var(--grad-1), var(--grad-3));
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.3px;
      box-shadow: 0 10px 28px color-mix(in srgb, var(--grad-1) 35%, transparent);
      transition: transform 200ms ease, box-shadow 200ms ease, opacity 200ms ease;
    }
    .gradient-btn:active { transform: scale(0.97); }
    .gradient-btn[disabled] { opacity: 0.55; }

    .ghost-btn {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 500;
      font-size: 13px;
      transition: background 200ms ease, transform 200ms ease;
    }
    .ghost-btn:active { transform: scale(0.97); background: var(--glass-bg-strong); }

    .tag-pill {
      display: inline-block;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    /* ============================================================
       HEADER
       ============================================================ */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .app-logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .lang-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 13px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.6px;
      color: var(--text);
      text-transform: uppercase;
    }
    .lang-pill .flag { font-size: 16px; }

    /* ============================================================
       STATS ROW
       ============================================================ */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .stat-pill {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 12px 8px 10px;
      text-align: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .stat-pill .label {
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 1.1px;
      text-transform: uppercase;
      color: var(--text-soft);
    }
    .stat-pill .value {
      margin-top: 4px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
    }

    /* ============================================================
       TAB BAR
       ============================================================ */
    .tab-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      padding: 4px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      margin-bottom: 18px;
    }
    .tab {
      padding: 10px 0;
      border: none;
      background: transparent;
      color: var(--text-dim);
      border-radius: var(--radius-sm);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.4px;
      transition: background 200ms ease, color 200ms ease;
    }
    .tab.active {
      background: linear-gradient(135deg, var(--grad-1), var(--grad-3));
      color: #fff;
      box-shadow: 0 6px 18px color-mix(in srgb, var(--grad-1) 30%, transparent);
    }

    /* ============================================================
       LIBRARY — story cards
       ============================================================ */
    .story-card {
      padding: 22px;
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
    }
    .story-card::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -30%;
      width: 70%;
      height: 200%;
      background: radial-gradient(ellipse, color-mix(in srgb, var(--grad-2) 14%, transparent), transparent 70%);
      pointer-events: none;
    }
    .story-card .tags { margin-bottom: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
    .story-card .story-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.05;
      margin: 4px 0 6px;
    }
    .story-card .story-meta {
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 14px;
    }
    .progress {
      height: 6px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--grad-1), var(--grad-2), var(--grad-3));
      border-radius: 999px;
      transition: width 250ms ease;
    }
    .story-card .story-foot {
      font-size: 12px;
      color: var(--text-soft);
      margin-bottom: 16px;
    }

    /* ============================================================
       READ TAB
       ============================================================ */
    .read-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 4px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      margin-bottom: 16px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .read-toggle button {
      background: transparent;
      border: none;
      padding: 10px 0;
      border-radius: var(--radius-sm);
      color: var(--text-dim);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 500;
      font-size: 13px;
      transition: background 200ms ease, color 200ms ease;
    }
    .read-toggle button.active {
      background: linear-gradient(135deg, var(--grad-1), var(--grad-3));
      color: #fff;
    }

    .play-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 14px;
    }

    .story-prose {
      padding: 22px;
      font-size: 18px;
      line-height: 1.75;
      letter-spacing: 0.1px;
    }
    .story-prose .sent {
      transition: background 200ms ease, color 200ms ease;
      border-radius: 6px;
      padding: 1px 2px;
    }
    .story-prose .sent.active {
      background: linear-gradient(120deg,
        color-mix(in srgb, var(--grad-1) 28%, transparent),
        color-mix(in srgb, var(--grad-2) 28%, transparent));
      color: #fff;
    }

    .english-toggle {
      margin-top: 12px;
      width: 100%;
    }

    .english-block {
      margin-top: 12px;
      padding: 18px;
      font-family: 'Inter', monospace;
      font-size: 14px;
      line-height: 1.7;
      color: var(--text-dim);
      white-space: pre-wrap;
    }

    .sentence-row {
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: background 200ms ease, transform 200ms ease;
    }
    .sentence-row:active { transform: scale(0.995); }
    .sentence-row.active {
      background: linear-gradient(135deg,
        color-mix(in srgb, var(--grad-1) 16%, transparent),
        color-mix(in srgb, var(--grad-2) 16%, transparent));
      border-color: color-mix(in srgb, var(--accent) 40%, transparent);
    }
    .sentence-row .de {
      font-size: 16px;
      line-height: 1.45;
      font-weight: 500;
    }
    .sentence-row .en {
      font-size: 13px;
      color: var(--text-dim);
      margin-top: 4px;
    }
    .sentence-row .note {
      font-size: 11.5px;
      color: var(--text-dim);
      background: rgba(255, 255, 255, 0.04);
      padding: 7px 10px;
      border-radius: 8px;
      margin-top: 8px;
      border-left: 2px solid var(--grad-1);
      line-height: 1.45;
    }

    .empty-state {
      padding: 40px 22px;
      text-align: center;
      color: var(--text-dim);
      font-size: 14px;
    }
    .empty-state .em-icon {
      font-size: 32px;
      margin-bottom: 10px;
      opacity: 0.6;
    }

    /* ============================================================
       MODAL
       ============================================================ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal {
      width: 100%;
      max-width: 420px;
      padding: 22px;
    }
    .modal-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 14px;
    }
    .lang-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .lang-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.02);
      transition: background 200ms ease, transform 200ms ease;
    }
    .lang-row:active { transform: scale(0.99); }
    .lang-row.active {
      background: linear-gradient(135deg,
        color-mix(in srgb, var(--grad-1) 18%, transparent),
        color-mix(in srgb, var(--grad-2) 18%, transparent));
      border-color: color-mix(in srgb, var(--accent) 50%, transparent);
      box-shadow: 0 8px 22px color-mix(in srgb, var(--grad-1) 22%, transparent);
    }
    .lang-row .flag { font-size: 22px; }
    .lang-row .name {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 15px;
    }
    .lang-row .sub {
      font-size: 11px;
      color: var(--text-soft);
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    /* ============================================================
       PLACEHOLDER (Cards / Test tabs in chunk 1)
       ============================================================ */
    .placeholder {
      padding: 36px 22px;
      text-align: center;
    }
    .placeholder .ph-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 6px;
    }
    .placeholder .ph-sub {
      font-size: 13px;
      color: var(--text-dim);
    }

    /* ============================================================
       CARDS + TEST — Chunk 2 additions.
       New classes only; nothing here overrides Chunk 1 styles.
       ============================================================ */
    .card-counter {
      text-align: center;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      letter-spacing: 1px;
      color: var(--text-soft);
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .card-pane {
      padding: 22px;
      margin-bottom: 14px;
      animation: fade-in 200ms ease;
    }
    @keyframes fade-in {
      from { opacity: 0; transform: translateX(8px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .big-sentence {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 26px;
      font-weight: 600;
      line-height: 1.25;
      text-align: center;
      margin: 8px 0 18px;
      letter-spacing: 0.1px;
    }

    .type-area {
      width: 100%;
      min-height: 88px;
      background: var(--glass-bg-strong);
      border: 1px solid var(--glass-border);
      color: var(--text);
      font-family: inherit;
      font-size: 16px;
      line-height: 1.5;
      padding: 14px 16px;
      border-radius: var(--radius-md);
      resize: none;
      margin-bottom: 14px;
      outline: none;
      -webkit-appearance: none;
    }
    .type-area:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 28%, transparent);
    }

    .full-btn { width: 100%; }

    /* Feedback banners — three states for Type, two states for Test. */
    .feedback {
      padding: 12px 14px;
      border-radius: var(--radius-md);
      margin-bottom: 14px;
      font-size: 13.5px;
      font-weight: 500;
      border: 1px solid;
      animation: slide-down 180ms ease;
    }
    @keyframes slide-down {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .feedback.ok     { background: rgba(34,197,94,0.10);  border-color: rgba(34,197,94,0.32);  color: #d1fae5; }
    .feedback.almost { background: rgba(234,179,8,0.10); border-color: rgba(234,179,8,0.32); color: #fef9c3; }
    .feedback.bad    { background: rgba(239,68,68,0.10); border-color: rgba(239,68,68,0.32); color: #fecaca; }

    /* Inline audio button (small pill). */
    .audio-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--glass-bg-strong);
      border: 1px solid var(--glass-border);
      padding: 8px 14px;
      border-radius: 999px;
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: 0.5px;
      transition: transform 200ms ease, box-shadow 200ms ease;
    }
    .audio-btn:active { transform: scale(0.96); }
    .audio-btn.speaking {
      animation: audio-pulse 700ms ease-in-out infinite;
      border-color: color-mix(in srgb, var(--accent) 50%, transparent);
    }
    @keyframes audio-pulse {
      0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 35%, transparent); transform: scale(1); }
      50%      { box-shadow: 0 0 0 8px transparent; transform: scale(1.04); }
    }
    .audio-row {
      display: flex; gap: 8px; justify-content: center;
      margin: 8px 0 12px;
    }

    .note-callout {
      padding: 10px 12px;
      background: rgba(255,255,255,0.04);
      border-left: 2px solid var(--grad-1);
      border-radius: 8px;
      font-size: 12.5px;
      line-height: 1.5;
      color: var(--text-dim);
      margin: 12px 0;
    }

    /* Type mode grade row. */
    .grade-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 6px;
    }
    .grade-btn {
      padding: 14px 0;
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      background: var(--glass-bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.4px;
      transition: transform 100ms ease, background 200ms ease, box-shadow 200ms ease;
    }
    .grade-btn:active { transform: scale(0.96); }
    .grade-btn .lbl { display: block; }
    .grade-btn .sub {
      display: block;
      font-size: 9.5px;
      font-weight: 500;
      color: var(--text-soft);
      margin-top: 3px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .grade-btn.again { box-shadow: inset 0 0 0 1px rgba(239,68,68,0.32); color: #fca5a5; }
    .grade-btn.hard  { box-shadow: inset 0 0 0 1px rgba(249,115,22,0.32); color: #fdba74; }
    .grade-btn.good  { box-shadow: inset 0 0 0 1px rgba(34,197,94,0.32);  color: #86efac; }
    .grade-btn.easy  { box-shadow: inset 0 0 0 1px rgba(59,130,246,0.32); color: #93c5fd; }
    .grade-btn.again:active { background: rgba(239,68,68,0.12); }
    .grade-btn.hard:active  { background: rgba(249,115,22,0.12); }
    .grade-btn.good:active  { background: rgba(34,197,94,0.12); }
    .grade-btn.easy:active  { background: rgba(59,130,246,0.12); }

    /* Speak mode: flip card + swipe state. */
    .flip-card {
      min-height: 240px;
      padding: 28px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-y;
      transition: transform 220ms ease, opacity 220ms ease, box-shadow 220ms ease, border-color 200ms ease;
      will-change: transform;
    }
    .flip-card .hint { font-size: 12px; color: var(--text-soft); letter-spacing: 0.4px; margin-top: 4px; }
    .flip-card.tint-right { box-shadow: 0 12px 36px rgba(34,197,94,0.32); border-color: rgba(34,197,94,0.45); }
    .flip-card.tint-left  { box-shadow: 0 12px 36px rgba(239,68,68,0.32); border-color: rgba(239,68,68,0.45); }
    .flip-card.commit-right { transform: translateX(120vw) rotate(20deg) !important; opacity: 0; }
    .flip-card.commit-left  { transform: translateX(-120vw) rotate(-20deg) !important; opacity: 0; }

    .wr-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }
    .wr-btn {
      padding: 16px 0;
      border-radius: var(--radius-md);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.4px;
      transition: transform 100ms ease, background 200ms ease;
    }
    .wr-btn:active { transform: scale(0.96); }
    .wr-btn.wrong { box-shadow: inset 0 0 0 1px rgba(239,68,68,0.36); color: #fca5a5; }
    .wr-btn.right { box-shadow: inset 0 0 0 1px rgba(34,197,94,0.36); color: #86efac; }
    .wr-btn.wrong:active { background: rgba(239,68,68,0.12); }
    .wr-btn.right:active { background: rgba(34,197,94,0.12); }

    /* Session end. */
    .session-end {
      padding: 36px 22px;
      text-align: center;
    }
    .session-end .se-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 8px;
    }
    .session-end .se-sub {
      font-size: 14px;
      color: var(--text-dim);
      margin-bottom: 18px;
    }

    /* Test tier-selection cards. */
    .tier-card {
      padding: 22px;
      margin-bottom: 12px;
    }
    .tier-card .tc-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.05;
    }
    .tier-card .tc-rules {
      font-size: 12.5px;
      color: var(--text-dim);
      margin: 6px 0 10px;
      letter-spacing: 0.2px;
    }
    .tier-card .tc-stats {
      font-size: 12px;
      color: var(--text-soft);
      margin-bottom: 14px;
    }
    .tier-card.locked { opacity: 0.55; }
    .tier-card .lock { margin-right: 6px; }

    .trap-callout {
      padding: 12px 14px;
      border-radius: var(--radius-md);
      background: rgba(234,179,8,0.10);
      border: 1px solid rgba(234,179,8,0.32);
      color: #fef9c3;
      font-size: 13px;
      line-height: 1.5;
      margin-top: 12px;
    }

    .celebrate {
      margin: 14px 0;
      padding: 14px 16px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg,
        color-mix(in srgb, var(--grad-1) 22%, transparent),
        color-mix(in srgb, var(--grad-2) 22%, transparent));
      border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent);
      box-shadow: 0 10px 28px color-mix(in srgb, var(--accent) 28%, transparent);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      text-align: center;
    }

    .rule-tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 16%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 38%, transparent);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.7px;
      text-transform: uppercase;
    }

    /* ============================================================
       CHUNK 3A — Toasts, Settings, Sparkline, Import/Export
       ============================================================ */

    /* Toast stack — fixed bottom-center, slides up. */
    #toast-stack {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
      width: min(90vw, 420px);
    }
    .toast {
      pointer-events: auto;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 13.5px;
      font-weight: 500;
      line-height: 1.4;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      animation: toast-up 250ms ease-out;
      border: 1px solid;
    }
    @keyframes toast-up {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .toast.success {
      background: rgba(34,197,94,0.14); border-color: rgba(34,197,94,0.36); color: #d1fae5;
      box-shadow: 0 12px 30px rgba(34,197,94,0.22);
    }
    .toast.error {
      background: rgba(239,68,68,0.14); border-color: rgba(239,68,68,0.36); color: #fecaca;
      box-shadow: 0 12px 30px rgba(239,68,68,0.22);
    }
    .toast.info {
      background: color-mix(in srgb, var(--accent) 16%, transparent);
      border-color: color-mix(in srgb, var(--accent) 40%, transparent);
      color: var(--text);
      box-shadow: 0 12px 30px color-mix(in srgb, var(--accent) 28%, transparent);
    }
    .toast.exiting { animation: toast-down 250ms ease-in forwards; }
    @keyframes toast-down {
      to { opacity: 0; transform: translateY(8px); }
    }

    /* Settings tab — section cards + form rows. */
    .section-card {
      padding: 22px;
      margin-bottom: 14px;
    }
    .section-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 4px;
    }
    .section-sub {
      font-size: 12px;
      color: var(--text-soft);
      letter-spacing: 0.4px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .form-row { margin-bottom: 14px; }
    .form-row .lbl {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    .form-row .lbl .val {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      color: var(--text);
    }
    .form-row input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      outline: none;
    }
    .form-row input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--grad-1), var(--grad-2));
      cursor: pointer;
      box-shadow: 0 4px 12px color-mix(in srgb, var(--grad-1) 40%, transparent);
    }
    .form-row select {
      width: 100%;
      background: var(--glass-bg-strong);
      border: 1px solid var(--glass-border);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      -webkit-appearance: none;
      appearance: none;
    }

    .row-list { display: flex; flex-direction: column; gap: 8px; }
    .item-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.02);
    }
    .item-row .grow { flex: 1; min-width: 0; }
    .item-row .title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 14px;
      line-height: 1.2;
    }
    .item-row .meta {
      font-size: 11px;
      color: var(--text-soft);
      letter-spacing: 0.3px;
      margin-top: 2px;
    }
    .item-row .actions { display: flex; gap: 6px; }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      background: color-mix(in srgb, var(--accent) 18%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 36%, transparent);
      color: var(--text);
    }

    .small-btn {
      padding: 6px 10px;
      font-size: 11px;
      border-radius: 8px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }
    .small-btn.danger { box-shadow: inset 0 0 0 1px rgba(239,68,68,0.36); color: #fca5a5; }
    .small-btn.danger:active { background: rgba(239,68,68,0.12); }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }

    .danger-btn {
      width: 100%;
      padding: 14px;
      border-radius: var(--radius-md);
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.36);
      color: #fca5a5;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.4px;
      box-shadow: 0 8px 24px rgba(239,68,68,0.16);
    }
    .danger-btn:active { background: rgba(239,68,68,0.16); }

    .warning-banner {
      padding: 12px 14px;
      border-radius: var(--radius-md);
      background: rgba(234,179,8,0.10);
      border: 1px solid rgba(234,179,8,0.32);
      color: #fef9c3;
      font-size: 13px;
      margin-bottom: 14px;
    }

    /* Modal text input (Reset confirmation, Replace story confirm). */
    .modal input[type=text] {
      width: 100%;
      background: var(--glass-bg-strong);
      border: 1px solid var(--glass-border);
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      margin: 8px 0 12px;
      -webkit-appearance: none;
      outline: none;
    }
    .modal input[type=text]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 28%, transparent);
    }
    .modal-body p {
      margin: 0 0 10px;
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-dim);
    }

    /* Library Progress section. */
    .progress-section {
      padding: 22px;
      margin-top: 8px;
      margin-bottom: 14px;
    }
    .progress-toggle {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: transparent;
      border: none;
      padding: 0;
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.3px;
    }
    .progress-toggle .arrow { transition: transform 200ms ease; }
    .progress-toggle.open .arrow { transform: rotate(90deg); }
    .progress-body { margin-top: 14px; animation: fade-in 200ms ease; }

    .streak-display {
      text-align: center;
      padding: 10px 0 14px;
    }
    .streak-display .num {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 48px;
      font-weight: 700;
      line-height: 1;
    }
    .streak-display .lbl {
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-soft);
      margin-top: 4px;
    }
    .sparkline-wrap {
      width: 100%;
      height: 80px;
      margin: 8px 0 12px;
    }
    .sparkline-wrap svg { width: 100%; height: 100%; display: block; }

    .vocab-line {
      text-align: center;
      font-size: 13px;
      color: var(--text-dim);
      margin: 8px 0 14px;
    }
    .vocab-line .num {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      color: var(--text);
    }

    /* Tab bar grows from 4 to 5 to 6 columns. */
    .tab-bar.cols-5 { grid-template-columns: repeat(5, 1fr); }
    .tab-bar.cols-5 .tab { font-size: 12px; padding: 9px 0; }
    .tab-bar.cols-6 { grid-template-columns: repeat(6, 1fr); }
    .tab-bar.cols-6 .tab { font-size: 11.5px; padding: 9px 0; letter-spacing: 0.2px; }

    /* Rules tab — explanation cards with examples + tips. */
    .rule-card {
      padding: 22px;
      margin-bottom: 14px;
    }
    .rule-card .rc-tier {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 32%, transparent);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: var(--text);
      margin-bottom: 10px;
    }
    .rule-card .rc-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 12px;
    }
    .rule-card .rc-explain {
      font-size: 14.5px;
      line-height: 1.55;
      color: var(--text);
      margin-bottom: 14px;
    }
    .rule-card .rc-section-label {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-soft);
      margin: 14px 0 8px;
    }
    .rule-example {
      padding: 10px 12px;
      margin-bottom: 6px;
      background: rgba(255, 255, 255, 0.03);
      border-left: 2px solid var(--grad-2);
      border-radius: 8px;
    }
    .rule-example .ex-de {
      font-size: 14.5px;
      line-height: 1.4;
      font-weight: 500;
    }
    .rule-example .ex-de mark {
      background: linear-gradient(120deg,
        color-mix(in srgb, var(--grad-1) 40%, transparent),
        color-mix(in srgb, var(--grad-2) 40%, transparent));
      color: #fff;
      padding: 1px 5px;
      border-radius: 4px;
      font-weight: 700;
    }
    .rule-example .ex-en {
      font-size: 12.5px;
      color: var(--text-dim);
      margin-top: 3px;
    }
    .rule-example .audio-btn {
      margin-top: 6px;
      font-size: 10.5px;
      padding: 4px 10px;
    }
    .rule-tips {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .rule-tips li {
      position: relative;
      padding: 4px 0 4px 18px;
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-dim);
    }
    .rule-tips li::before {
      content: '›';
      position: absolute;
      left: 4px;
      top: 4px;
      color: var(--accent);
      font-weight: 700;
      font-size: 14px;
    }

    .tier-divider {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--text-soft);
      text-align: center;
      margin: 12px 0 8px;
    }

    /* Paradigm tables inside Rules cards. Horizontal scroll for wide ones. */
    .rule-table-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 6px 0 4px;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.03);
    }
    .rule-table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12.5px;
      line-height: 1.45;
    }
    .rule-table th, .rule-table td {
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      white-space: nowrap;
    }
    .rule-table th {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--text-soft);
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid var(--glass-border);
      position: sticky;
      top: 0;
    }
    .rule-table tr:last-child td { border-bottom: none; }
    .rule-table td.rt-label {
      font-weight: 600;
      color: var(--text-dim);
      font-size: 11.5px;
      letter-spacing: 0.3px;
    }
    .rt-note {
      font-size: 11.5px;
      color: var(--text-soft);
      font-style: italic;
      margin: 6px 0 12px;
      line-height: 1.5;
    }

    /* Disabled toggle button (e.g. Vocabulary toggle when story has no vocab). */
    .read-toggle button.tab-disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .read-toggle button[disabled] { cursor: not-allowed; }

    /* ============================================================
       LIBRARY — top-level language journey cards (Stage B).
       Each card represents a full A1→B2 series for one language.
       ============================================================ */
    .journey-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }
    @media (min-width: 720px) {
      .journey-grid { grid-template-columns: 1fr 1fr; }
    }
    .journey-card {
      position: relative;
      overflow: hidden;
      min-height: 220px;
      padding: 0;
      cursor: pointer;
      transition: transform 200ms ease, box-shadow 220ms ease, border-color 220ms ease;
    }
    .journey-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 36px color-mix(in srgb, var(--accent) 22%, transparent);
      border-color: color-mix(in srgb, var(--accent) 50%, transparent);
    }
    .journey-card .jc-cover {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
    }
    .journey-card .jc-cover svg { width: 100%; height: 100%; display: block; }
    .journey-card .jc-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to top, rgba(0, 0, 0, 0.78) 0%, rgba(0, 0, 0, 0.15) 60%, transparent 100%),
        linear-gradient(135deg, transparent 60%, color-mix(in srgb, var(--accent) 18%, transparent));
      pointer-events: none;
    }
    .journey-card .jc-body {
      position: absolute;
      inset: 0;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 6px;
      z-index: 1;
    }
    .journey-card .jc-flag {
      font-size: 30px;
      line-height: 1;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.4));
      align-self: flex-end;
      position: absolute;
      top: 18px;
      right: 20px;
    }
    .journey-card .jc-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1px;
      line-height: 1.05;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }
    .journey-card .jc-teaser {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.45;
      max-width: 86%;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
    }
    .journey-card .jc-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 6px;
      font-size: 11px;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.78);
      text-transform: uppercase;
    }
    .journey-card .jc-progress-bar {
      height: 4px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 99px;
      overflow: hidden;
      width: 100%;
      margin-top: 6px;
    }
    .journey-card .jc-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--grad-1), var(--grad-3));
    }

    /* Back-to-languages bar shown above story tiles when drilled in. */
    .back-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .back-bar .back-btn {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      padding: 8px 14px;
      border-radius: 999px;
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: transform 180ms ease, background 200ms ease;
    }
    .back-bar .back-btn:active { transform: scale(0.96); }
    .back-bar .back-context {
      font-size: 12px;
      color: var(--text-soft);
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    /* Story-tile completion badge (subtle "in progress" / "✓" on the
       cover area). Layered over the existing story-card cover image. */
    .story-card .story-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 2;
      background: color-mix(in srgb, var(--bg-from) 80%, transparent);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 4px 10px;
      border-radius: 999px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--text);
    }
    .story-card .story-badge.done {
      background: color-mix(in srgb, var(--grad-3) 28%, transparent);
      border-color: color-mix(in srgb, var(--grad-3) 50%, transparent);
    }

    /* Global Review button at the bottom of top-level library. */
    .global-review {
      width: 100%;
      padding: 16px;
      border-radius: var(--radius-md);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.5px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      cursor: pointer;
      transition: transform 180ms ease, border-color 200ms ease, box-shadow 200ms ease;
    }
    .global-review:hover {
      border-color: color-mix(in srgb, var(--accent) 50%, transparent);
      box-shadow: 0 10px 24px color-mix(in srgb, var(--accent) 22%, transparent);
    }
    .global-review:active { transform: scale(0.98); }

    /* Name-selection screen — full-screen overlay, similar shell to
       the login picker but content-focused. */
    .name-screen {
      position: fixed;
      inset: 0;
      z-index: 60;
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      animation: fade-in 200ms ease;
    }
    .name-screen .ns-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-size: cover;
      background-position: center;
      opacity: 0.6;
    }
    .name-screen .ns-bg svg { width: 100%; height: 100%; display: block; }
    .name-screen .ns-overlay {
      position: absolute;
      inset: 0;
      z-index: 0;
      background:
        linear-gradient(to bottom, rgba(0,0,0,0.55), rgba(0,0,0,0.85));
    }
    .name-screen .ns-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 26px 22px;
      text-align: center;
    }
    .name-screen .ns-flag {
      font-size: 40px;
      line-height: 1;
      margin-bottom: 8px;
    }
    .name-screen .ns-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      font-weight: 800;
      margin: 0 0 6px;
      letter-spacing: 0.5px;
    }
    .name-screen .ns-sub {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .name-screen select,
    .name-screen input[type=text] {
      width: 100%;
      background: var(--glass-bg-strong);
      border: 1px solid var(--glass-border);
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      margin-bottom: 10px;
      -webkit-appearance: none;
      outline: none;
    }
    .name-screen .ns-or {
      font-size: 11px;
      letter-spacing: 1px;
      color: var(--text-soft);
      text-transform: uppercase;
      margin: 6px 0 8px;
    }
    .name-screen .ns-actions {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    body.name-locked #app, body.name-locked #toast-stack { display: none; }

    /* 3-way toggle for the Cards mode bar (Type / Speak / Browse). */
    .read-toggle.three { grid-template-columns: repeat(3, 1fr); }

    /* Browse view — tile grid of every sentence or vocab item. */
    .browse-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
      margin-top: 4px;
    }
    .browse-tile {
      padding: 14px 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: fade-in 200ms ease;
    }
    .browse-tile.tile-vocab .bt-de {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.1px;
    }
    .browse-tile.tile-vocab .bt-de .gen {
      color: var(--text-dim);
      font-weight: 600;
      margin-right: 4px;
    }
    .browse-tile.tile-sentence .bt-de {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
    }
    .browse-tile .bt-en {
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.4;
    }
    .browse-tile .bt-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }
    .browse-tile .bt-pos {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--text-soft);
    }
    .browse-tile .bt-plural {
      font-size: 10.5px;
      color: var(--text-soft);
      letter-spacing: 0.2px;
    }
    .browse-tile .bt-idx {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10px;
      letter-spacing: 0.4px;
      color: var(--text-soft);
    }
    .browse-tile .audio-btn {
      font-size: 10.5px;
      padding: 4px 10px;
      align-self: flex-start;
    }
    .browse-summary {
      text-align: center;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      letter-spacing: 0.6px;
      color: var(--text-soft);
      margin: 10px 0 14px;
      text-transform: uppercase;
    }

    /* ============================================================
       VISUAL ATMOSPHERE — hero cover, story covers, tab cards.
       ============================================================ */

    /* Hero cover at top of Library tab. Holds either an uploaded image
       (background-image) or the language's default SVG art. */
    .hero-cover {
      position: relative;
      width: 100%;
      height: 200px;
      border-radius: 22px;
      overflow: hidden;
      margin-bottom: 18px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.32);
      background-color: var(--bg-via);
      background-size: cover;
      background-position: center;
    }
    .hero-cover .cover-art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .hero-cover .hero-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to top, rgba(0, 0, 0, 0.72) 0%, rgba(0, 0, 0, 0.18) 50%, transparent 100%),
        linear-gradient(135deg, transparent 60%, color-mix(in srgb, var(--accent) 18%, transparent));
      pointer-events: none;
    }
    .hero-cover .hero-title {
      position: absolute;
      bottom: 16px;
      left: 18px;
      right: 18px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
    }
    .hero-cover .hero-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1px;
      line-height: 1.05;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }
    .hero-cover .hero-flag {
      font-size: 36px;
      line-height: 1;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.4));
    }
    .hero-cover .hero-sub {
      font-size: 12px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.78);
      margin-top: 4px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    /* Story card with cover image: text on left, image fading right. */
    .story-card.with-cover {
      padding-right: 38%;
      min-height: 188px;
    }
    .story-card .story-cover {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 46%;
      background-size: cover;
      background-position: center;
      pointer-events: none;
      z-index: 0;
    }
    .story-card .story-cover::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to right,
        var(--bg-from) 0%,
        color-mix(in srgb, var(--bg-via) 70%, transparent) 30%,
        transparent 75%,
        rgba(0, 0, 0, 0.18) 100%);
    }
    .story-card .story-cover.svg-cover svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .story-card.with-cover > *:not(.story-cover) {
      position: relative;
      z-index: 1;
    }

    /* Tab bar redesigned as glass cards with icons. */
    .tab-cards {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }
    .tab-card {
      padding: 12px 4px 10px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      color: var(--text-dim);
      font-family: 'Space Grotesk', sans-serif;
      cursor: pointer;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: transform 180ms ease, background 220ms ease,
                  border-color 220ms ease, box-shadow 220ms ease, color 220ms ease;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .tab-card:active { transform: scale(0.96); }
    .tab-card .tab-icon {
      font-size: 22px;
      line-height: 1;
    }
    .tab-card .tab-label {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.4px;
    }
    .tab-card.active {
      background: linear-gradient(135deg, var(--grad-1), var(--grad-3));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 10px 26px color-mix(in srgb, var(--grad-1) 32%, transparent);
    }

    /* Cover-image upload row inside Settings (lang/story rows). */
    .cover-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--glass-border);
    }
    .cover-thumb {
      width: 64px;
      height: 48px;
      border-radius: 8px;
      background: var(--glass-bg-strong);
      border: 1px solid var(--glass-border);
      flex: none;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: var(--text-soft);
      overflow: hidden;
    }
    .cover-thumb svg { width: 100%; height: 100%; display: block; }

    /* Subtle ambient blobs that respond to language theme on every page.
       (Already present in body::before but slightly stronger now.) */
    body::before {
      background:
        radial-gradient(circle at 18% 12%, color-mix(in srgb, var(--grad-1) 26%, transparent), transparent 55%),
        radial-gradient(circle at 82% 88%, color-mix(in srgb, var(--grad-3) 22%, transparent), transparent 55%);
    }

    @media (max-width: 480px) {
      .tab-cards { grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .tab-card { padding: 10px 2px 8px; }
      .tab-card .tab-icon { font-size: 19px; }
      .tab-card .tab-label { font-size: 9.5px; letter-spacing: 0.2px; }
      .hero-cover { height: 160px; }
      .hero-cover .hero-name { font-size: 22px; }
      .story-card.with-cover { padding-right: 0; min-height: auto; }
      .story-card .story-cover { display: none; }
    }

    /* Login picker — Netflix-style profile chooser shown on every load. */
    .login-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 40px 20px;
      z-index: 50;
      animation: fade-in 200ms ease;
    }
    .login-screen .greeting {
      text-align: center;
    }
    .login-screen .brand {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 3px;
      margin-bottom: 6px;
    }
    .login-screen .ask {
      font-size: 14px;
      color: var(--text-dim);
      letter-spacing: 0.4px;
    }
    .profile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 200px));
      gap: 18px;
      justify-content: center;
      width: 100%;
      max-width: 720px;
    }
    .profile-card {
      padding: 22px 18px;
      text-align: center;
      cursor: pointer;
      transition: transform 200ms ease, box-shadow 200ms ease, border-color 200ms ease;
      border: 1px solid var(--glass-border);
    }
    .profile-card:active { transform: scale(0.98); }
    .profile-card:hover {
      border-color: color-mix(in srgb, var(--accent) 50%, transparent);
      box-shadow: 0 12px 32px color-mix(in srgb, var(--accent) 22%, transparent);
    }
    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--grad-1), var(--grad-2) 55%, var(--grad-3));
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 38px;
      font-weight: 700;
      color: #fff;
      margin: 0 auto 12px;
      box-shadow: 0 14px 32px color-mix(in srgb, var(--grad-1) 32%, transparent);
    }
    .profile-card .pname {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .profile-card .prole {
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-soft);
    }
    .profile-card .lock-badge {
      display: inline-block;
      margin-left: 4px;
      font-size: 11px;
    }

    /* Hide the main app while showing the login screen — saves a render
       pass but also stops handlers below from grabbing focus. */
    body.locked #app, body.locked #toast-stack { display: none; }

    /* ============================================================
       RESPONSIVE — small phone tweaks (mostly iPad-first)
       ============================================================ */
    @media (max-width: 380px) {
      .stat-pill .value { font-size: 19px; }
      .story-card .story-title { font-size: 24px; }
      .story-prose { font-size: 16px; }
      .big-sentence { font-size: 22px; }
      .grade-btn { font-size: 12px; }
      .tab-bar.cols-5 .tab { font-size: 10.5px; letter-spacing: 0.2px; }
      .streak-display .num { font-size: 40px; }
    }

    /* ============================================================
       FIRST-READ FLOW — Stage C styles. Six-step linear journey:
       atmosphere listen, grammar preview, sentence walk, vocab walk,
       closing listen, drill-flow unlock celebration.
       ============================================================ */
    .fr-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 14px;
      flex-wrap: wrap;
    }
    .fr-step-pill {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.16);
      color: var(--text-soft);
      font-size: 12px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }
    .fr-exit-btn {
      padding: 6px 12px;
      font-size: 12px;
      letter-spacing: 0.3px;
    }
    .fr-cover-wrap {
      border-radius: 22px;
      overflow: hidden;
      margin-bottom: 14px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    }
    .fr-cover-wrap.fr-cover-thin .story-cover { height: 120px; }
    .fr-cover-wrap .story-cover { height: 220px; }
    @media (max-width: 380px) {
      .fr-cover-wrap .story-cover { height: 180px; }
    }
    .fr-listen-card {
      text-align: center;
      padding: 28px 18px;
    }
    .fr-listen-title {
      font-size: 20px;
      margin: 14px 0 6px;
      font-weight: 600;
    }
    .fr-listen-sub {
      color: var(--text-soft);
      font-size: 14px;
      margin-bottom: 18px;
    }
    .fr-listen-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .fr-pulse {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin: 6px 0 12px;
    }
    .fr-pulse span {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.4;
      animation: fr-pulse 1.4s infinite ease-in-out;
    }
    .fr-pulse span:nth-child(2) { animation-delay: 0.2s; }
    .fr-pulse span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes fr-pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50%      { opacity: 1;   transform: scale(1.2); }
    }

    .fr-soft-card {
      text-align: center;
      padding: 24px 18px;
    }
    .fr-soft-title {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .fr-soft-msg {
      color: var(--text-soft);
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .fr-narration-list {
      padding: 16px 14px;
      max-height: 50vh;
      overflow-y: auto;
    }
    .fr-narr-row {
      padding: 10px 8px;
      border-radius: 10px;
      transition: background 0.2s;
    }
    .fr-narr-row.active {
      background: rgba(255,255,255,0.08);
    }
    .fr-narr-row .de { font-size: 16px; line-height: 1.5; }
    .fr-narr-row .en { font-size: 13px; color: var(--text-soft); margin-top: 4px; }
    .fr-eng-toggle {
      flex-shrink: 0;
    }

    .fr-section-intro {
      font-size: 14px;
      color: var(--text-soft);
      margin-bottom: 12px;
      text-align: center;
    }
    .fr-rule-card {
      padding: 18px;
      margin-bottom: 12px;
    }
    .fr-rule-name {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .fr-rule-expl {
      font-size: 14px;
      color: var(--text-soft);
      line-height: 1.5;
      margin-bottom: 12px;
    }
    .fr-rule-examples { display: flex; flex-direction: column; gap: 8px; }
    .fr-rule-ex {
      padding: 10px 12px;
      background: rgba(255,255,255,0.04);
      border-radius: 10px;
      border-left: 3px solid var(--accent);
    }
    .fr-rule-ex .ex-de { font-size: 15px; }
    .fr-rule-ex .ex-en { font-size: 13px; color: var(--text-soft); margin-top: 3px; }

    .fr-progress-line {
      text-align: center;
      font-size: 13px;
      color: var(--text-soft);
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }
    .fr-sentence-card, .fr-vocab-card {
      padding: 22px 18px;
      text-align: center;
      position: relative;
    }
    .fr-sentence-de {
      font-size: 22px;
      line-height: 1.45;
      margin-bottom: 12px;
    }
    .fr-sentence-en {
      font-size: 15px;
      color: var(--text-soft);
      line-height: 1.5;
      margin-bottom: 14px;
    }
    .fr-vocab-mark {
      cursor: pointer;
      border-bottom: 2px dotted var(--accent);
      padding-bottom: 1px;
    }
    .fr-vocab-mark:hover { background: rgba(255,255,255,0.06); }
    .fr-vocab-popover {
      position: absolute;
      z-index: 50;
      padding: 10px 14px;
      background: rgba(20,20,30,0.95);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      max-width: 240px;
    }
    .fr-vp-word { font-weight: 600; font-size: 14px; margin-bottom: 2px; }
    .fr-vp-trans { color: var(--text-soft); font-size: 13px; }

    .fr-vocab-pos { margin-bottom: 10px; }
    .fr-vocab-word { font-size: 30px; margin-bottom: 8px; }
    .fr-vocab-en { font-size: 16px; color: var(--text-soft); margin-bottom: 14px; }
    .fr-vocab-context {
      margin-top: 14px; font-size: 15px; line-height: 1.5;
      padding: 10px 12px; background: rgba(255,255,255,0.04);
      border-radius: 10px;
    }
    .fr-vocab-context-en {
      font-size: 13px; color: var(--text-soft); margin-top: 4px;
      padding: 0 12px;
    }

    .fr-nav-row {
      display: flex; gap: 10px; margin-top: 12px;
    }
    .fr-nav-row .ghost-btn { flex: 1; }
    .fr-nav-row .gradient-btn { flex: 2; }

    .fr-celebrate {
      text-align: center; padding: 32px 20px;
    }
    .fr-celebrate-icon {
      font-size: 56px; color: var(--accent);
      margin-bottom: 12px;
    }
    .fr-celebrate-title {
      font-size: 24px; font-weight: 700; margin-bottom: 10px;
    }
    .fr-celebrate-msg {
      color: var(--text-soft); font-size: 14px; line-height: 1.5;
      margin-bottom: 22px;
    }

    /* ============================================================
       DRILL FLOW — Stage D styles. Six-dot progress track, shared
       drill containers, sentence-assembly tiles, drill-complete card.
       ============================================================ */
    .drill-track {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin: 0 0 18px;
    }
    .drill-dot {
      flex: 1;
      max-width: 60px;
      text-align: center;
      padding: 6px 0;
      border-radius: 8px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      font-size: 12px;
      color: var(--text-soft);
      letter-spacing: 0.5px;
    }
    .drill-dot.current {

    /* ============================================================
       MIGRATION FRAMEWORK
       Even with only v1 today, this is wired up so future versions
       just need entries like `migrations[2] = (data) => { ... }`.
       ============================================================ */
    const migrations = {
      // v1 → v2: split `attempts`/`correct` so tier-unlock gating uses
      // first-attempt counters only (prevents grinding the same wrong test
      // until memorized). Historical entries are assumed to have been first
      // attempts since chunk-2 had no retry tracking.
      2: (data) => {
        if (data.testAttempts) {
          for (const k in data.testAttempts) {
            const r = data.testAttempts[k];
            if (r.firstAttempts === undefined)        r.firstAttempts = r.attempts || 0;
            if (r.firstAttemptsCorrect === undefined) r.firstAttemptsCorrect = r.correct || 0;
          }
        }
        return data;
      },
      // v2 → v3: introduce a multi-user model. The previous root-level
      // per-user fields (cards, testAttempts, sessions, settings,
      // languages, activeLanguageId) collapse under `users.luka` so the
      // existing learner keeps every shred of progress. Sofia is seeded
      // empty for the family iPad use case. After this migration, code
      // accesses per-user fields through a Proxy that routes to the
      // active user automatically.
      3: (data) => {
        const luka = {
          id: 'luka', name: 'Luka', role: 'admin', password: '1234',
          activeLanguageId: data.activeLanguageId || 'de',
          languages:    data.languages    || {},
          cards:        data.cards        || {},
          testAttempts: data.testAttempts || {},
          sessions:     data.sessions     || [],
          settings:     data.settings     || { theme: 'dark', newPerDay: 10, dailyCap: 30, cardMode: 'type', ttsRate: 0.9 }
        };
        const sofia = {
          id: 'sofia', name: 'Sofia', role: 'user', password: '',
          activeLanguageId: 'de',
          languages: {},
          cards: {}, testAttempts: {}, sessions: [],
          settings: { theme: 'dark', newPerDay: 10, dailyCap: 30, cardMode: 'type', ttsRate: 0.9 }
        };
        const out = {
          schemaVersion: 3,
          activeUserId: 'luka',
          users: { luka, sofia },
          // Global content stays at root.
          storiesData: data.storiesData || {},
          testPacks:   data.testPacks   || {},
          lastBackup:  data.lastBackup  ?? null
        };
        return out;
      },
    };

    function migrate(data) {
      while (data.schemaVersion < CURRENT_SCHEMA) {
        const next = data.schemaVersion + 1;
        const fn = migrations[next];
        if (!fn) {
          // No migration registered — bump version anyway to avoid lockup.
          data.schemaVersion = next;
          continue;
        }
        data = fn(data);
        data.schemaVersion = next;
      }
      return data;
    }

    /* ============================================================
       STORAGE
       ============================================================ */
    /* ------------------------------------------------------------
       Multi-user state (chunk 3a-patch / pre-3b).
       Per-user fields live under users[uid]; global content (story
       data, test packs, last backup) lives at root. A Proxy routes
       reads/writes of per-user fields to the active user, so existing
       code that says `state.cards`, `state.languages`, etc. keeps
       working without a refactor.
       ------------------------------------------------------------ */
    const PER_USER_FIELDS = new Set(['cards', 'testAttempts', 'sessions', 'settings', 'languages', 'activeLanguageId', 'libraryDrilledIn']);

    function makeDefaultUser(id, name, role, password) {
      return {
        id, name, role, password,
        activeLanguageId: 'de',
        libraryDrilledIn: null,    // null = top-level language picker; langId = drilled into that book
        languages: {},
        cards: {},
        testAttempts: {},
        sessions: [],
        settings: { theme: 'dark', newPerDay: 10, dailyCap: 30, cardMode: 'type', ttsRate: 0.9 }
      };
    }

    function defaultState() {
      return {
        schemaVersion: CURRENT_SCHEMA,
        activeUserId: 'luka',
        users: {
          luka:  makeDefaultUser('luka',  'Luka',  'admin', '1234'),
          sofia: makeDefaultUser('sofia', 'Sofia', 'user',  '')
        },
        storiesData: {},
        testPacks: {},
        lastBackup: null
      };
    }

    function getActiveUser(s) {
      const raw = s || rawState;
      return raw && raw.users ? raw.users[raw.activeUserId] : null;
    }

    function makeStateProxy(rawTarget) {
      const FALLBACK = { cards: {}, testAttempts: {}, sessions: [], settings: {}, languages: {}, activeLanguageId: null };
      return new Proxy(rawTarget, {
        get(target, prop) {
          if (PER_USER_FIELDS.has(prop)) {
            const user = target.users && target.users[target.activeUserId];
            if (!user) return FALLBACK[prop];
            return user[prop];
          }
          return target[prop];
        },
        set(target, prop, value) {
          if (PER_USER_FIELDS.has(prop)) {
            const user = target.users && target.users[target.activeUserId];
            if (user) user[prop] = value;
            return true;
          }
          target[prop] = value;
          return true;
        },
        has(target, prop) {
          if (PER_USER_FIELDS.has(prop)) return true;
          return prop in target;
        }
      });
    }

    function loadState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      try {
        let data = JSON.parse(raw);
        if (typeof data !== 'object' || data === null) return defaultState();
        if (typeof data.schemaVersion !== 'number') data.schemaVersion = 0;
        return migrate(data);
      } catch {
        return defaultState();
      }
    }

    function saveState() {
      try {
        // Persist the underlying rawState (the Proxy is a pass-through
        // for serialization, but referencing rawState directly is more
        // explicit and avoids surprises if Proxy traps change later).
        const raw = (typeof rawState !== 'undefined' ? rawState : state);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(raw));
      } catch (e) {
        console.warn('saveState failed', e);
      }
    }

        if (!patch) return;

    /* ------------------------------------------------------------
       ensureCards — append-only seeding across every user. Each user
       gets their own card record per (langId, storyId, sentenceIdx);
       existing cards are never modified.
       ------------------------------------------------------------ */
    function ensureCards(s) {
      const newCard = () => ({
        ef: 2.5, interval: 0, reps: 0, nextReview: null,
        totalReviews: 0, correctReviews: 0, lastReviewed: null
      });
      for (const uid in s.users) {
        const user = s.users[uid];
        user.cards = user.cards || {};
        const langs = user.languages || {};
        for (const langId in langs) {
          const lang = langs[langId];
          if (!Array.isArray(lang.stories)) continue;

          for (const storyId of lang.stories) {
            const storyKey = `${langId}::${storyId}`;
            const story = s.storiesData[storyKey];
            if (!story) continue;

            // Sentence cards: id = `${langId}::${storyId}::${idx}`
            if (Array.isArray(story.sentences)) {
              story.sentences.forEach((_, idx) => {
                const cardId = `${langId}::${storyId}::${idx}`;
                if (!user.cards[cardId]) user.cards[cardId] = newCard();
              });
            }
            // Vocabulary cards (chunk-3a-patch): separate namespace so
            // they're tracked independently from sentence cards.
            // id = `${langId}::${storyId}::vocab::${idx}`
            if (Array.isArray(story.vocabulary)) {
              story.vocabulary.forEach((_, idx) => {
                const cardId = `${langId}::${storyId}::vocab::${idx}`;
                if (!user.cards[cardId]) user.cards[cardId] = newCard();
              });
            }
          }
        }
      }
    }

    /* ------------------------------------------------------------
       ensureStoryProgress — every (user, lang, story) gets a progress
       record describing which phase the learner is in (first-read,
       drill-flow, free-practice) and which substep within first-read.
       Stories with prior card activity are auto-promoted past first-read
       so existing users aren't pushed back through the 6-step flow.
       ------------------------------------------------------------ */
    function defaultStoryProgress() {
      return {
        phase: 'first-read',     // 'first-read' | 'drill-flow' | 'free-practice'
        firstReadStep: 1,        // 1..6
        step1Phase: 'intro',     // 'intro' | 'narration' | 'done'
        sentenceIdx: 0,          // step 3 cursor
        vocabIdx: 0,             // step 4 cursor
        firstReadDone: false,
        showEnglish: false,      // step 1 narration toggle
        // Stage D — drill flow. currentDrill is the active drill (1..6);
        // drillsDone[N] flips true when drill N is satisfied. Per-drill
        // ephemeral state (queue index, retry buckets) lives here so a
        // learner can resume mid-drill across sessions.
        currentDrill: 1,
        drillsDone: { 1: false, 2: false, 3: false, 4: false, 5: false, 6: false },
        drill2: { idx: 0, queue: null, streak: {} },        // EN→IT typed
        drill3: { idx: 0, queue: null, retried: {} },        // sentence assembly
        drill4: { idx: 0, queue: null, doneSet: {} },        // dictation
        drill5: { idx: 0, queue: null, results: {} },        // rule spotting
        unlocked: false,                                      // drill 6 → next story unlock
        // Stage E — free practice. fpMode is the active sub-screen
        // inside the free-practice phase; default 'hub' = tile grid.
        fpMode: 'hub'                                         // 'hub' | 'listen' | 'assembly' | 'dictation'
      };
    }
    function ensureStoryProgress(s) {
      for (const uid in s.users) {
        const user = s.users[uid];
        const langs = user.languages || {};
        for (const langId in langs) {
          const lang = langs[langId];
          if (!Array.isArray(lang.stories)) continue;
          lang.storyProgress = lang.storyProgress || {};
          for (const storyId of lang.stories) {
            if (lang.storyProgress[storyId]) continue;
            const prog = defaultStoryProgress();
            // If any sentence/vocab card for this story already has reps>0,
            // the user has already played with it — skip first-read.
            const prefix = `${langId}::${storyId}::`;
            let touched = false;
            for (const cardId in user.cards) {
              if (!cardId.startsWith(prefix)) continue;
              const c = user.cards[cardId];
              if (c && c.reps > 0) { touched = true; break; }
            }
            if (touched) {
              prog.phase = 'drill-flow';
              prog.firstReadDone = true;
              prog.firstReadStep = 6;
              prog.step1Phase = 'done';
            }
            lang.storyProgress[storyId] = prog;
          }
          // Backfill drill fields for stories that pre-date Stage D so
          // existing localStorage upgrades cleanly without losing first-read
          // progress.
          for (const storyId of lang.stories) {
            const p = lang.storyProgress[storyId];
            if (!p) continue;
            if (p.currentDrill === undefined) p.currentDrill = 1;
            if (!p.drillsDone) p.drillsDone = { 1: false, 2: false, 3: false, 4: false, 5: false, 6: false };
            if (!p.drill2) p.drill2 = { idx: 0, queue: null, streak: {} };
            if (!p.drill3) p.drill3 = { idx: 0, queue: null, retried: {} };
            if (!p.drill4) p.drill4 = { idx: 0, queue: null, doneSet: {} };
            if (!p.drill5) p.drill5 = { idx: 0, queue: null, results: {} };
            if (p.unlocked === undefined) p.unlocked = false;
            if (!p.fpMode) p.fpMode = 'hub';
          }
        }
      }
    }

    /* ============================================================
       STATS HELPERS
       ============================================================ */
    function todayKey() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${dd}`;
    }

    function getStreak(s) {
      if (!Array.isArray(s.sessions) || s.sessions.length === 0) return 0;
      const dates = new Set(s.sessions.map(x => x.date));
      let streak = 0;
      const cur = new Date();
      // Walk back day-by-day until we hit a missing day.
      while (true) {
        const y = cur.getFullYear();
        const m = String(cur.getMonth() + 1).padStart(2, '0');
        const dd = String(cur.getDate()).padStart(2, '0');
        const key = `${y}-${m}-${dd}`;
        if (dates.has(key)) {
          streak++;
          cur.setDate(cur.getDate() - 1);
        } else {
          break;
        }
      }
      return streak;
    }

    /**
     * Walks all cards belonging to a (langId, optional storyId) prefix.
     * Returns counts: { new, due, mastered, total }.
     */
    function getStats(s, langId, storyId) {
      const now = Date.now();
      const prefix = storyId ? `${langId}::${storyId}::` : `${langId}::`;
      let n = 0, due = 0, mastered = 0, total = 0;
      for (const cardId in s.cards) {
        if (!cardId.startsWith(prefix)) continue;
        const c = s.cards[cardId];
        total++;
        if (c.reps === 0 && c.nextReview === null) {
          n++;
        } else if (c.nextReview !== null && c.nextReview <= now) {
          due++;
        }
        if (c.interval >= MASTERED_INTERVAL_DAYS) mastered++;
      }
      return { new: n, due, mastered, total };
    }

    /* ============================================================
       CHUNK 2 HELPERS — Levenshtein, normalize, SM-2, queue build,
       tier unlock, session activity logging.
       ============================================================ */
    function levenshtein(a, b) {
      const m = a.length, n = b.length;
      if (!m) return n; if (!n) return m;
      const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
      for (let i = 0; i <= m; i++) dp[i][0] = i;
      for (let j = 0; j <= n; j++) dp[0][j] = j;
      for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
        dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
      return dp[m][n];
    }

    function normalize(s) {
      return s.trim().toLowerCase().replace(/[.,!?;:'"]/g, '').replace(/\s+/g, ' ');
    }

    // SM-2: mutates `card` in place. quality is the user-facing 1..4.
    function sm2(card, quality) {
      const q = [0, 2, 3, 4, 5][quality];
      card.totalReviews++;
      card.lastReviewed = Date.now();
      if (q >= 3) {
        card.correctReviews++;
        if (card.reps === 0) card.interval = 1;
        else if (card.reps === 1) card.interval = 6;
        else card.interval = Math.round(card.interval * card.ef);
        card.reps++;
      } else {
        card.reps = 0;
        card.interval = 1;
      }
      card.ef = Math.max(1.3, card.ef + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02)));
      card.nextReview = Date.now() + card.interval * 86400000;
    }

    // Build a study queue: due cards + new cards (capped), then shuffled.
    // Build the SRS queue for a story. `source` selects which card
    // namespace to study: 'sentences' (sentence cards, the default
    // since chunk 1) or 'vocabulary' (word cards, chunk-3a-patch).
    // The two namespaces are independent — separate due/new pools.
    function buildCardQueue(languageId, storyId, source) {
      source = source || 'sentences';
      const storyPrefix = `${languageId}::${storyId}::`;
      const vocabMarker = '::vocab::';
      const allCards = Object.entries(state.cards)
        .filter(([k]) => {
          if (!k.startsWith(storyPrefix)) return false;
          const isVocab = k.includes(vocabMarker);
          return source === 'vocabulary' ? isVocab : !isVocab;
        })
        .map(([id, card]) => ({ id, ...card }));
      const now = Date.now();
      const due = allCards.filter(c => c.reps > 0 && c.nextReview !== null && c.nextReview <= now);
      const newC = allCards.filter(c => c.reps === 0 && c.nextReview === null)
        .slice(0, state.settings.newPerDay);
      let queue = [...due, ...newC].slice(0, state.settings.dailyCap);
      for (let i = queue.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [queue[i], queue[j]] = [queue[j], queue[i]];
      }
      return queue;
    }

    // Resolve a card's underlying content (sentence or vocab item)
    // from its id. Returns { type: 'sentence' | 'vocab', item, idx }.
    function getCardContent(cardId, story) {
      const parts = cardId.split('::');
      if (parts[2] === 'vocab') {
        const idx = parseInt(parts[3], 10);
