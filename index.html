        return { type: 'vocab', item: (story.vocabulary || [])[idx], idx };
      }
      const idx = parseInt(parts[2], 10);
      return { type: 'sentence', item: (story.sentences || [])[idx], idx };
    }

    // Tier 1 always unlocked. Tier N (N>1) unlocks when prev tier has
    // ≥20 FIRST-ATTEMPT answers at ≥80% first-attempt accuracy. Retry
    // attempts inflate lifetime stats (shown in the UI) but are excluded
    // here to prevent grinding the same wrong test until memorized.
    function tierUnlocked(tier, languageId, storyId) {
      if (tier === 1) return true;
      const prevTier = tier - 1;
      const prefix = `${languageId}::${storyId}::tier${prevTier}::`;
      const records = Object.entries(state.testAttempts)
        .filter(([k]) => k.startsWith(prefix))
        .map(([, v]) => v);
      const totalFirst   = records.reduce((a, x) => a + (x.firstAttempts        || 0), 0);
      const correctFirst = records.reduce((a, x) => a + (x.firstAttemptsCorrect || 0), 0);
      if (totalFirst < 20) return false;
      return (correctFirst / totalFirst) >= 0.8;
    }

    // Append (or update) today's session record so the streak counter
    // ticks and session-correctness stats accumulate.
    function logActivity(langId, storyId, correct) {
      const today = todayKey();
      let s = state.sessions.find(x =>
        x.date === today && x.languageId === langId && x.storyId === storyId);
      if (!s) {
        s = { date: today, count: 0, correct: 0, languageId: langId, storyId: storyId };
        state.sessions.push(s);
      }
      s.count++;
      if (correct) s.correct++;
    }

    // Settings live per-user in v3. Backfill defaults for every user.
    function ensureSettings(s) {
      for (const uid in (s.users || {})) {
        const user = s.users[uid];
        user.settings = user.settings || {};
        if (user.settings.newPerDay === undefined) user.settings.newPerDay = 10;
        if (user.settings.dailyCap  === undefined) user.settings.dailyCap  = 30;
        if (!user.settings.cardMode) user.settings.cardMode = 'type';
        if (!user.settings.cardSource) user.settings.cardSource = 'sentences';
        if (user.settings.ttsRate   === undefined) user.settings.ttsRate   = 0.9;
        if (user.settings.theme     === undefined) user.settings.theme     = 'dark';
        if (user.settings.bgImage   === undefined) user.settings.bgImage   = null; // data URL or null
        if (user.settings.bgOverlay === undefined) user.settings.bgOverlay = 0.5;  // 0..0.85
      }
    }

    // Chunk 3a runtime defaults — global fields. Idempotent.
    function ensureChunk3a(s) {
      if (!s.testPacks) s.testPacks = {};
      if (s.lastBackup === undefined) s.lastBackup = null;
    }

    // testAttempts is per-user in v3. Walk every user and rewrite any
    // remaining 4-part keys to 5-part `lang::story::tierN::builtin::idx`.
    function migrateTestAttempts(s) {
      for (const uid in (s.users || {})) {
        const user = s.users[uid];
        if (!user.testAttempts) { user.testAttempts = {}; continue; }
        let migrated = 0;
        const updated = {};
        for (const [key, val] of Object.entries(user.testAttempts)) {
          const parts = key.split('::');
          if (parts.length === 4) {
            const [lang, story, tier, idx] = parts;
            updated[`${lang}::${story}::${tier}::builtin::${idx}`] = val;
            migrated++;
          } else {
            updated[key] = val;
          }
        }
        if (migrated > 0) user.testAttempts = updated;
      }
    }

    /* ============================================================
       CHUNK 3A — Toasts, file I/O, validators, backup, modals.
       ============================================================ */

    // Toast stack — auto-dismiss after 3s, slide-down exit animation.
    function showToast(message, variant = 'info') {
      const stack = document.getElementById('toast-stack');
      if (!stack) return;
      const t = document.createElement('div');
      t.className = `toast ${variant}`;
      t.textContent = message;
      stack.appendChild(t);
      setTimeout(() => {
        t.classList.add('exiting');
        setTimeout(() => t.remove(), 250);
      }, 3000);
    }

    // Open a native file picker, parse JSON, hand off to callback.
    function importJSONFile(callback) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json,application/json';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const data = JSON.parse(reader.result);
            callback(data);
          } catch {
            showToast('Invalid JSON file', 'error');
          }
        };
        reader.onerror = () => showToast('Could not read file', 'error');
        reader.readAsText(file);
      };
      input.click();
    }

    /* Multi-file picker — accepts a JSON file and (optionally) an image.
       The user can select both at once (Cmd/Shift-click in a file picker)
       to attach a cover image when adding a language or story. Callback
       gets (json, imageDataUrl). Either argument may be null. */
    function importJSONWithImage(callback) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json,application/json,image/*';
      input.multiple = true;
      input.onchange = (e) => {
        const files = Array.from(e.target.files || []);
        if (files.length === 0) return;
        let json = null;
        let imageRaw = null;
        let pending = files.length;
        const finish = async () => {
          if (--pending > 0) return;
          let imageOut = null;
          if (imageRaw) {
            try { imageOut = await downsizeImage(imageRaw, 1280, 720, 0.75); }
            catch { imageOut = imageRaw; }
          }
          callback(json, imageOut);
        };
        files.forEach(file => {
          const isJson = file.type === 'application/json' || /\.json$/i.test(file.name);
          const isImage = file.type.startsWith('image/');
          if (!isJson && !isImage) { finish(); return; }
          const reader = new FileReader();
          reader.onload = () => {
            if (isJson) {
              try { json = JSON.parse(reader.result); }
              catch { showToast('Invalid JSON file', 'error'); }
            } else if (isImage) {
              imageRaw = reader.result;
            }
            finish();
          };
          reader.onerror = () => finish();
          if (isJson) reader.readAsText(file);
          else reader.readAsDataURL(file);
        });
      };
      input.click();
    }

    /* Single image picker — used when adding/changing a cover after
       the language/story is already imported. Callback gets a downsized
       JPEG data URL. */
    function importImageFile(callback) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async () => {
          try {
            const small = await downsizeImage(reader.result, 1280, 720, 0.75);
            callback(small);
          } catch {
            callback(reader.result);
          }
        };
        reader.onerror = () => showToast('Could not read image', 'error');
        reader.readAsDataURL(file);
      };
      input.click();
    }

    /* Downsize an image to fit within (maxW × maxH) and re-encode as
       JPEG at the given quality. Keeps localStorage usage manageable —
       a typical phone photo (~3 MB) shrinks to ~80 KB. */
    function downsizeImage(dataUrl, maxW, maxH, quality) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          const ratio = Math.min(maxW / width, maxH / height, 1);
          width = Math.round(width * ratio);
          height = Math.round(height * ratio);
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          try {
            resolve(canvas.toDataURL('image/jpeg', quality));
          } catch (err) {
            reject(err);
          }
        };
        img.onerror = reject;
        img.src = dataUrl;
      });
    }

    // Trigger a browser download of a string blob.
    function downloadBlob(filename, text, mime = 'application/json') {
      const blob = new Blob([text], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    /* ---------- Validators — return { valid, errors[] } ---------- */
    const HEX6 = /^#[0-9a-fA-F]{6}$/;
    const LANG_ID_RE = /^[a-z]{2,5}$/;
    // Accept both legacy ids (`story-1`, `story-foo`) and the new spec
    // shape (`it-a1-s01`, `de-a1-s03`, etc). Any kebab-case id starting
    // with a letter is allowed.
    const STORY_ID_RE = /^[a-z][a-z0-9-]+$/;
    const PACK_ID_RE = /^[a-z0-9-]+$/;
    const THEME_FIELDS = ['gradient1', 'gradient2', 'gradient3', 'bgFrom', 'bgVia', 'bgTo', 'accent'];

    function validateLanguage(json) {
      const errors = [];
      if (!json || typeof json !== 'object') errors.push('Not a JSON object');
      else {
        if (json.schemaVersion !== 1) errors.push('schemaVersion must be 1');
        if (!LANG_ID_RE.test(json.id || '')) errors.push('id must match /^[a-z]{2,5}$/');
        if (state.languages[json.id]) errors.push(`Language "${json.id}" already exists`);
        if (!json.name || typeof json.name !== 'string') errors.push('name required');
        if (!json.flag || typeof json.flag !== 'string') errors.push('flag required');
        if (!json.ttsLang || typeof json.ttsLang !== 'string') errors.push('ttsLang required');
        if (!json.theme || typeof json.theme !== 'object') errors.push('theme object required');
        else {
          for (const f of THEME_FIELDS) {
            if (!HEX6.test(json.theme[f] || '')) errors.push(`theme.${f} must be a 6-digit hex color`);
          }
        }
      }
      return { valid: errors.length === 0, errors };
    }

    function validateStory(json) {
      const errors = [];
      if (!json || typeof json !== 'object') errors.push('Not a JSON object');
      else {
        if (json.schemaVersion !== 1) errors.push('schemaVersion must be 1');
        if (!json.languageId || !state.languages[json.languageId])
          errors.push(`languageId "${json.languageId}" not installed`);
        if (!STORY_ID_RE.test(json.id || '')) errors.push('id must match /^story-[a-z0-9-]+$/');
        if (!json.title || typeof json.title !== 'string') errors.push('title required');
        if (!json.level || typeof json.level !== 'string') errors.push('level required');
        if (!Array.isArray(json.sentences) || json.sentences.length === 0)
          errors.push('sentences[] non-empty required');
        else json.sentences.forEach((s, i) => {
          if (!s || typeof s.de !== 'string' || typeof s.en !== 'string')
            errors.push(`sentences[${i}] needs de + en strings`);
        });
        if (!Array.isArray(json.grammarRules)) errors.push('grammarRules[] required');
        else json.grammarRules.forEach((r, i) => {
          if (!r.name) errors.push(`grammarRules[${i}].name required`);
          if (![1, 2, 3].includes(r.tier)) errors.push(`grammarRules[${i}].tier must be 1, 2, or 3`);
          if (!r.desc) errors.push(`grammarRules[${i}].desc required`);
          // Optional Rules-tab fields (chunk-3a-patch). Validate shape if
          // present; missing is fine — old story JSONs stay valid.
          if (r.longExplanation !== undefined && typeof r.longExplanation !== 'string')
            errors.push(`grammarRules[${i}].longExplanation must be a string`);
          if (r.examples !== undefined) {
            if (!Array.isArray(r.examples)) errors.push(`grammarRules[${i}].examples must be an array`);
            else r.examples.forEach((ex, j) => {
              if (!ex || typeof ex.de !== 'string' || typeof ex.en !== 'string')
                errors.push(`grammarRules[${i}].examples[${j}] needs de + en strings`);
            });
          }
          if (r.tips !== undefined && !Array.isArray(r.tips))
            errors.push(`grammarRules[${i}].tips must be an array of strings`);
          // Optional `table` for paradigm-friendly rules. Shape:
          // { title?: str, headers: [str], rows: [[str]], note?: str }.
          if (r.table !== undefined) {
            const t = r.table;
            if (!t || typeof t !== 'object') errors.push(`grammarRules[${i}].table must be an object`);
            else {
              if (!Array.isArray(t.headers)) errors.push(`grammarRules[${i}].table.headers must be an array`);
              if (!Array.isArray(t.rows)) errors.push(`grammarRules[${i}].table.rows must be a 2D array`);
              else t.rows.forEach((row, k) => {
                if (!Array.isArray(row)) errors.push(`grammarRules[${i}].table.rows[${k}] must be an array`);
              });
            }
          }
        });
        // Optional vocabulary[] — author-curated word list. Each item
        // needs `de` + `en`; everything else is optional metadata.
        if (json.vocabulary !== undefined) {
          if (!Array.isArray(json.vocabulary)) errors.push('vocabulary must be an array');
          else json.vocabulary.forEach((v, i) => {
            if (!v || typeof v.de !== 'string' || typeof v.en !== 'string')
              errors.push(`vocabulary[${i}] needs de + en strings`);
          });
        }
        if (!Array.isArray(json.grammarTests)) errors.push('grammarTests[] required');
        else json.grammarTests.forEach((t, i) => {
          if (![1, 2, 3].includes(t.tier)) errors.push(`grammarTests[${i}].tier must be 1, 2, or 3`);
          if (!t.rule) errors.push(`grammarTests[${i}].rule required`);
          if (!t.en || !t.de) errors.push(`grammarTests[${i}] needs en + de`);
        });
      }
      return { valid: errors.length === 0, errors };
    }

    function validateTestPack(json) {
      const errors = [];
      const warnings = [];
      if (!json || typeof json !== 'object') errors.push('Not a JSON object');
      else {
        if (json.schemaVersion !== 1) errors.push('schemaVersion must be 1');
        if (json.type !== 'test-pack') errors.push('type must be "test-pack"');
        if (!json.languageId || !state.languages[json.languageId])
          errors.push(`languageId "${json.languageId}" not installed`);
        const story = json.languageId && json.storyId
          ? state.storiesData[`${json.languageId}::${json.storyId}`] : null;
        if (!story) errors.push(`storyId "${json.storyId}" not found under that language`);
        if (!PACK_ID_RE.test(json.id || '')) errors.push('id must match /^[a-z0-9-]+$/');
        if (json.languageId && state.testPacks[`${json.languageId}::${json.id}`])
          errors.push(`Test pack "${json.id}" already exists for this language`);
        if (!Array.isArray(json.tests) || json.tests.length === 0)
          errors.push('tests[] non-empty required');
        else json.tests.forEach((t, i) => {
          if (![1, 2, 3].includes(t.tier)) errors.push(`tests[${i}].tier must be 1, 2, or 3`);
          if (!t.rule) errors.push(`tests[${i}].rule required`);
          if (!t.en || !t.de) errors.push(`tests[${i}] needs en + de`);
        });
        // Soft-warn when rule names don't match the story's grammarRules.
        if (story && Array.isArray(json.tests)) {
          const known = new Set(story.grammarRules.map(r => r.name));
          for (const t of json.tests) {
            if (t.rule && !known.has(t.rule)) {
              warnings.push(`Rule "${t.rule}" is not in this story's grammarRules`);
              break;
            }
          }
        }
      }
      return { valid: errors.length === 0, errors, warnings };
    }

    /* ---------- Generic modal helpers ---------- */
    function closeModal() {
      document.getElementById('modal-root').innerHTML = '';
    }

    // Yes/no confirmation modal — resolves true on confirm, false on cancel.
    function confirmModal({ title, body, confirmLabel = 'Confirm', danger = false }) {
      return new Promise((resolve) => {
        const root = document.getElementById('modal-root');
        const btnClass = danger ? 'danger-btn' : 'gradient-btn';
        root.innerHTML = `
          <div class="modal-overlay" id="modal-overlay">
            <div class="glass modal">
              <div class="modal-title">${escapeHtml(title)}</div>
              <div class="modal-body"><p>${body}</p></div>
              <div class="btn-row">
                <button class="ghost-btn" id="m-cancel" style="flex:1">Cancel</button>
                <button class="${btnClass}" id="m-confirm" style="flex:1">${escapeHtml(confirmLabel)}</button>
              </div>
            </div>
          </div>`;
        const finish = (val) => { closeModal(); resolve(val); };
        document.getElementById('modal-overlay').addEventListener('click', (e) => {
          if (e.target.id === 'modal-overlay') finish(false);
        });
        document.getElementById('m-cancel').addEventListener('click', () => finish(false));
        document.getElementById('m-confirm').addEventListener('click', () => finish(true));
      });
    }

    // Text-confirmation modal — user must type `expected` to confirm.
    function textConfirmModal({ title, body, expected, confirmLabel = 'Confirm' }) {
      return new Promise((resolve) => {
        const root = document.getElementById('modal-root');
        root.innerHTML = `
          <div class="modal-overlay" id="modal-overlay">
            <div class="glass modal">
              <div class="modal-title">${escapeHtml(title)}</div>
              <div class="modal-body">
                <p>${body}</p>
                <input type="text" id="m-input" autocapitalize="characters" autocorrect="off" autocomplete="off" spellcheck="false" placeholder="${escapeHtml(expected)}">
              </div>
              <div class="btn-row">
                <button class="ghost-btn" id="m-cancel" style="flex:1">Cancel</button>
                <button class="danger-btn" id="m-confirm" style="flex:1" disabled>${escapeHtml(confirmLabel)}</button>
              </div>
            </div>
          </div>`;
        const inp = document.getElementById('m-input');
        const cBtn = document.getElementById('m-confirm');
        const finish = (val) => { closeModal(); resolve(val); };
        inp.addEventListener('input', () => {
          cBtn.disabled = inp.value.trim() !== expected;
          cBtn.style.opacity = cBtn.disabled ? '0.5' : '1';
        });
        document.getElementById('modal-overlay').addEventListener('click', (e) => {
          if (e.target.id === 'modal-overlay') finish(false);
        });
        document.getElementById('m-cancel').addEventListener('click', () => finish(false));
        cBtn.addEventListener('click', () => {
          if (!cBtn.disabled) finish(true);
        });
        try { inp.focus(); } catch {}
      });
    }

    /* ---------- Backup export / import ---------- */
    function exportBackup() {
      state.lastBackup = Date.now();
      saveState();
      const date = new Date().toISOString().slice(0, 10);
      downloadBlob(`storyglot-backup-${date}.json`, JSON.stringify(state, null, 2));
      showToast('Backup exported', 'success');
      render();
    }

    async function importBackup(data) {
      if (!data || typeof data !== 'object') {
        showToast('Backup file is not valid JSON', 'error');
        return;
      }
      const ver = typeof data.schemaVersion === 'number' ? data.schemaVersion : 0;
      if (ver > CURRENT_SCHEMA) {
        showToast('Backup is from a newer version. Please update the app.', 'error');
        return;
      }
      const ok = await confirmModal({
        title: 'Replace all data?',
        body: 'This will overwrite ALL current progress, languages, and stories with the imported backup. This cannot be undone.',
        confirmLabel: 'Replace',
        danger: true
      });
      if (!ok) return;
      try {
        let migrated = data;
        if (ver < CURRENT_SCHEMA) migrated = migrate(migrated);
        ensureBuiltins(migrated);
        ensureSettings(migrated);
        ensureChunk3a(migrated);
        migrateTestAttempts(migrated);
        ensureCards(migrated);
        replaceRawState(migrated);     // mutate in place — proxy keeps working
        cardSession = null;
        testSession = null;
        loggedIn = false;              // imported backup may have a different user; force login
        saveState();
        render();                      // shows login picker
        showToast('Backup imported', 'success');
      } catch (err) {
        console.error(err);
        showToast('Failed to import backup', 'error');
      }
    }

    function resetAllData() {
      localStorage.removeItem(STORAGE_KEY);
      const fresh = defaultState();
      ensureBuiltins(fresh);
      ensureSettings(fresh);
      ensureChunk3a(fresh);
      ensureCards(fresh);
      replaceRawState(fresh);
      cardSession = null;
      testSession = null;
      loggedIn = false;                // back to picker after reset
      saveState();
      render();
      showToast('All data reset', 'info');
    }

    /* ============================================================
       THEME — write CSS variables on :root.
       ============================================================ */
    function applyTheme(theme) {
      const r = document.documentElement.style;
      r.setProperty('--bg-from', theme.bgFrom);
      r.setProperty('--bg-via', theme.bgVia);
      r.setProperty('--bg-to', theme.bgTo);
      r.setProperty('--grad-1', theme.gradient1);
      r.setProperty('--grad-2', theme.gradient2);
      r.setProperty('--grad-3', theme.gradient3);
      r.setProperty('--accent', theme.accent);
      // Re-apply user wallpaper after theme change so the inline body bg
      // stays correct; theme palette is rendered via :root vars and the
      // body background is overridden when a custom image is set.
      applyBackgroundImage();
    }

    /* Per-user wallpaper. When a bgImage is set we override body's
       background with `linear-gradient(black-overlay), url(image)` so
       the photo stays readable; otherwise we clear the inline style and
       the theme's radial gradient takes over. Cosmic-glow blobs on
       body::before remain in either case. */
    function applyBackgroundImage() {
      const body = document.body;
      if (!body) return;
      const s = (state && state.settings) || {};
      const img = s.bgImage;
      if (img) {
        const o = (s.bgOverlay == null) ? 0.5 : Number(s.bgOverlay);
        body.style.backgroundImage = `linear-gradient(rgba(0,0,0,${o}), rgba(0,0,0,${o})), url('${img}')`;
        body.style.backgroundSize = 'cover';
        body.style.backgroundPosition = 'center center';
        body.style.backgroundAttachment = 'fixed';
        body.style.backgroundRepeat = 'no-repeat';
      } else {
        body.style.backgroundImage = '';
        body.style.backgroundSize = '';
        body.style.backgroundPosition = '';
        body.style.backgroundAttachment = '';
        body.style.backgroundRepeat = '';
      }
    }

    /* ============================================================
       TTS — Web Speech API. iOS Safari requires speak() to be
       triggered from a user gesture; we only call it from button
       and row click handlers, never on load.
       ============================================================ */
    let voices = [];
    function loadVoices() {
      try { voices = window.speechSynthesis.getVoices() || []; } catch { voices = []; }
    }
    if (typeof window !== 'undefined' && window.speechSynthesis) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function pickVoice(langCode) {
      if (!voices.length) loadVoices();
      // Prefer the user-selected voice for the active language if it
      // matches the langCode prefix (e.g., set in Settings → Voice).
      try {
        const lang = state && state.languages
          ? state.languages[state.activeLanguageId] : null;
        if (lang && lang.ttsVoice) {
          const chosen = voices.find(v => v.name === lang.ttsVoice);
          if (chosen && chosen.lang && chosen.lang.toLowerCase()
              .startsWith(langCode.split('-')[0].toLowerCase())) {
            return chosen;
          }
        }
      } catch {}
      const prefix = langCode.split('-')[0].toLowerCase();
      const matches = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith(prefix));
      if (!matches.length) return null;
      // Quality sort: macOS premium/enhanced/neural voices sound far less
      // robotic than the default. Boost names containing those markers,
      // then prefer localService voices, then exact-locale matches.
      const score = (v) => {
        let s = 0;
        const n = (v.name || '').toLowerCase();
        if (/(premium|enhanced|neural|natural|siri)/.test(n)) s += 100;
        if (v.localService) s += 10;
        if (v.lang === langCode) s += 5;
        if (v.default) s -= 1; // default is often the lowest-quality fallback
        return s;
      };
      return matches.slice().sort((a, b) => score(b) - score(a))[0];
    }

    function speak(text, langCode, opts = {}) {
      return new Promise((resolve) => {
        if (!('speechSynthesis' in window)) return resolve();
        // Substitute {{PROTAGONIST}} so TTS doesn't read the literal token
        // even if a caller passed unprocessed text.
        const spoken = substituteProtagonist(String(text || ''));
        const u = new SpeechSynthesisUtterance(spoken);
        u.lang = langCode;
        // Default rate comes from global settings; explicit opts.rate wins.
        const fallbackRate = (state && state.settings && state.settings.ttsRate) || 0.9;
        u.rate = opts.rate ?? fallbackRate;
        const v = pickVoice(langCode);
        if (v) u.voice = v;
        // iOS sometimes never fires onend — resolve on error too.
        u.onend = () => resolve();
        u.onerror = () => resolve();
        window.speechSynthesis.speak(u);
      });
    }

    function stopSpeak() {
      try { window.speechSynthesis.cancel(); } catch {}
    }

    /* ============================================================
       STATE — multi-user. `rawState` is the literal localStorage
       object; `state` is a Proxy that auto-routes per-user fields
       (cards, settings, languages, ...) to the active user.
       ============================================================ */
    let rawState = loadState();
    ensureBuiltins(rawState);
    ensureSettings(rawState);
    ensureChunk3a(rawState);
    migrateTestAttempts(rawState);
    ensureCards(rawState);
    ensureStoryProgress(rawState);
    let state = makeStateProxy(rawState);
    saveState();

    // In-memory ephemeral session state.
    let cardSession = null;
    let testSession = null;
    let swipeState  = { active: false, startX: 0, dx: 0, target: null, committed: false };

    // Login gate: every fresh page load shows the user picker (Netflix-style).
    // Once a profile is selected (and its password verified), `loggedIn`
    // flips true for the rest of the session. Switching user resets it.
    let loggedIn = false;

    // Active story tracker.
    function getActiveLang() {
      const lang = state.languages && state.languages[state.activeLanguageId];
      return lang || null;
    }
    function getActiveStoryId() { const l = getActiveLang(); return l && l.lastStoryId; }
    function getStory(langId, storyId) { return state.storiesData[`${langId}::${storyId}`]; }

    // Per-story progress accessor. Lazily seeds a default record so callers
    // can rely on every story having one. Persistence happens via the
    // surrounding state Proxy + saveState().
    function getStoryProgress(langId, storyId) {
      const lang = state.languages && state.languages[langId];
      if (!lang) return null;
      lang.storyProgress = lang.storyProgress || {};
      if (!lang.storyProgress[storyId]) {
        lang.storyProgress[storyId] = defaultStoryProgress();
      }
      return lang.storyProgress[storyId];
    }
    function setStoryProgress(langId, storyId, patch) {
      const prog = getStoryProgress(langId, storyId);
      if (!prog) return null;
      Object.assign(prog, patch);
      saveState();
      return prog;
    }

    // Initial theme — read from active user's active language.
    if (getActiveLang() && getActiveLang().theme) applyTheme(getActiveLang().theme);
    // Wallpaper applies even if no language theme is set (theme call
    // already invokes applyBackgroundImage; this covers the no-theme path).
    applyBackgroundImage();

    // Replace state in place (preserves the proxy reference so all
    // closures keep working). Used by reset / import-backup.
    function replaceRawState(newRaw) {
      Object.keys(rawState).forEach(k => delete rawState[k]);
      Object.assign(rawState, newRaw);
    }

    /* ============================================================
       PLAYBACK STATE — for the Read tab "Listen to whole story"
       ============================================================ */
    let playback = { active: false, idx: -1, version: 0 };

    function startPlayAll(sentences, langCode, opts = {}) {
      stopPlayAll();
      playback.active = true;
      playback.version++;
      const myVersion = playback.version;
      let completed = false;

      (async () => {
        for (let i = 0; i < sentences.length; i++) {
          if (!playback.active || playback.version !== myVersion) break;
          playback.idx = i;
          updatePlayHighlight();
          updatePlayButton();
          await speak(sentences[i].de, langCode);
          // Brief pause between sentences (skipped if cancelled).
          if (!playback.active || playback.version !== myVersion) break;
          await new Promise(r => setTimeout(r, 280));
        }
        if (playback.version === myVersion) {
          completed = playback.active;
          playback.active = false;
          playback.idx = -1;
          updatePlayHighlight();
          updatePlayButton();
          if (completed && typeof opts.onDone === 'function') {
            try { opts.onDone(); } catch {}
          }
        }
      })();
    }

    function stopPlayAll() {
      playback.active = false;
      playback.idx = -1;
      stopSpeak();
      updatePlayHighlight();
      updatePlayButton();
    }

    function updatePlayHighlight() {
      // Refresh the .active class on sentence spans/rows without
      // re-rendering the whole tab (avoids audio glitches).
      document.querySelectorAll('[data-sent-idx]').forEach(el => {
        const idx = Number(el.getAttribute('data-sent-idx'));
        el.classList.toggle('active', idx === playback.idx);
      });
    }

    function updatePlayButton() {
      const btn = document.getElementById('btn-play-all');
      if (!btn) return;
      btn.textContent = playback.active ? '⏹  Stop' : '🔊  Listen to whole story';
    }

    /* ============================================================
       RENDERERS — each returns an HTML string. The top-level
       render() composes them into #app. After insertion we wire
       up event handlers for that pass.
       ============================================================ */
    function escapeHtml(str) {
      // Substitute {{PROTAGONIST}} at render time per the Storyglot
      // story spec §5.1. The token is unique enough that running this
      // through every escapeHtml call is safe.
      const sub = substituteProtagonist(String(str));
      return sub
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    /* ============================================================
       STORYGLOT SPEC ADAPTERS — schema + protagonist substitution.
       Lets the app accept new-shape stories (targetText / englishGloss
       / grammar.id / tests.type) alongside the legacy de/en shape.
       Internal representation stays as the legacy shape; the new shape
       is normalized on import.
       ============================================================ */

    // Map full-name language IDs (per the new spec — "italian", "german")
    // to the 2-letter codes the app uses internally.
    const LANGUAGE_ID_ALIASES = {
      italian: 'it',
      german: 'de',
      english: 'en',
      french: 'fr',
      spanish: 'es',
      portuguese: 'pt',
      japanese: 'ja',
      chinese: 'zh',
      russian: 'ru'
    };
    function normalizeLangId(id) {
      if (!id) return id;
      const lower = String(id).toLowerCase();
      return LANGUAGE_ID_ALIASES[lower] || lower;
    }

    // Detect whether a story JSON is in the new Storyglot spec shape
    // (sentences with targetText / grammar with id+status / tests with
    // type+ruleId) versus the legacy {de,en} shape used by chunks 1–3.
    function isNewSchemaStory(json) {
      if (!json || typeof json !== 'object') return false;
      if (json.type === 'story') return true;
      if (Array.isArray(json.sentences) && json.sentences.length > 0) {
        const s0 = json.sentences[0];
        if (s0 && s0.targetText !== undefined) return true;
      }
      if (Array.isArray(json.grammar) && json.grammar.length > 0 && json.grammar[0].id !== undefined) return true;
      return false;
    }

    // Convert a new-spec story to the internal legacy shape so the
    // existing renderers, validators, and SRS pipeline work unchanged.
    function normalizeStoryShape(json) {
      if (!isNewSchemaStory(json)) return json;
      const sentences = (json.sentences || []).map(s => ({
        de: s.targetText || '',
        en: s.englishGloss || '',
        note: s.note || null
      }));
      const vocabulary = (json.vocabulary || []).map(v => ({
        de: v.word,
        en: v.translation,
        pos: v.pos || null,
        gender: v.gender || null,
        plural: v.plural || null,
        note: v.note || null
      }));
      // The new schema doesn't carry per-rule tier; use status:'new' →
      // tier 1 (introduced in this story) and status:'supporting' →
      // tier 2 (recycled). Preserve the rule id so tests can reference
      // it without ambiguity even if rule names collide.
      const grammarRules = (json.grammar || []).map(g => ({
        name: g.name || g.id || 'Untitled rule',
        tier: g.status === 'new' ? 1 : 2,
        desc: g.explanation || '',
        longExplanation: g.longExplanation || g.explanation || '',
        // Optional richer fields — pass through if the source carries them
        // so the renderRuleCard surface (used by Rules tab + first-read +
        // drill 5 review) can show examples, tips, and paradigm tables.
        examples: Array.isArray(g.examples) ? g.examples : null,
        tips: Array.isArray(g.tips) ? g.tips : null,
        table: g.table || null,
        formula: g.formula || null,
        _id: g.id || null,
        _status: g.status || null
      }));
      const ruleNameById = {};
      (json.grammar || []).forEach(g => { if (g.id) ruleNameById[g.id] = g.name; });
      const grammarTests = (json.tests || []).map(t => ({
        tier: t.tier,
        rule: ruleNameById[t.ruleId] || t.ruleId || '',
        en: t.prompt || '',
        de: t.answer || '',
        trap: t.note || null,
        _type: t.type || 'translate-en-to-it',
        _options: Array.isArray(t.options) ? t.options : null,
        _ruleId: t.ruleId || null
      }));
      return {
        schemaVersion: 1,
        languageId: normalizeLangId(json.languageId),
        id: json.id,
        title: json.title || '',
        level: json.level || 'A1',
        order: json.order || 1,
        synopsis: json.synopsis || null,
        _atmosphereIntro: json.atmosphere_intro || null,
        _coverPrompt: json.cover_image_prompt || null,
        sentences,
        vocabulary,
        grammarRules,
        grammarTests
      };
    }

    // Resolve the active protagonist name. Falls back to the language's
    // configured default, then to a hard fallback ('Bianca' for it,
    // empty for others — German story uses no token so it doesn't matter).
    function getActiveProtagonistName() {
      try {
        const lang = state && state.languages ? state.languages[state.activeLanguageId] : null;
        if (lang && lang.protagonistName) return lang.protagonistName;
        if (lang && lang.defaultProtagonist) return lang.defaultProtagonist;
        if (lang && lang.id === 'it') return 'Bianca';
      } catch {}
      return '';
    }

    // Active language's short code, uppercased. Used as the speak-button
    // label (e.g. "🔊 IT") so the UI matches whichever language is loaded.
    function speakLabelForActive() {
      const l = (state && state.languages) ? state.languages[state.activeLanguageId] : null;
      const id = l && l.id ? String(l.id) : '';
      return id ? id.toUpperCase() : 'TARGET';
    }

    // Active language's display name, lower-cased for sentence-fit copy
    // (e.g. "Type your italian word..."). Falls back to "target".
    function targetLangNameLower() {
      const l = (state && state.languages) ? state.languages[state.activeLanguageId] : null;
      return (l && l.name) ? String(l.name).toLowerCase() : 'target';
    }

    // Replace {{PROTAGONIST}} occurrences in a string with the chosen
    // name. Cheap; called from escapeHtml so it covers all rendered text.
    function substituteProtagonist(text) {
      if (!text || text.indexOf('{{PROTAGONIST}}') < 0) return text;
      const name = getActiveProtagonistName();
      if (!name) return text;          // leave the token literal so it's visible/debuggable
      return text.split('{{PROTAGONIST}}').join(name);
    }

    function renderHeader() {
      const lang = getActiveLang();
      return `
        <div class="app-header">
          <div class="app-logo">
            <span class="gradient-text">STORYGLOT</span>
            <span style="color: var(--accent); margin-left: 4px;">✦</span>
          </div>
          <button class="lang-pill" id="btn-lang">
            <span class="flag">${lang.flag}</span>
            <span>${escapeHtml(lang.name).toUpperCase()}</span>
          </button>
        </div>
      `;
    }

    function renderStats() {
      const langId = state.activeLanguageId;
      const s = getStats(state, langId);
      const streak = getStreak(state);
      const pill = (label, val) => `
        <div class="stat-pill">
          <div class="label">${label}</div>
          <div class="value gradient-text">${val}</div>
        </div>`;
      return `
        <div class="stats">
          ${pill('Streak 🔥', streak)}
          ${pill('New', s.new)}
          ${pill('Due', s.due)}
          ${pill('Mastered', s.mastered)}
        </div>
      `;
    }

    function renderTabBar() {
      const lang = getActiveLang();
      const tabs = [
        { id: 'library',  label: 'Library',  icon: '📚' },
        { id: 'read',     label: 'Read',     icon: '📖' },
        { id: 'rules',    label: 'Rules',    icon: '📋' },
        { id: 'cards',    label: 'Cards',    icon: '🎴' },
        { id: 'test',     label: 'Test',     icon: '🎯' },
        { id: 'settings', label: 'Settings', icon: '⚙️' }
      ];
      return `
        <div class="tab-cards">
          ${tabs.map(t => `
            <button class="tab-card ${lang.lastTab === t.id ? 'active' : ''}" data-tab="${t.id}">
              <span class="tab-icon">${t.icon}</span>
              <span class="tab-label">${t.label}</span>
            </button>
          `).join('')}
        </div>
      `;
    }

    function renderLibrary() {
      // Stage B: Library has two modes — top-level (one card per
      // language journey) or drilled into a single language (story tiles).
      const drilledLangId = state.libraryDrilledIn;
      if (drilledLangId && state.languages[drilledLangId]) {
        return renderLibraryDrilldown(drilledLangId);
      }
      return renderLibraryTop();
    }

    /* Library top-level — one card per language registered for this user.
       Tapping a card switches active language and drills into it. */
    function renderLibraryTop() {
      const langs = Object.values(state.languages);
      if (langs.length === 0) {
        return `<div class="glass empty-state">
          <div class="em-icon">📚</div>
          No languages installed yet.
        </div>`;
      }
      const cards = langs.map(l => renderJourneyCard(l)).join('');
      const reviewBtn = `
        <button class="global-review" data-global-review="1">
          🔁  Review · cards due across all stories
        </button>
      `;
      const progress = renderProgressSection();
      return `<div class="journey-grid">${cards}</div>${reviewBtn}${progress}`;
    }

    function renderJourneyCard(l) {
      const uploaded = l.coverImage || null;
      const svgArt = !uploaded ? getDefaultCoverSvg(l.id) : null;
      const coverStyle = uploaded ? `background-image: url('${escapeHtml(uploaded)}');` : '';
      const coverArt = !uploaded && svgArt
        ? `<div class="jc-cover">${svgArt}</div>`
        : !uploaded
          ? `<div class="jc-cover" style="background: linear-gradient(135deg, var(--grad-1), var(--grad-2) 55%, var(--grad-3));"></div>`
          : `<div class="jc-cover" style="${coverStyle}"></div>`;

      // Aggregate progress across this language's stories.
      const stats = getStats(state, l.id);
      const masteredPct = stats.total > 0 ? Math.round((stats.mastered / stats.total) * 100) : 0;
      const storyCount = (l.stories || []).length;
      const levelsLabel = (l.levels && l.levels.length)
        ? `${l.levels[0]} → ${l.levels[l.levels.length - 1]} journey`
        : `${storyCount} ${storyCount === 1 ? 'story' : 'stories'}`;
      const teaser = l.teaser || '';

      return `
        <div class="glass journey-card" data-enter-lang="${escapeHtml(l.id)}">
          ${coverArt}
          <div class="jc-overlay"></div>
          <div class="jc-flag">${l.flag || ''}</div>
          <div class="jc-body">
            <div class="jc-name">${escapeHtml(l.name).toUpperCase()}</div>
            ${teaser ? `<div class="jc-teaser">${escapeHtml(teaser)}</div>` : ''}
            <div class="jc-progress-bar"><div class="jc-progress-fill" style="width: ${masteredPct}%"></div></div>
            <div class="jc-meta">
              <span>${levelsLabel}</span>
              <span>${storyCount} ${storyCount === 1 ? 'story' : 'stories'} · ${masteredPct}% mastered</span>
            </div>
          </div>
        </div>
      `;
    }

    /* Library drilled into a single language — shows story tiles. */
    function renderLibraryDrilldown(langId) {
      const lang = state.languages[langId] || getActiveLang();
      const hero = renderHeroCover(lang);
      const back = `
        <div class="back-bar">
          <button class="back-btn" data-back-to-langs="1">← Languages</button>
          <span class="back-context">${escapeHtml(lang.name)}</span>
        </div>
      `;

      if (!lang.stories.length) {
        return back + hero + `<div class="glass empty-state">
          <div class="em-icon">📚</div>
          No stories yet for ${escapeHtml(lang.name)}.
        </div>` + renderProgressSection();
      }

      const cards = lang.stories.map(storyId => renderStoryTile(lang, storyId)).join('');
      return back + hero + cards + renderProgressSection();
    }

    /* Story tile rendered inside the drilled-in library view. Adds a
       small completion badge based on per-story mastery percentage. */
    function renderStoryTile(lang, storyId) {
      const story = getStory(lang.id, storyId);
      if (!story) return '';
      const stats = getStats(state, lang.id, storyId);
      const total = stats.total;
      const masteredPct = total ? Math.round((stats.mastered / total) * 100) : 0;
      const grammarCount = (story.grammarRules || []).length;
      const coverHtml = renderStoryCover(lang.id, story);
      const cardClass = coverHtml ? 'glass story-card with-cover' : 'glass story-card';

      // Phase signals — drill activity vs. mid-flight first-read. Cards
      // with reps>0 only happen once drill flow starts; first-read alone
      // doesn't grade anything, so we also peek at storyProgress.
      const prog = (lang.storyProgress && lang.storyProgress[storyId]) || null;
      const drillStarted = (stats.total - stats.new) > 0;
      const inFirstReadActive = !!prog && prog.phase === 'first-read' &&
        (prog.firstReadStep > 1 || (prog.step1Phase && prog.step1Phase !== 'intro'));

      // Completion badge: rough proxy until Stage D wires real drill-flow gating.
      let badgeHtml = '';
      if (masteredPct >= 80) {
        badgeHtml = `<span class="story-badge done">✓ Done</span>`;
      } else if (drillStarted) {
        badgeHtml = `<span class="story-badge">In progress</span>`;
      } else if (inFirstReadActive) {
        badgeHtml = `<span class="story-badge">Intro · Step ${prog.firstReadStep}/6</span>`;
      }

      // Action label — drill activity wins; mid-flight first-read shows
      // "Continue intro"; otherwise it's a fresh start.
      const actionLabel = drillStarted
        ? 'Continue Learning →'
        : (inFirstReadActive ? 'Continue intro →' : 'Start →');

      return `
        <div class="${cardClass}">
          ${coverHtml}
          ${badgeHtml}
          <div class="tags">
            <span class="tag-pill">${escapeHtml(story.level)}</span>
            <span class="tag-pill">Story #${story.order || 1}</span>
          </div>
          <div class="story-title gradient-text">${escapeHtml(story.title)}</div>
          ${story.synopsis ? `<div class="story-meta" style="margin-bottom: 10px;">${escapeHtml(story.synopsis)}</div>` : ''}
          <div class="story-meta">${story.sentences.length} sentences · ${grammarCount} grammar rules</div>
          <div class="progress"><div class="progress-fill" style="width: ${masteredPct}%"></div></div>
          <div class="story-foot">${stats.mastered} / ${total} mastered · ${stats.due} due today</div>
          <button class="gradient-btn" data-open-story="${escapeHtml(storyId)}">
            ${actionLabel}
          </button>
        </div>
      `;
    }

    /* Hero cover at top of Library: uploaded image overrides default
       per-language SVG art. Keeps the layout if neither is present
       (renders a gradient fallback). */
    function renderHeroCover(lang) {
      if (!lang) return '';
      const uploaded = lang.coverImage || null;
      const svgArt = !uploaded ? getDefaultCoverSvg(lang.id) : null;

      const bgStyle = uploaded
        ? `background-image: url('${escapeHtml(uploaded)}');`
        : '';
      const artHtml = !uploaded && svgArt
        ? `<div class="cover-art">${svgArt}</div>`
        : !uploaded
          ? `<div class="cover-art" style="background: linear-gradient(135deg, var(--grad-1), var(--grad-2) 55%, var(--grad-3));"></div>`
          : '';

      const totalStories = (lang.stories || []).length;
      const sub = `${totalStories} ${totalStories === 1 ? 'story' : 'stories'}`;

      return `
        <div class="hero-cover" style="${bgStyle}">
          ${artHtml}
          <div class="hero-overlay"></div>
          <div class="hero-title">
            <div>
              <div class="hero-name">${escapeHtml(lang.name).toUpperCase()}</div>
              <div class="hero-sub">${sub}</div>
            </div>
            <div class="hero-flag">${lang.flag || ''}</div>
          </div>
        </div>
      `;
    }

    /* Per-story cover panel, shown on the right side of the story tile.
       Falls back to the language's default SVG art when no upload. */
    function renderStoryCover(langId, story) {
      const uploaded = story && story.coverImage;
      if (uploaded) {
        return `<div class="story-cover" style="background-image: url('${escapeHtml(uploaded)}');"></div>`;
      }
      const svgArt = getDefaultCoverSvg(langId);
      if (svgArt) {
        return `<div class="story-cover svg-cover">${svgArt}</div>`;
      }
      return '';
    }

    /* ---------- Library: collapsible Progress section ---------- */
    function getActivityByDay(days = 30) {
      // Last `days` days inclusive of today, oldest → newest. Each entry
      // sums session.count for the active language across all stories.
      const langId = state.activeLanguageId;
      const sessions = state.sessions || [];
      const byDate = new Map();
      for (const s of sessions) {
        if (s.languageId && s.languageId !== langId) continue;
        byDate.set(s.date, (byDate.get(s.date) || 0) + (s.count || 0));
      }
      const out = [];
      const cur = new Date();
      cur.setHours(0, 0, 0, 0);
      cur.setDate(cur.getDate() - (days - 1));
      for (let i = 0; i < days; i++) {
        const y = cur.getFullYear();
        const m = String(cur.getMonth() + 1).padStart(2, '0');
        const dd = String(cur.getDate()).padStart(2, '0');
        const key = `${y}-${m}-${dd}`;
        out.push({ date: key, count: byDate.get(key) || 0 });
        cur.setDate(cur.getDate() + 1);
      }
      return out;
    }

    // Distinct lowercase German tokens across all mastered cards
    // (interval >= 21) for the active language.
    function getMasteredVocabCount() {
      const langId = state.activeLanguageId;
      const lang = state.languages[langId];
      const tokens = new Set();
      const wordRe = /[a-zA-ZÀ-ſß]+/g;
      for (const cardId in state.cards) {
        if (!cardId.startsWith(`${langId}::`)) continue;
        const card = state.cards[cardId];
        if (card.interval < MASTERED_INTERVAL_DAYS) continue;
        const [, storyId, idxStr] = cardId.split('::');
        const story = state.storiesData[`${langId}::${storyId}`];
        if (!story) continue;
        const sentence = story.sentences[parseInt(idxStr, 10)];
        if (!sentence || !sentence.de) continue;
        const ms = sentence.de.match(wordRe);
        if (ms) for (const w of ms) tokens.add(w.toLowerCase());
      }
      return tokens.size;
    }

    // Smooth bezier path through the daily counts. Y is inverted because
    // SVG (0,0) is top-left.
    function buildSparklinePath(values, w, h) {
      if (values.length === 0) return '';
      const max = Math.max(1, ...values);
      const stepX = w / Math.max(1, values.length - 1);
      const pad = 4;
      const usableH = h - pad * 2;
      const points = values.map((v, i) => [
        i * stepX,
        pad + (1 - v / max) * usableH
      ]);
      let d = `M ${points[0][0].toFixed(1)} ${points[0][1].toFixed(1)}`;
      for (let i = 1; i < points.length; i++) {
        const [x0, y0] = points[i - 1];
        const [x1, y1] = points[i];
        const cx = (x0 + x1) / 2;
        d += ` C ${cx.toFixed(1)} ${y0.toFixed(1)}, ${cx.toFixed(1)} ${y1.toFixed(1)}, ${x1.toFixed(1)} ${y1.toFixed(1)}`;
      }
      return d;
    }

    function renderProgressSection() {
      const open = !!state.settings.progressOpen;
      const streak = getStreak(state);
      const activity = getActivityByDay(30);
      const totalCards = activity.reduce((a, x) => a + x.count, 0);
      const vocab = getMasteredVocabCount();

      // Sparkline SVG.
      const w = 720, h = 80;
      const counts = activity.map(a => a.count);
      const path = buildSparklinePath(counts, w, h);
      const svg = `
        <svg class="sparkline" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
          <defs>
            <linearGradient id="sparkGrad" x1="0" x2="1" y1="0" y2="0">
              <stop offset="0%" stop-color="var(--grad-1)"/>
              <stop offset="60%" stop-color="var(--grad-2)"/>
              <stop offset="100%" stop-color="var(--grad-3)"/>
            </linearGradient>
            <filter id="sparkGlow" x="-10%" y="-10%" width="120%" height="120%">
              <feGaussianBlur stdDeviation="2" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <path d="${path}" fill="none" stroke="url(#sparkGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#sparkGlow)"/>
        </svg>
      `;

      // Per-story accuracy rows.
      const lang = getActiveLang();
      const storyRows = lang.stories.map(storyId => {
        const story = getStory(lang.id, storyId);
        if (!story) return '';
        const prefix = `${lang.id}::${storyId}::`;
        let attempts = 0, correct = 0;
        for (const k in state.testAttempts) {
          if (!k.startsWith(prefix)) continue;
          attempts += state.testAttempts[k].attempts;
          correct  += state.testAttempts[k].correct;
        }
        const acc = attempts > 0 ? Math.round(correct / attempts * 100) : 0;
        return `
          <div class="item-row">
            <div class="grow">
              <div class="title">${escapeHtml(story.title)}</div>
              <div class="meta">${attempts} test attempts · ${acc}% accuracy</div>
            </div>
          </div>
        `;
      }).join('');

      const body = open ? `
        <div class="progress-body">
          <div class="streak-display">
            <div class="num gradient-text">🔥 ${streak}</div>
            <div class="lbl">Day streak</div>
          </div>
          <div class="sparkline-wrap">${svg}</div>
          <div class="vocab-line">
            <span class="num">${vocab}</span> distinct ${escapeHtml(targetLangNameLower())} words mastered ·
            <span class="num">${totalCards}</span> cards in last 30 days
          </div>
          <div class="row-list">${storyRows || '<div style="font-size:12px;color:var(--text-soft);text-align:center">No stories yet.</div>'}</div>
        </div>
      ` : '';

      return `
        <div class="glass progress-section">
          <button id="progress-toggle" class="progress-toggle ${open ? 'open' : ''}">
            <span>📈 Progress</span>
            <span class="arrow">›</span>
          </button>
          ${body}
        </div>
      `;
    }

    function renderRead() {
      const lang = getActiveLang();
      const storyId = lang.lastStoryId;
      if (!storyId) {
        return `<div class="glass empty-state">
          <div class="em-icon">📖</div>
          Pick a story from Library to start reading.
        </div>`;
      }
      const story = getStory(lang.id, storyId);
      if (!story) return `<div class="glass empty-state">Story not found.</div>`;

      const progress = getStoryProgress(lang.id, storyId);
      if (progress && progress.phase === 'first-read') {
        return renderFirstRead(lang, story, progress);
      }
      if (progress && progress.phase === 'drill-flow') {
        return renderDrillFlow(lang, story, progress);
      }
      if (progress && progress.phase === 'free-practice') {
        return renderFreePractice(lang, story, progress);
      }
      return renderReadLegacy(lang, story);
    }

    function renderReadLegacy(lang, story) {
      const mode = lang.readMode || 'full';
      const toggle = `
        <div class="read-toggle">
          <button class="${mode === 'full' ? 'active' : ''}" data-read-mode="full">Full Text</button>
          <button class="${mode === 'sentence' ? 'active' : ''}" data-read-mode="sentence">Sentence by Sentence</button>
        </div>
      `;

      if (mode === 'full') {
        const proseHtml = story.sentences.map((s, i) =>
          `<span class="sent" data-sent-idx="${i}">${escapeHtml(s.de)}</span>`
        ).join(' ');
        const englishHtml = story.sentences.map(s => escapeHtml(s.en)).join(' ');
        return `
          ${toggle}
          <div class="play-bar">
            <button class="gradient-btn" id="btn-play-all">${playback.active ? '⏹  Stop' : '🔊  Listen to whole story'}</button>
          </div>
          <div class="glass story-prose">${proseHtml}</div>
          <button class="ghost-btn english-toggle" id="btn-toggle-english" data-shown="0">Show English ↓</button>
          <div class="glass english-block" id="english-block" style="display: none;">${englishHtml}</div>
        `;
      }

      // Sentence-by-sentence mode
      const rows = story.sentences.map((s, i) => `
        <div class="glass sentence-row" data-sent-idx="${i}" data-speak="${escapeHtml(s.de)}">
          <div class="de">${escapeHtml(s.de)}</div>
          <div class="en">${escapeHtml(s.en)}</div>
          ${s.note ? `<div class="note">${escapeHtml(s.note)}</div>` : ''}
        </div>
      `).join('');
      return `
        ${toggle}
        <div class="play-bar">
          <button class="gradient-btn" id="btn-play-all">${playback.active ? '⏹  Stop' : '🔊  Listen to whole story'}</button>
        </div>
        ${rows}
      `;
    }

    /* ============================================================
       FIRST-READ FLOW — 6 fixed steps per UX spec §4.
       Step 1 atmosphere listen, Step 2 grammar preview,
       Step 3 sentence walk, Step 4 vocab walk,
       Step 5 closing listen, Step 6 drill-flow unlock.
       Progress per (user, lang, story) lives on lang.storyProgress[storyId].
       ============================================================ */

    function frStepLabel(step) {
      return ({
        1: 'Atmosphere',
        2: 'Grammar preview',
        3: 'Sentence walk',
        4: 'Vocab walk',
        5: 'Closing listen',
        6: 'Drill flow unlocked'
      })[step] || '';
    }

    function frStepPill(step) {
      // Top bar: step indicator + always-visible save-and-exit. State is
      // already persisted on every setStoryProgress, so the button just
      // navigates back; resuming the story drops the learner exactly here.
      return `
        <div class="fr-top-row">
          <div class="fr-step-pill">Step ${step} of 6 · ${escapeHtml(frStepLabel(step))}</div>
          <button class="ghost-btn fr-exit-btn" data-fr-exit="1" title="Progress is saved automatically">Save &amp; exit</button>
        </div>
      `;
    }

    // Vocabulary words flagged "new" for this story. Falls back to all
    // vocab if normalization didn't tag a status (legacy stories).
    function getNewVocab(story) {
      const all = Array.isArray(story.vocabulary) ? story.vocabulary : [];
      const flagged = all.filter(v => v && v._status === 'new');
      return flagged.length ? flagged : all;
    }

    // Grammar rules flagged "new" for this story. Same fallback shape.
    function getNewGrammar(story) {
      const rules = Array.isArray(story.grammarRules) ? story.grammarRules : [];
      const flagged = rules.filter(r => r && r._status === 'new');
      return flagged.length ? flagged : rules.filter(r => r.tier === 1);
    }

    function renderFirstRead(lang, story, progress) {
      const step = Math.min(Math.max(progress.firstReadStep || 1, 1), 6);
      switch (step) {
        case 1: return renderFRStep1(lang, story, progress);
        case 2: return renderFRStep2(lang, story, progress);
        case 3: return renderFRStep3(lang, story, progress);
        case 4: return renderFRStep4(lang, story, progress);
        case 5: return renderFRStep5(lang, story, progress);
        case 6: return renderFRStep6(lang, story, progress);
        default: return renderFRStep1(lang, story, progress);
      }
    }

    /* Step 1 — Atmosphere listen.
       intro phase: cover + EN atmosphere intro plays.
       narration phase: cover + IT sentences, sync-highlighted, EN toggle.
       done phase: cover + soft message + Continue. */
    function renderFRStep1(lang, story, progress) {
      const phase = progress.step1Phase || 'intro';
      const coverHtml = renderStoryCover(lang.id, story) ||
        `<div class="story-cover" style="background: linear-gradient(135deg, var(--grad-1), var(--grad-3));"></div>`;
      const intro = story._atmosphereIntro || story.synopsis || '';
      const narratorPrompt = lang.id === 'it' ? '' : '';

      if (phase === 'intro') {
        return `
          ${frStepPill(1)}
          <div class="fr-cover-wrap">${coverHtml}</div>
          <div class="glass fr-listen-card">
            <div class="fr-pulse"><span></span><span></span><span></span></div>
            <div class="fr-listen-title">Setting the scene…</div>
            <div class="fr-listen-sub">Listen — no need to read.</div>
            <div class="fr-listen-actions">
              <button class="ghost-btn" data-fr-replay-intro="1">🔊 Replay</button>
              <button class="ghost-btn" data-fr-skip-to="narration">Skip to story →</button>
            </div>
          </div>
        `;
      }

      if (phase === 'narration') {
        const showEng = !!progress.showEnglish;
        const rows = story.sentences.map((s, i) => `
          <div class="fr-narr-row" data-sent-idx="${i}">
            <div class="de">${escapeHtml(s.de)}</div>
            ${showEng ? `<div class="en">${escapeHtml(s.en)}</div>` : ''}
          </div>
        `).join('');
        return `
          ${frStepPill(1)}
          <div class="fr-cover-wrap fr-cover-thin">${coverHtml}</div>
          <div class="play-bar">
            <button class="gradient-btn" id="btn-play-all">${playback.active ? '⏹  Stop' : '🔊  Listen to the story'}</button>
            <button class="ghost-btn fr-eng-toggle" data-fr-toggle-english="1">${showEng ? 'EN: on' : 'EN: off'}</button>
          </div>
          <div class="glass fr-narration-list">${rows}</div>
          <button class="ghost-btn full-btn" data-fr-skip-to="done">I'm ready to continue →</button>
        `;
      }

      // done
      return `
        ${frStepPill(1)}
        <div class="fr-cover-wrap">${coverHtml}</div>
        <div class="glass fr-soft-card">
          <div class="fr-soft-title">${escapeHtml(story.title)}</div>
          <div class="fr-soft-msg">Don't worry if you didn't grasp it all — you'll go through this sentence by sentence next.</div>
          <button class="gradient-btn full-btn" data-fr-continue="1">Continue →</button>
        </div>
      `;
    }

    /* Step 2 — Grammar preview. Reuses the rich renderRuleCard so the
       learner sees the same explanation + examples + tips + paradigm
       tables they'll meet in the Rules tab — no formal sparse text. */
    function renderFRStep2(lang, story, progress) {
      const rules = getNewGrammar(story);
      const list = rules.length
        ? rules.map(r => renderRuleCard(r, r.tier || 1)).join('')
        : `<div class="glass empty-state">No new grammar in this chapter — straight to the sentences.</div>`;

      return `
        ${frStepPill(2)}
        <div class="fr-section-intro">A quick look at what's new before you start.</div>
        ${list}
        <button class="gradient-btn full-btn" data-fr-continue="1">Continue →</button>
      `;
    }

    /* Step 3 — Sentence walk. One sentence at a time. New vocab
       highlighted; tap → translation popover. Progress "12 / N". */
    function renderFRStep3(lang, story, progress) {
      const sentences = story.sentences || [];
      const n = sentences.length;
      const idx = Math.min(Math.max(progress.sentenceIdx || 0, 0), Math.max(0, n - 1));
      const s = sentences[idx];
      if (!s) return `<div class="glass empty-state">No sentences in this story.</div>`;

      const newVocab = getNewVocab(story);
      // Mark vocabulary tokens by simple word-boundary substitution.
      // Uses dotted underline + tap-to-translate.
      const markedDe = markVocabInSentence(s.de, newVocab);

      const isLast = idx === n - 1;
      const prevDisabled = idx === 0 ? 'disabled' : '';
      const nextLabel = isLast ? 'Continue →' : 'Next →';

      return `
        ${frStepPill(3)}
        <div class="fr-progress-line">${idx + 1} / ${n}</div>
        <div class="glass fr-sentence-card">
          <div class="fr-sentence-de">${markedDe}</div>
          <div class="fr-sentence-en">${escapeHtml(s.en)}</div>
          <div class="audio-row">
            <button class="audio-btn" data-fr-speak="${escapeHtml(s.de)}">🔊 ${speakLabelForActive()}</button>
          </div>
          ${s.note ? `<div class="note-callout">${escapeHtml(s.note)}</div>` : ''}
        </div>
        <div id="fr-vocab-popover" class="fr-vocab-popover" style="display:none;"></div>
        <div class="fr-nav-row">
          <button class="ghost-btn" data-fr-sent-prev="1" ${prevDisabled}>← Prev</button>
          <button class="gradient-btn" data-fr-sent-next="1">${nextLabel}</button>
        </div>
      `;
    }

    // Wrap each new-vocab head word inside the sentence with a tappable
    // span. Cheap, case-insensitive, whole-word match. Renders escaped.
    // Protagonist substitution must happen up front: the tokenizer below
    // would otherwise slice "{{PROTAGONIST}}" into "{{" / "PROTAGONIST" /
    // "}}", and escapeHtml's substitution (keyed on the full literal)
    // would no longer match.
    function markVocabInSentence(sentence, newVocab) {
      const text = substituteProtagonist(String(sentence || ''));
      if (!newVocab || !newVocab.length) return escapeHtml(text);
      // Build a map from lowercased base word → translation. We match
      // tokens character-by-character to preserve original casing/diacritics.
      const dict = {};
      newVocab.forEach(v => {
        const w = String(v.de || '').toLowerCase().trim();
        if (w) dict[w] = v;
      });
      // Tokenize on Unicode word boundaries that keep accented letters.
      const out = [];
      const re = /([\p{L}\p{M}'’]+)|([^\p{L}\p{M}'’]+)/gu;
      let m;
      while ((m = re.exec(text)) !== null) {
        if (m[1]) {
          const lower = m[1].toLowerCase();
          if (dict[lower]) {
            const v = dict[lower];
            const trans = v.en || v.translation || '';
            out.push(`<span class="fr-vocab-mark" data-fr-vocab="${escapeHtml(m[1])}" data-fr-vocab-trans="${escapeHtml(trans)}">${escapeHtml(m[1])}</span>`);
          } else {
            out.push(escapeHtml(m[1]));
          }
        } else if (m[2]) {
          out.push(escapeHtml(m[2]));
        }
      }
      return out.join('');
    }

    /* Step 4 — Vocab walk. One word at a time. Word + translation +
       pos + audio + first sentence containing it. */
    function renderFRStep4(lang, story, progress) {
      const vocab = getNewVocab(story);
      const n = vocab.length;
      if (!n) {
        return `
          ${frStepPill(4)}
          <div class="glass empty-state">No new vocabulary tracked for this story.</div>
          <button class="gradient-btn full-btn" data-fr-continue="1">Continue →</button>
        `;
      }
      const idx = Math.min(Math.max(progress.vocabIdx || 0, 0), n - 1);
      const v = vocab[idx];

      // First sentence containing this word (whole-word match).
      const sentences = story.sentences || [];
      const firstSent = findFirstSentenceWith(sentences, v.de);
      const sentHtml = firstSent
        ? `<div class="fr-vocab-context">${markVocabInSentence(firstSent.de, [v])}</div>
           <div class="fr-vocab-context-en">${escapeHtml(firstSent.en)}</div>`
        : '';

      const speakText = vocabSpeakText(v);
      const posLabel = v.pos ? `${v.pos}${v.gender ? ' · ' + v.gender : ''}` : (v.gender || '');

      const isLast = idx === n - 1;
      const prevDisabled = idx === 0 ? 'disabled' : '';
      const nextLabel = isLast ? 'Continue →' : 'Next →';

      return `
        ${frStepPill(4)}
        <div class="fr-progress-line">${idx + 1} / ${n}</div>
        <div class="glass fr-vocab-card">
          ${posLabel ? `<div class="fr-vocab-pos"><span class="rule-tag">${escapeHtml(posLabel)}</span></div>` : ''}
          <div class="fr-vocab-word gradient-text">${escapeHtml(v.de)}</div>
          <div class="fr-vocab-en">${escapeHtml(v.en || '')}</div>
          <div class="audio-row">
            <button class="audio-btn" data-fr-speak="${escapeHtml(speakText)}">🔊 ${speakLabelForActive()}</button>
          </div>
          ${sentHtml}
        </div>
        <div class="fr-nav-row">
          <button class="ghost-btn" data-fr-vocab-prev="1" ${prevDisabled}>← Prev</button>
          <button class="gradient-btn" data-fr-vocab-next="1">${nextLabel}</button>
        </div>
      `;
    }

    function findFirstSentenceWith(sentences, word) {
      const target = String(word || '').toLowerCase();
      if (!target) return null;
      const re = new RegExp(`(?:^|[^\\p{L}\\p{M}])${escapeRegExp(target)}(?:[^\\p{L}\\p{M}]|$)`, 'iu');
      for (const s of sentences) {
        if (re.test(String(s.de || '').toLowerCase())) return s;
      }
      return null;
    }
    function escapeRegExp(s) {
      return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    /* Step 5 — Closing listen. Cover + IT-only narration, no subtitles.
       Audio auto-plays on enter; "Done" appears when playback finishes. */
    function renderFRStep5(lang, story, progress) {
      const coverHtml = renderStoryCover(lang.id, story) ||
        `<div class="story-cover" style="background: linear-gradient(135deg, var(--grad-1), var(--grad-3));"></div>`;
      const finished = !!progress.step5Finished;
      return `
        ${frStepPill(5)}
        <div class="fr-cover-wrap">${coverHtml}</div>
        <div class="glass fr-listen-card">
          <div class="fr-pulse"><span></span><span></span><span></span></div>
          <div class="fr-listen-title">${finished ? "You've finished your first read." : 'Listen one more time…'}</div>
          <div class="fr-listen-sub">${finished ? 'Come back tomorrow to start practicing.' : 'No subtitles. Notice what you understand.'}</div>
          <div class="fr-listen-actions">
            <button class="ghost-btn" data-fr-replay-closing="1">🔊 ${playback.active ? 'Stop' : (finished ? 'Replay' : 'Play')}</button>
          </div>
        </div>
        ${finished ? `<button class="gradient-btn full-btn" data-fr-continue="1">Done →</button>` : ''}
      `;
    }

    /* Step 6 — Drill flow unlocks. Renders a brief celebration; phase
       gets bumped to 'drill-flow' so subsequent renders fall through to
       the legacy reader (Stage D will replace). */
    function renderFRStep6(lang, story, progress) {
      // Auto-promote on first render of step 6.
      if (progress.phase === 'first-read') {
        setStoryProgress(lang.id, story.id, {
          phase: 'drill-flow',
          firstReadDone: true
        });
      }
      return `
        ${frStepPill(6)}
        <div class="glass fr-celebrate">
          <div class="fr-celebrate-icon">✦</div>
          <div class="fr-celebrate-title gradient-text">First read complete</div>
          <div class="fr-celebrate-msg">The drill flow is now unlocked. Come back tomorrow for the first drill.</div>
          <button class="gradient-btn full-btn" data-fr-finish="1">Back to library</button>
        </div>
      `;
    }

    /* ============================================================
       DRILL FLOW — Stage D. Six gated drills per UX spec §5. Each drill
       has a linear queue + completion check; finishing all six promotes
       the story to free-practice and unlocks the next story.
       Drill 1: vocab recognition (SRS)
       Drill 2: vocab production (EN→IT typed)
       Drill 3: sentence assembly (word tiles)
       Drill 4: dictation (TTS → type)
       Drill 5: rule spotting (multi-choice)
       Drill 6: transfer test (tier 1, with mastery threshold)
       ============================================================ */

    const DRILL_NAMES = {
      1: 'Vocab recognition',
      2: 'Vocab production',
      3: 'Sentence assembly',
      4: 'Dictation',
      5: 'Rule spotting',
      6: 'Transfer test'
    };

    // Drill 1 mastery: 3 successful reviews + interval ≥ 3 days (per spec §7.1).
    const DRILL1_MIN_REPS = 3;
    const DRILL1_MIN_INTERVAL_DAYS = 3;
    // Drill 2: each word answered correctly twice in a row.
    const DRILL2_REQUIRED_STREAK = 2;

    /* ----- Submission normalization (drills 2 + 4 per spec §5) -----
       Strip diacritics, apostrophes, collapse whitespace, lowercase. */
    function normalizeForDrill(s) {
      return String(s || '')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[̀-ͯ]/g, '')        // strip combining diacritics
        .replace(/['’‘`]/g, '')       // strip apostrophes (incl. curly)
        .replace(/[.,!?;:"()«»\[\]{}]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }
    // Loose-equality check: matches even if learner skipped accents/apostrophes.
    function drillAnswerMatches(submitted, expected) {
      return normalizeForDrill(submitted) === normalizeForDrill(expected);
    }
    // Diacritic-only difference (for soft-correct messages).
    function drillSpellingDiffers(submitted, expected) {
      return submitted.trim() !== expected.trim() &&
             drillAnswerMatches(submitted, expected);
    }

    /* ----- Drill 1 mastery check ----- */
    function drill1Mastered(langId, storyId) {
      const story = getStory(langId, storyId);
      if (!story) return false;
      const vocab = Array.isArray(story.vocabulary) ? story.vocabulary : [];
      if (!vocab.length) return true;
      const minMs = DRILL1_MIN_INTERVAL_DAYS * 86400000;
      for (let i = 0; i < vocab.length; i++) {
        const cardId = `${langId}::${storyId}::vocab::${i}`;
        const c = state.cards[cardId];
        if (!c) return false;
        if (c.reps < DRILL1_MIN_REPS) return false;
        // SM-2 interval is in days here; convert and compare.
        if ((c.interval || 0) < DRILL1_MIN_INTERVAL_DAYS) return false;
      }
      return true;
    }

    /* ----- Drill flow top bar ----- */
    function drillTopBar(currentDrill, drillsDone) {
      const dots = [1,2,3,4,5,6].map(n => {
        const cls = drillsDone[n] ? 'done' : (n === currentDrill ? 'current' : '');
        return `<span class="drill-dot ${cls}" title="Drill ${n}: ${escapeHtml(DRILL_NAMES[n])}">${drillsDone[n] ? '✓' : n}</span>`;
      }).join('');
      return `
        <div class="fr-top-row">
          <div class="fr-step-pill">Drill ${currentDrill} of 6 · ${escapeHtml(DRILL_NAMES[currentDrill])}</div>
          <button class="ghost-btn fr-exit-btn" data-fr-exit="1">Save &amp; exit</button>
        </div>
        <div class="drill-track">${dots}</div>
      `;
    }

    /* ----- Drill flow dispatcher ----- */
    function renderDrillFlow(lang, story, progress) {
      // If drill 6 already passed, the phase should be free-practice;
      // safety net here re-checks and promotes if state lagged.
      if (progress.drillsDone[6]) {
        setStoryProgress(lang.id, story.id, { phase: 'free-practice' });
        return renderReadLegacy(lang, story);
      }
      // Auto-skip past completed drills. If currentDrill is marked done,
      // bump to the next pending.
      let cur = progress.currentDrill || 1;
      while (cur < 6 && progress.drillsDone[cur]) cur++;
      if (cur !== progress.currentDrill) {
        setStoryProgress(lang.id, story.id, { currentDrill: cur });
        progress.currentDrill = cur;
      }

      const top = drillTopBar(cur, progress.drillsDone);
      const body =
        cur === 1 ? renderDrill1(lang, story, progress) :
        cur === 2 ? renderDrill2(lang, story, progress) :
        cur === 3 ? renderDrill3(lang, story, progress) :
        cur === 4 ? renderDrill4(lang, story, progress) :
        cur === 5 ? renderDrill5(lang, story, progress) :
                    renderDrill6(lang, story, progress);
      return top + body;
    }

    /* ============================================================
       DRILL 1 — Vocab recognition. Card-based SRS using existing
       sentence/vocab card infrastructure, locked to vocabulary +
       speak mode. Done when every vocab card has reps ≥ 3 and
       interval ≥ 3 days.
       ============================================================ */
    function renderDrill1(lang, story, progress) {
      // Mastery met → mark drill done + advance.
      if (drill1Mastered(lang.id, story.id)) {
        if (!progress.drillsDone[1]) {
          progress.drillsDone[1] = true;
          progress.currentDrill = 2;
          saveState();
        }
        return renderDrillCompleteCard(1, 'Vocab recognized — every word has settled into your memory.');
      }

      // Reuse the existing card-session machinery for queue + grading.
      const session = ensureCardSession(lang.id, story.id, 'speak', 'vocabulary');

      // Queue empty after wrong-pile rotation → "come back" message.
      if (session.queue.length === 0 && session.wrongPile.length === 0) {
        const remaining = countDrill1Remaining(lang.id, story.id);
        return `
          <div class="glass drill-empty">
            <div class="drill-empty-icon">⏳</div>
            <div class="drill-empty-title">No cards due right now.</div>
            <div class="drill-empty-msg">Come back later — ${remaining} ${remaining === 1 ? 'word' : 'words'} still building toward mastery.</div>
            <button class="ghost-btn full-btn" data-fr-exit="1">Save &amp; exit</button>
          </div>
        `;
      }
      // End-of-batch — rotate wrongPile or finish.
      if (session.idx >= session.queue.length) {
        if (session.wrongPile.length > 0) {
          session.queue = session.queue.concat(session.wrongPile);
          session.wrongPile = [];
        } else {
          // Today's session done; mastery may still be incomplete though.
          const remaining = countDrill1Remaining(lang.id, story.id);
          return `
            <div class="glass session-end">
              <div class="se-title gradient-text">✅ Session done</div>
              <div class="se-sub">${remaining} ${remaining === 1 ? 'word' : 'words'} still building toward drill mastery — come back later.</div>
              <button class="ghost-btn full-btn" data-fr-exit="1">Save &amp; exit</button>
            </div>
          `;
        }
      }

      const card = session.queue[session.idx];
      const content = getCardContent(card.id, story);
      if (!content) {
        return `<div class="glass empty-state">Card data missing.</div>`;
      }
      const progressLine = drill1ProgressLine(lang.id, story.id);
      return `
        <div class="drill-progress-line">${progressLine}</div>
        ${renderCardsSpeak(session, card, content)}
      `;
    }

    function countDrill1Remaining(langId, storyId) {
      const story = getStory(langId, storyId);
      const vocab = Array.isArray(story.vocabulary) ? story.vocabulary : [];
      let pending = 0;
      for (let i = 0; i < vocab.length; i++) {
        const cardId = `${langId}::${storyId}::vocab::${i}`;
        const c = state.cards[cardId];
        if (!c || c.reps < DRILL1_MIN_REPS || (c.interval || 0) < DRILL1_MIN_INTERVAL_DAYS) pending++;
      }
      return pending;
    }
    function drill1ProgressLine(langId, storyId) {
      const story = getStory(langId, storyId);
